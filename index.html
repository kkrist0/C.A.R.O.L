// Persistenza su localStorage con la stessa API async di window.storage
window.storage = {
  async get(key) {
    const v = localStorage.getItem("C.A.R.O.L._" + key);
    if (v === null) throw new Error("not found");
    return { key, value: v };
  },
  async set(key, value) { localStorage.setItem("C.A.R.O.L._" + key, value); return { key, value }; },
  async delete(key) { localStorage.removeItem("C.A.R.O.L._" + key); return { key, deleted: true }; },
  async list(prefix = "") {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith("C.A.R.O.L._" + prefix)) keys.push(k.slice(7));
    }
    return { keys };
  },
};


/* ============================================================
   C.A.R.O.L. — Casual and Almost Reliable Overarching Life-system
   Persistenza: window.storage (autosave, backup, cestino, versioning)
   ============================================================ */

const STORAGE_KEY = "C.A.R.O.L.:data";
const BACKUP_PREFIX = "C.A.R.O.L.:backup:";
const DATA_VERSION = 1;
const eur = (n) => new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" }).format(n || 0);
const eur0 = (n) => new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n || 0);
const fmtDate = (d) => new Date(d).toLocaleDateString("it-IT", { day: "2-digit", month: "short", year: "numeric" });
const monthKey = (d) => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}`; };
const mkOf = (y, m) => `${y}-${String(m + 1).padStart(2, "0")}`;
const parseMk = (mk) => ({ y: +mk.slice(0, 4), m: +mk.slice(5, 7) - 1 });
const addMonthsMk = (mk, n) => { const { y, m } = parseMk(mk); const d = new Date(y, m + n, 1); return mkOf(d.getFullYear(), d.getMonth()); };
const endOfMonthIso = (mk) => { const { y, m } = parseMk(mk); return `${y}-${String(m + 1).padStart(2, "0")}-${String(new Date(y, m + 1, 0).getDate()).padStart(2, "0")}`; };
const labelMk = (mk) => { const { y, m } = parseMk(mk); const s = new Date(y, m, 1).toLocaleDateString("it-IT", { month: "long", year: "numeric" }); return s.charAt(0).toUpperCase() + s.slice(1); };
const labelMkShort = (mk) => { const { y, m } = parseMk(mk); return new Date(y, m, 1).toLocaleDateString("it-IT", { month: "short", year: "2-digit" }); };
const YEAR_MIN = 2024, YEAR_MAX = Math.max(2028, new Date().getFullYear() + 1);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const todayISO = () => new Date().toISOString().slice(0, 10);

/* ------------------ Dati di default ------------------ */
const DEFAULT_CATEGORIES = [];

const ACCOUNT_TYPES = [ 'Conto corrente', 'Carta di credito', 'Conto virtuale', 'Contanti', 'Altro'];
const ACCOUNT_ICON_BY_TYPE = { "Conto corrente": "🏦", "Carta di credito": "💳", "Conto virtuale": "📲", "Contanti": "💵", "Altro": "💼" };
const DEFAULT_ACCOUNT_TYPES = [
  { tipo: 'Conto corrente', icona: '🏦' },
  { tipo: 'Carta di credito', icona: '💳' },
  { tipo: 'Conto virtuale', icona: '📲' },
  { tipo: 'Contanti', icona: '💵' },
  { tipo: 'Altro', icona: '💼' },
];
const DEFAULT_ACCOUNTS = [];

function seedTransactions() {
  const txs = [];
  const now = new Date();
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  for (let m = 4; m >= 0; m--) {
    const base = new Date(now.getFullYear(), now.getMonth() - m, 1);
    const ym = (day) => new Date(base.getFullYear(), base.getMonth(), day).toISOString().slice(0, 10);
    txs.push({ id: uid(), tipo: "entrata", importo: 1850, data: ym(27), categoria: "stipendio", conto: "cc", metodo: "Bonifico", note: "Stipendio mensile", tags: ["ricorrente"] });
    txs.push({ id: uid(), tipo: "spesa", importo: 620, data: ym(3), categoria: "affitto", conto: "cc", metodo: "Bonifico", note: "Affitto", tags: ["ricorrente"] });
    txs.push({ id: uid(), tipo: "spesa", importo: 55 + Math.round(Math.random() * 40), data: ym(8), categoria: "bollette", conto: "cc", metodo: "Addebito", note: "Luce e gas", tags: [] });
    for (let i = 0; i < 4; i++) txs.push({ id: uid(), tipo: "spesa", importo: 28 + Math.round(Math.random() * 45), data: ym(4 + i * 6), categoria: "spesa", conto: pick(["cc", "carta"]), metodo: "Carta", note: "Supermercato", tags: [] });
    txs.push({ id: uid(), tipo: "spesa", importo: 45 + Math.round(Math.random() * 35), data: ym(11), categoria: "ristoranti", conto: "carta", metodo: "Carta", note: "Cena fuori", tags: [] });
    txs.push({ id: uid(), tipo: "spesa", importo: 30 + Math.round(Math.random() * 25), data: ym(15), categoria: "benzina", conto: "carta", metodo: "Carta", note: "Rifornimento", tags: [] });
    txs.push({ id: uid(), tipo: "spesa", importo: 200, data: ym(28), categoria: "etf", conto: "cc", metodo: "Bonifico", note: "PAC mensile", tags: ["investimento", "ricorrente"] });
    if (m % 2 === 0) txs.push({ id: uid(), tipo: "spesa", importo: 60 + Math.round(Math.random() * 90), data: ym(18), categoria: "shopping", conto: "carta", metodo: "Carta", note: "Acquisti online", tags: [] });
    if (m === 1) txs.push({ id: uid(), tipo: "entrata", importo: 240, data: ym(20), categoria: "freelance", conto: "cc", metodo: "Bonifico", note: "Progetto extra", tags: [] });
  }
  return txs.filter((t) => new Date(t.data) <= now).sort((a, b) => b.data.localeCompare(a.data));
}

function freshData(withDemo) {
  return {
    version: DATA_VERSION,
    createdAt: new Date().toISOString(),
    transactions: withDemo ? seedTransactions() : [],
    accounts: DEFAULT_ACCOUNTS,
    accountTypes: DEFAULT_ACCOUNT_TYPES,
    categories: DEFAULT_CATEGORIES.map((c, i) => ({ ...c, ordine: i, sottocategorie: [] })),
    groups: ["Needs", "Wants", "Investimenti", "Entrate"],
    budgets: { affitto: 650, spesa: 220, ristoranti: 150, benzina: 120, shopping: 120, bollette: 110 },
    goals: [
      { id: uid(), nome: "Fondo emergenza", target: 5000, salvato: 2600, colore: "#5EEAD4" },

    trips: [],

    settings: { theme: "dark", onboarded: false, patrimonioToggles: { liquidi: true, investimenti: false, tfr: false } },
    saveCount: 0,

/* ============================================================
   GEO DATA — mappa mondiale vettoriale (Natural Earth 110m, semplificata)
   COUNTRY_PATHS: nome → path SVG in viewBox 1000x520 (equirettangolare, lat 84..-58)

const geoToXY = (lat, lon) => ({
  x: ((lon + 180) / 360) * MAP_W,
  y: ((MAP_LAT_TOP - Math.max(MAP_LAT_BOT, Math.min(MAP_LAT_TOP, lat))) / (MAP_LAT_TOP - MAP_LAT_BOT)) * MAP_H,
});

/** distanza in km tra due punti (haversine) */
const haversine = (a, b) => {
  const R = 6371, toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(b[0] - a[0]), dLon = toRad(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.sin(dLon / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(h)));
};

/**
 * @typedef {Object} Transazione
 * @property {string} id
 * @property {'spesa'|'entrata'|'trasferimento'} tipo
 * @property {number} importo
 * @property {string} data           ISO yyyy-mm-dd
 * @property {string|null} categoria
 * @property {string} [sottocategoria]
 * @property {string} conto
 * @property {string} [contoDest]
 * @property {string} [metodo]
 * @property {string} [note]
 * @property {string[]} tags
 * @property {string} [deletedAt]    soft delete (cestino)
 *
 * @typedef {Object} Conto
 * @property {string} id @property {string} nome @property {string} tipo
 * @property {string} icona @property {string} colore @property {number} saldoIniziale
 *
 * @typedef {Object} Categoria
 * @property {string} id @property {string} nome @property {string} gruppo
 * @property {string} icona @property {string} colore
 * @property {string[]} sottocategorie @property {number} ordine
 *
 * @typedef {Object} Obiettivo
 * @property {string} id @property {string} nome @property {number} target
 * @property {number} salvato @property {string} colore
 *
 * @typedef {Object} AppState
 * @property {Transazione[]} transactions @property {Conto[]} accounts
 * @property {Categoria[]} categories @property {Record<string,number>} budgets
 * @property {Obiettivo[]} goals @property {string[]} groups
 */

const n = (v) => { const x = Number(String(v ?? "").replace(/\s/g, "").replace(",", ".")); return Number.isFinite(x) ? x : 0; };
const s = (v) => (v == null ? "" : String(v));
const splitGroups = (v) => (v == null ? [] : String(v).split(/[|,]/).map((g) => g.trim()).filter(Boolean));
const getCategoryGroups = (cat) => (cat ? splitGroups(cat.gruppo) : []);
const getCategoryGroupLabel = (cat) => { const groups = getCategoryGroups(cat); return groups.length > 1 ? groups.join(" / ") : groups[0] || "Wants"; };
const getTxGroup = (tx, catById) => (tx?.gruppo || (tx?.categoria ? getCategoryGroups(catById?.[tx.categoria])[0] : "") || "");

/** Schema dei fogli: ogni entità sa come diventare righe e come tornare oggetti. */
const SHEET_SCHEMA = {

    pack: (st) => st.transactions.map((t) => [t.id, t.data, t.tipo, s(t.categoria), s(t.sottocategoria), t.importo, s(t.conto), s(t.contoDest), s(t.metodo), s(t.note), (t.tags || []).join("|"), s(t.gruppo), s(t.deletedAt)]),
    unpack: (rows) => rows.filter((r) => s(r[0])).map((r) => {
      const t = { id: s(r[0]), data: s(r[1]).slice(0, 10), tipo: s(r[2]) || "spesa", categoria: s(r[3]) || null, sottocategoria: s(r[4]), importo: n(r[5]), conto: s(r[6]), contoDest: s(r[7]) || undefined, metodo: s(r[8]), note: s(r[9]), tags: s(r[10]) ? s(r[10]).split("|").filter(Boolean) : [], gruppo: s(r[11]) || undefined };
      if (s(r[12])) t.deletedAt = s(r[12]);
      return t;
    }),
  },

  },
  accountTypes: {
    sheet: "TipiConto",
    headers: ["Tipo", "Icona"],
    pack: (st) => (st.accountTypes || []).map((a) => [a.tipo, a.icona || ""]),
    unpack: (rows) => rows.filter((r) => s(r[0])).map((r) => ({ tipo: s(r[0]), icona: s(r[1]) || ACCOUNT_ICON_BY_TYPE[s(r[0])] || "💼" })),

/* ---------------- services/googleSheetsService ---------------- */
class SyncError extends Error {
  constructor(message, { retriable = true, hint = "" } = {}) { super(message); this.name = "SyncError"; this.retriable = retriable; this.hint = hint; }
}

const googleSheetsService = {
  /** Chiamata all'endpoint Apps Script. text/plain evita il preflight CORS. */
  async call(url, payload, { timeout = 20000 } = {}) {
    if (!url || !/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) {
      throw new SyncError("URL dell'app web non valido.", { retriable: false, hint: "Deve iniziare con https://script.google.com/macros/s/…" });
    }
    if (typeof navigator !== "undefined" && navigator.onLine === false) {
      throw new SyncError("Nessuna connessione a internet.", { hint: "Le modifiche restano salvate in locale e verranno inviate al ritorno online." });
    }
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    let res;
    try {
      res = await fetch(url, { method: "POST", body: JSON.stringify(payload), headers: { "Content-Type": "text/plain;charset=utf-8" }, redirect: "follow", signal: ctrl.signal });
    } catch (e) {
      clearTimeout(timer);
      if (e.name === "AbortError") throw new SyncError("Tempo scaduto: il foglio non ha risposto in tempo.", { hint: "Riprova tra qualche istante." });
      throw new SyncError("Impossibile raggiungere il foglio.", { hint: "Verifica la connessione e che l'app web sia pubblicata per \"Chiunque\"." });
    }
    clearTimeout(timer);
    if (res.status === 401 || res.status === 403) throw new SyncError("Accesso negato dallo script.", { retriable: false, hint: "Ripubblica l'app web con accesso \"Chiunque\" e verifica il token." });
    if (res.status === 404) throw new SyncError("Endpoint non trovato.", { retriable: false, hint: "Controlla l'URL: forse lo script è stato ripubblicato con un nuovo indirizzo." });
    if (res.status === 429) throw new SyncError("Troppe richieste: limite di Google raggiunto.", { hint: "Attendi un minuto e riprova." });
    if (!res.ok) throw new SyncError(`Errore del server (${res.status}).`);
    const text = await res.text();
    let json;
    try { json = JSON.parse(text); } catch { throw new SyncError("Risposta non valida dallo script.", { retriable: false, hint: "Di solito significa che l'app web chiede il login: ripubblicala con accesso \"Chiunque\"." }); }
    if (json.ok === false) throw new SyncError(json.error || "Lo script ha segnalato un errore.", { retriable: false, hint: json.hint || "" });
    return json;
  },
  read: (cfg) => googleSheetsService.call(cfg.url, { action: "read", token: cfg.token, sheets: SCHEMA_KEYS.map((k) => SHEET_SCHEMA[k].sheet) }),
  write: (cfg, sheets) => googleSheetsService.call(cfg.url, { action: "write", token: cfg.token, sheets }, { timeout: 30000 }),
  ping: (cfg) => googleSheetsService.call(cfg.url, { action: "ping", token: cfg.token }, { timeout: 12000 }),
};

class LocalProvider extends DataProvider {
  get id() { return "local"; }
  async read() { try { const r = await window.storage.get(STORAGE_KEY); return r?.value ? JSON.parse(r.value) : null; } catch { return null; } }
  async write(state) { await window.storage.set(STORAGE_KEY, JSON.stringify(state)); return true; }

/** Google Sheets via Apps Script: lettura e scrittura complete. */
class GoogleSheetsProvider extends DataProvider {
  constructor(cfg) { super(); this.cfg = cfg; }
  get id() { return "sheets"; }
  async ping() { const r = await googleSheetsService.ping(this.cfg); return { ok: true, title: r.title || "" }; }
  /** @returns {Promise<AppState|null>} null se il foglio è ancora vuoto */
  async read() {
    const res = await googleSheetsService.read(this.cfg);
    const sheets = res.sheets || {};
    const out = {};
    let totalRows = 0;
    SCHEMA_KEYS.forEach((k) => {
      const def = SHEET_SCHEMA[k];
      const raw = sheets[def.sheet];
      /* Foglio ASSENTE ≠ foglio vuoto: se manca del tutto (per esempio perché è una
         sezione nuova non ancora inviata) la chiave viene omessa, così il successivo
         merge non azzera i dati che esistono solo in locale. */
      if (raw == null) return;
      const body = raw.length && String(raw[0][0]).toLowerCase() === String(def.headers[0]).toLowerCase() ? raw.slice(1) : raw;
      totalRows += body.length;
      out[k] = def.unpack(body);
    });
    return totalRows === 0 ? null : out;
  }
  async write(state) {
    const sheets = SCHEMA_KEYS.map((k) => { const def = SHEET_SCHEMA[k]; return { name: def.sheet, rows: [def.headers, ...def.pack(state)] }; });
    const r = await googleSheetsService.write(this.cfg, sheets);
    return r.ts || new Date().toISOString();
  }
}

/** Supabase: lettura e scrittura complete, con storage JSON. */
class SupabaseProvider extends DataProvider {
  constructor(cfg) { 
    super(); 
    this.client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey); 
  }
  
  get id() { return "supabase"; }
  
  async ping() { 
    const { error } = await this.client.from('app_state').select('id').limit(1);
    if (error) throw new SyncError("Supabase non raggiungibile", { hint: error.message });
    return { ok: true, title: "Supabase Connesso" }; 
  }
  
  async read() {
    const { data, error } = await this.client.from('app_state').select('data').eq('id', 'carol_main').single();
    if (error && error.code !== 'PGRST116') throw new SyncError("Errore lettura Supabase", { hint: error.message });
    return data ? data.data : null;
  }
  
  async write(state) {
    const { error } = await this.client.from('app_state').upsert({ id: 'carol_main', data: state });
    if (error) throw new SyncError("Errore scrittura Supabase", { hint: error.message });
    return new Date().toISOString();
  }
}

/** Repository: unico punto di accesso ai dati per tutta l'app. */
class FinanceRepository {
  constructor() { this.local = new LocalProvider(); this.remote = null; }
  setRemote(cfg) { 
    if (!cfg?.enabled) {
      this.remote = null;
    } else if (cfg.provider === "supabase" && cfg.supabaseUrl && cfg.supabaseKey) {
      this.remote = new SupabaseProvider(cfg);
    } else if ((!cfg.provider || cfg.provider === "sheets") && cfg.url) {
      this.remote = new GoogleSheetsProvider(cfg);
    } else {
      this.remote = null;
    }
  }
  get hasRemote() { return !!this.remote; }
  loadLocal() { return this.local.read(); }
  saveLocal(state) { return this.local.write(state); }
  pull() { if (!this.remote) throw new SyncError("Sincronizzazione non configurata.", { retriable: false }); return this.remote.read(); }
  push(state) { if (!this.remote) throw new SyncError("Sincronizzazione non configurata.", { retriable: false }); return this.remote.write(state); }
  ping() { if (!this.remote) throw new SyncError("Sincronizzazione non configurata.", { retriable: false }); return this.remote.ping(); }
}
const repository = new FinanceRepository();

/** Unione prudente: una collezione remota vuota non cancella quella locale,
    perché quasi sempre significa "foglio non ancora popolato", non "svuotato". */
function uniscePreservando(locale, remoto) {
  const out = { ...remoto };
  Object.keys(remoto).forEach((k) => {
    const r = remoto[k], l = locale?.[k];
    if (Array.isArray(r) && r.length === 0 && Array.isArray(l) && l.length > 0) delete out[k];
    if (r && typeof r === "object" && !Array.isArray(r) && Object.keys(r).length === 0 && l && Object.keys(l).length > 0) delete out[k];
  });
  return out;
}

// 1. Apri il tuo foglio → Estensioni → Apps Script
// 2. Incolla questo codice, sostituisci il TOKEN con una parola tua

const TOKEN = 'cambia-questo-token';

function doPost(e) {
  try {
    const req = JSON.parse(e.postData.contents);
    if (req.token !== TOKEN) return out({ ok: false, error: 'Token non corrispondente' });
    const ss = SpreadsheetApp.getActiveSpreadsheet();

    if (req.action === 'ping') return out({ ok: true, title: ss.getName() });

    if (req.action === 'read') {
      const sheets = {};
      (req.sheets || []).forEach(function (name) {
        const sh = ss.getSheetByName(name);
        sheets[name] = sh && sh.getLastRow() > 0
          ? sh.getRange(1, 1, sh.getLastRow(), sh.getLastColumn()).getDisplayValues()
          : [];
      });
      return out({ ok: true, sheets: sheets });
    }

    if (req.action === 'write') {
      (req.sheets || []).forEach(function (s) {
        let sh = ss.getSheetByName(s.name) || ss.insertSheet(s.name);
        sh.clear();
        if (s.rows && s.rows.length) {
          sh.getRange(1, 1, s.rows.length, s.rows[0].length).setValues(s.rows);
          sh.setFrozenRows(1);
          sh.getRange(1, 1, 1, s.rows[0].length).setFontWeight('bold');
        }
      });
      return out({ ok: true, ts: new Date().toISOString() });
    }
    return out({ ok: false, error: 'Azione sconosciuta' });
  } catch (err) {
    return out({ ok: false, error: String(err) });
  }
}

function out(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}`;

/* ------------------ Numeri animati ------------------ */
function useCountUp(value, duration = 900) {
  const [display, setDisplay] = useState(value);
  const prev = useRef(value);
  useEffect(() => {
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { setDisplay(value); prev.current = value; return; }
    const from = prev.current, to = value, start = performance.now();
    let raf;
    const tick = (t) => {
      const p = Math.min(1, (t - start) / duration);
      const e = 1 - Math.pow(1 - p, 3);
      setDisplay(from + (to - from) * e);
      if (p < 1) raf = requestAnimationFrame(tick);
      else prev.current = to;
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [value, duration]);
  return display;
}

const CountEur = ({ value, cls }) => {
  const v = useCountUp(value);
  return <span className={cls}>{eur(v)}</span>;
};

function Modal({ open, onClose, title, children, wide }) {
  /* Altezza calcolata in JS: non dipende né dalle classi generate a runtime
     né dal supporto a dvh, quindi il popup non può mai sforare lo schermo. */
  const [maxH, setMaxH] = useState(null);
  useEffect(() => {
    if (!open) return;
    const misura = () => {
      const vv = window.visualViewport;              // su iOS tiene conto delle barre
      const h = Math.round(vv?.height || window.innerHeight || 600);
      const margine = window.innerWidth < 640 ? 8 : 24;
      setMaxH(Math.max(220, h - margine));
    };
    misura();
    window.addEventListener("resize", misura);
    window.visualViewport?.addEventListener("resize", misura);
    return () => { window.removeEventListener("resize", misura); window.visualViewport?.removeEventListener("resize", misura); };
  }, [open]);

  /* blocca lo scroll di fondo, porta il focus dentro il dialogo e lo trattiene */
  const panelRef = useRef(null);
  useEffect(() => {
    if (!open) return;
    const prev = document.body.style.overflow;
    const attivoPrima = document.activeElement;
    document.body.style.overflow = "hidden";
    const focusabili = () => [...(panelRef.current?.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])') || [])].filter((el) => el.offsetParent !== null || el.getClientRects().length);
    const t = setTimeout(() => {
      const el = focusabili();
      /* primo campo di testo se c'è, altrimenti il pannello: niente focus su "Elimina" */
      (el.find((x) => /^(INPUT|TEXTAREA)$/.test(x.tagName)) || panelRef.current)?.focus?.();
    }, 60);
    const onKey = (e) => {
      if (e.key === "Escape") { onClose?.(); return; }
      if (e.key !== "Tab") return;
      const el = focusabili();
      if (!el.length) return;
      const primo = el[0], ultimo = el[el.length - 1];
      if (e.shiftKey && document.activeElement === primo) { e.preventDefault(); ultimo.focus(); }
      else if (!e.shiftKey && document.activeElement === ultimo) { e.preventDefault(); primo.focus(); }
    };
    document.addEventListener("keydown", onKey);
    return () => {
      clearTimeout(t);
      document.body.style.overflow = prev;
      document.removeEventListener("keydown", onKey);
      attivoPrima?.focus?.();
    };
  }, [open, onClose]);

  if (!open) return null;
  /* Portal su <body>: indispensabile perché un antenato con transform animato
     (la transizione tra pagine) diventerebbe il contenitore di riferimento per
     position:fixed, confinando velo e popup dentro il riquadro della pagina. */
  return createPortal(
    <>
      {/* velo sempre a tutto schermo, indipendente dallo scroll del contenuto */}
      <div className="fixed inset-0 z-[100] bg-black/65 backdrop-blur-sm" style={{ animation: "fadeIn .2s both" }} onClick={onClose} />
      {/* wrapper scrollabile: se anche il contenuto fosse più alto, si scorre invece di tagliarsi.
          La chiusura scatta solo se si preme davvero sull'area vuota attorno al popup: usare
          onClick generico chiuderebbe il popup anche cliccando elementi interni che spariscono
          subito dopo (per esempio un suggerimento in un elenco a discesa). */}
      <div className="fixed inset-0 z-[101] overflow-y-auto overscroll-contain"
        onMouseDown={(e) => { if (e.target === e.currentTarget) onClose?.(); }}>
        <div className="min-h-full flex items-end sm:items-center justify-center p-0 sm:p-3"
          onMouseDown={(e) => { if (e.target === e.currentTarget) onClose?.(); }}>
          <div ref={panelRef} role="dialog" aria-modal="true" aria-label={title} tabIndex={-1}
            className={`modal-sheet relative glass-strong w-full ${wide ? "sm:max-w-2xl" : "sm:max-w-md"} rounded-t-3xl sm:rounded-2xl flex flex-col outline-none`}
            style={{ animation: "sheetIn .32s cubic-bezier(.22,1,.36,1) both", maxHeight: maxH ? `${maxH}px` : "88vh" }}>
            <div className="sm:hidden pt-2.5 pb-1 flex justify-center shrink-0"><span className="w-10 h-1 rounded-full bg-white/20" /></div>
            <div className="flex items-center justify-between gap-3 px-5 sm:px-6 pt-3 sm:pt-5 pb-3 shrink-0 border-b border-white/[0.06]">
              <h3 className="font-display text-base sm:text-lg text-white truncate">{title}</h3>
              <button onClick={onClose} aria-label="Chiudi" className="w-9 h-9 shrink-0 rounded-full bg-white/5 hover:bg-white/10 text-slate-300 transition-all hover:rotate-90">✕</button>
            </div>
            {/* min-h-0: senza, un figlio flex non si restringe sotto il proprio contenuto e trabocca */}
            <div className="px-5 sm:px-6 py-4 sm:py-5 overflow-y-auto overscroll-contain flex-1 min-h-0" style={{ WebkitOverflowScrolling: "touch", paddingBottom: "max(1rem, env(safe-area-inset-bottom))" }}>
              {children}
            </div>
          </div>
        </div>
      </div>
    </>,
    document.body
  );
}

function App() {
  const [data, setData] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [page, setPage] = useState("dashboard");
  const [saveState, setSaveState] = useState("saved");
  const [toast, setToast] = useState(null);
  const [txModal, setTxModal] = useState(null); // null | {} | tx
  const [catEditor, setCatEditor] = useState(null); // null | {cat?, prefillName?, prefillGroup?, onDone?}
  const [confirmDlg, setConfirmDlg] = useState(null); // {msg, onOk}
  const [palette, setPalette] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [reorderMode, setReorderMode] = useState(false);
  const [draggedNavId, setDraggedNavId] = useState(null);
  const [syncCfg, setSyncCfg] = useState(DEFAULT_SYNC_CFG);
  const [syncState, setSyncState] = useState("idle"); // idle | pulling | pushing | ok | error
  const [syncError, setSyncError] = useState(null);
  const [pendingPush, setPendingPush] = useState(false);
  const saveTimer = useRef(null);
  const pushTimer = useRef(null);
  const skipSave = useRef(true);
  const skipPush = useRef(true);

  const notify = useCallback((msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); }, []);

  /* ---------- Normalizzazione / migrazioni ---------- */
  const normalize = useCallback((d) => {
    if (!d.trash) d.trash = [];
    if (!d.settings) d.settings = { theme: "dark", onboarded: false };
    if (!d.groups || !d.groups.length) d.groups = [...new Set((d.categories || []).flatMap((c) => getCategoryGroups(c)))];
    (d.categories || []).forEach((c, i) => { if (c.ordine == null) c.ordine = i; if (!c.sottocategorie) c.sottocategorie = []; });
    (d.accounts || []).forEach((a) => { if (!a.icona) a.icona = ACCOUNT_ICON_BY_TYPE[a.tipo] || "💼"; });
    if (!d.budgets) d.budgets = {};
    if (!d.goals) d.goals = [];
    if (!d.trips) d.trips = [];
    if (!d.tripExpenses) d.tripExpenses = [];
    if (!d.wishlist) d.wishlist = [];
    if (!d.accountTypes || !Array.isArray(d.accountTypes) || d.accountTypes.length === 0) d.accountTypes = DEFAULT_ACCOUNT_TYPES;
    else d.accountTypes = d.accountTypes.map((t) => ({ tipo: s(t.tipo), icona: s(t.icona) || ACCOUNT_ICON_BY_TYPE[s(t.tipo)] || "💼" }));

    if (!d.jobs) d.jobs = [];
    if (!d.payslips) d.payslips = [];
    if (!d.tfrEntries) d.tfrEntries = [];
    if (!d.documenti) d.documenti = [];
    if (!d.salaryEvents) d.salaryEvents = [];
    if (!d.assets) d.assets = [];
    if (!d.trades) d.trades = [];
    if (!d.quotes) d.quotes = {};
    return d;
  }, []);

  /* ---------- Caricamento: locale subito, poi pull dal foglio ---------- */
  useEffect(() => {
    (async () => {
      /* 1. configurazione sync */
      let cfg = DEFAULT_SYNC_CFG;
      try { const r = await window.storage.get(SYNC_CFG_KEY); if (r?.value) cfg = { ...DEFAULT_SYNC_CFG, ...JSON.parse(r.value) }; } catch {}
      setSyncCfg(cfg);
      repository.setRemote(cfg);

      /* 2. dati locali (istantanei, funzionano offline) */
      let d = await repository.loadLocal();
      if (!d) { d = freshData(true); await repository.saveLocal(d); }
      d = normalize(d);
      setData(d);
      if (d.settings?.lastDashboardMonth) setSelMonth(d.settings.lastDashboardMonth);
      setTimeout(() => setLoaded(true), 150);

      /* 3. pull dal foglio: il remoto è la fonte di verità condivisa */
      if (repository.hasRemote) {
        setSyncState("pulling");
        try {
          const remote = await repository.pull();
          if (remote) {
            const merged = normalize({ ...d, ...uniscePreservando(d, remote) });
            setData(merged);
            await repository.saveLocal(merged);
            setSyncState("ok"); setSyncError(null);
          } else {
            /* foglio vuoto → lo inizializzo coi dati locali */
            const ts = await repository.push(syncableState(d));
            setSyncState("ok"); setSyncError(null);
            const next = { ...cfg, lastSync: ts };
            setSyncCfg(next);
            try { await window.storage.set(SYNC_CFG_KEY, JSON.stringify(next)); } catch {}
            notify("Foglio inizializzato con i tuoi dati");
          }
        } catch (e) {
          setSyncState("error");
          setSyncError({ message: e.message, hint: e.hint || "", retriable: e.retriable !== false });
        } finally { skipPush.current = true; }
      }
    })();
  }, []); // eslint-disable-line

  /* ---------- Config sync ---------- */
  const saveSyncCfg = useCallback(async (cfg) => {
    setSyncCfg(cfg);
    repository.setRemote(cfg);
    try { await window.storage.set(SYNC_CFG_KEY, JSON.stringify(cfg)); } catch {}
  }, []);

  /* ---------- Push / Pull manuali ---------- */
  const pushNow = useCallback(async (state, silent) => {
    if (!repository.hasRemote || !state) return;
    setSyncState("pushing");
    try {
      const ts = await repository.push(syncableState(state));
      setSyncState("ok"); setSyncError(null); setPendingPush(false);
      setSyncCfg((c) => { const next = { ...c, lastSync: ts }; window.storage.set(SYNC_CFG_KEY, JSON.stringify(next)).catch(() => {}); return next; });
      if (!silent) notify("Foglio aggiornato");
    } catch (e) {
      setSyncState("error"); setPendingPush(true);
      setSyncError({ message: e.message, hint: e.hint || "", retriable: e.retriable !== false });
      if (!silent) notify("Sincronizzazione non riuscita");
    }
  }, [notify]);

  const pullNow = useCallback(async () => {
    if (!repository.hasRemote) { notify("Configura prima il collegamento in Impostazioni"); return; }
    setSyncState("pulling");
    try {
      const remote = await repository.pull();
      if (!remote) { notify("Il foglio è vuoto: invia prima i tuoi dati"); setSyncState("ok"); return; }
      setData((d) => { const merged = normalize({ ...d, ...uniscePreservando(d, remote) }); repository.saveLocal(merged); return merged; });
      skipPush.current = true;
      setSyncState("ok"); setSyncError(null); setPendingPush(false);
      notify("Dati aggiornati dal foglio");
    } catch (e) {
      setSyncState("error");
      setSyncError({ message: e.message, hint: e.hint || "", retriable: e.retriable !== false });
      notify("Lettura dal foglio non riuscita");
    }
  }, [notify, normalize]);

  /* ---------- Autosave + backup rotativi ---------- */
  useEffect(() => {
    if (!data) return;
    if (skipSave.current) { skipSave.current = false; return; }
    setSaveState("saving");
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        const next = { ...data, saveCount: (data.saveCount || 0) + 1, savedAt: new Date().toISOString() };
        await window.storage.set(STORAGE_KEY, JSON.stringify(next));
        if (next.saveCount % 8 === 0) {
          const slot = Math.floor(next.saveCount / 8) % 5;
          await window.storage.set(BACKUP_PREFIX + slot, JSON.stringify({ ts: new Date().toISOString(), data: next }));
        }
        setSaveState("saved");
      } catch { setSaveState("error"); }
    }, 600);
    return () => clearTimeout(saveTimer.current);
  }, [data]);

  /* ---------- Auto-push su Google Sheets (debounce) ---------- */
  useEffect(() => {
    if (!data || !loaded) return;
    if (skipPush.current) { skipPush.current = false; return; }
    if (!repository.hasRemote || !syncCfg.autoPush) return;
    setPendingPush(true);
    clearTimeout(pushTimer.current);
    pushTimer.current = setTimeout(() => pushNow(data, true), 2500);
    return () => clearTimeout(pushTimer.current);
  }, [data, loaded, syncCfg.autoPush, syncCfg.url, pushNow]);

  /* ---------- Ritorno online: riprova automaticamente ---------- */
  useEffect(() => {
    const onOnline = () => { if (pendingPush && repository.hasRemote) pushNow(data, true); };
    window.addEventListener("online", onOnline);
    return () => window.removeEventListener("online", onOnline);
  }, [pendingPush, data, pushNow]);

  const update = (fn) => setData((d) => fn(structuredClone(d)));

  /* ---------- Derivati ---------- */
  const txs = useMemo(() => (data ? data.transactions.filter((t) => !t.deletedAt) : []), [data]);
  const catById = useMemo(() => Object.fromEntries((data?.categories || []).map((c) => [c.id, c])), [data]);
  const accById = useMemo(() => Object.fromEntries((data?.accounts || []).map((a) => [a.id, a])), [data]);

  const balances = useMemo(() => {
    const b = {};
    (data?.accounts || []).forEach((a) => (b[a.id] = a.saldoIniziale));
    const has = (id) => Object.prototype.hasOwnProperty.call(b, id);
    txs.forEach((t) => {
      if (t.tipo === "entrata") { if (has(t.conto)) b[t.conto] += t.importo; }
      else if (t.tipo === "spesa") { if (has(t.conto)) b[t.conto] -= t.importo; }
      else if (t.tipo === "trasferimento") { if (has(t.conto)) b[t.conto] -= t.importo; if (has(t.contoDest)) b[t.contoDest] += t.importo; }
    });
    return b;
  }, [txs, data]);

  const patrimonio = useMemo(() => Object.values(balances).reduce((s, v) => s + v, 0), [balances]);
  const investito = useMemo(() => txs.filter((t) => t.tipo === "spesa" && getTxGroup(t, catById) === "Investimenti").reduce((s, t) => s + t.importo, 0), [txs, catById]);

  const nowMk = monthKey(new Date());
  const [selMonth, setSelMonth] = useState(nowMk);
  const isCurrentMonth = selMonth === nowMk;

  /* memorizza l'ultimo periodo visualizzato */
  useEffect(() => {
    if (!loaded || !data) return;
    if (data.settings.lastDashboardMonth !== selMonth) update((d) => { d.settings.lastDashboardMonth = selMonth; return d; });
  }, [selMonth, loaded]); // eslint-disable-line
  const monthStats = useCallback((mk) => {
    const mt = txs.filter((t) => monthKey(t.data) === mk);
    const entrate = mt.filter((t) => t.tipo === "entrata").reduce((s, t) => s + t.importo, 0);
    const uscite = mt.filter((t) => t.tipo === "spesa" && getTxGroup(t, catById) !== "Investimenti").reduce((s, t) => s + t.importo, 0);
    const inv = mt.filter((t) => t.tipo === "spesa" && getTxGroup(t, catById) === "Investimenti").reduce((s, t) => s + t.importo, 0);
    return { entrate, uscite, inv, risparmio: entrate - uscite - inv, mt };
  }, [txs, catById]);
  const cur = monthStats(selMonth);
  const prev = monthStats(addMonthsMk(selMonth, -1));

  const base0 = useMemo(() => (data?.accounts || []).reduce((s, a) => s + a.saldoIniziale, 0), [data]);
  const patAt = useCallback((iso) => base0 + txs.filter((t) => t.data <= iso).reduce((s, t) => s + (t.tipo === "entrata" ? t.importo : t.tipo === "spesa" ? -t.importo : 0), 0), [base0, txs]);
  const anchorIso = isCurrentMonth ? todayISO() : endOfMonthIso(selMonth);
  const patrimonioShown = isCurrentMonth ? patrimonio : patAt(anchorIso);

  const wealthSeries = useCallback((days, endIso) => {
    const start0 = (data?.accounts || []).reduce((s, a) => s + a.saldoIniziale, 0);
    const events = [...txs]
      .sort((a, b) => a.data.localeCompare(b.data))
      .map((t) => ({ d: t.data, delta: t.tipo === "entrata" ? t.importo : t.tipo === "spesa" ? -t.importo : 0 }));
    const end = new Date(endIso + "T12:00:00");
    const out = [];
    let run = start0, ei = 0;
    for (let i = days; i >= 0; i--) {
      const d = new Date(end); d.setDate(d.getDate() - i);
      const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      while (ei < events.length && events[ei].d <= iso) run += events[ei++].delta;
      out.push({ giorno: d.toLocaleDateString("it-IT", { day: "2-digit", month: "short" }), iso, valore: Math.round(run) });
    }
    return out.filter((_, i) => days <= 40 || i % Math.ceil(days / 40) === 0 || i === out.length - 1);
  }, [txs, data]);

  const [chartRange, setChartRange] = useState(30);

  // Calcola i giorni totali se l'utente sceglie "Tutto"
  const actualDays = useMemo(() => {
    if (chartRange === "all") {
      if (!txs || txs.length === 0) return 30; // Fallback se non ci sono movimenti
      // txs è ordinato dal più recente al più vecchio, quindi l'ultimo è il più vecchio
      const oldestDate = new Date(txs[txs.length - 1].data);
      const endDate = new Date(anchorIso);
      const diffDays = Math.ceil((endDate - oldestDate) / (1000 * 60 * 60 * 24));
      return Math.max(diffDays, 30); // Mostra sempre almeno 30 giorni per estetica
    }
    return chartRange;
  }, [chartRange, txs, anchorIso]);

  // Passiamo actualDays alla funzione che genera il grafico
  const series = useMemo(() => wealthSeries(actualDays, anchorIso), [wealthSeries, actualDays, anchorIso]);
  const deltaMese = cur.risparmio + cur.inv;

  /* ---------- Insight ---------- */
  const insights = useMemo(() => {
    const out = [];
    const spendBy = (stats) => {
      const m = {};
      stats.mt.filter((t) => t.tipo === "spesa").forEach((t) => (m[t.categoria] = (m[t.categoria] || 0) + t.importo));
      return m;
    };
    const c = spendBy(cur), p = spendBy(prev);
    let best = null;
    Object.keys(c).forEach((k) => {
      if (p[k] > 20) {
        const diff = ((c[k] - p[k]) / p[k]) * 100;
        if (!best || Math.abs(diff) > Math.abs(best.diff)) best = { k, diff };
      }
    });
    if (best) out.push(best.diff > 0
      ? `Hai speso il ${Math.round(best.diff)}% in più in ${catById[best.k]?.nome} rispetto al mese precedente.`
      : `Ottimo: −${Math.round(-best.diff)}% in ${catById[best.k]?.nome} rispetto al mese precedente.`);
    if (cur.entrate > 0) out.push(`Tasso di risparmio del mese: ${Math.round(((cur.risparmio + cur.inv) / cur.entrate) * 100)}% delle entrate.`);
    const top = Object.entries(c).sort((a, b) => b[1] - a[1])[0];
    if (top) out.push(`${catById[top[0]]?.icona || ""} ${catById[top[0]]?.nome} è la categoria più costosa del mese (${eur(top[1])}).`);
    return out;
  }, [cur, prev, catById]);

  /* ---------- Azioni ---------- */
  const saveTx = (tx) => {
    update((d) => {
      if (tx.id) {
        const i = d.transactions.findIndex((t) => t.id === tx.id);
        if (i >= 0) d.transactions[i] = tx; else d.transactions.unshift(tx);
      } else {
        tx.id = uid();
        d.transactions.unshift(tx);
      }
      d.transactions.sort((a, b) => b.data.localeCompare(a.data));
      return d;
    });
    setTxModal(null);
    notify(tx.tipo === "trasferimento" ? "Trasferimento salvato" : tx.tipo === "entrata" ? "Entrata salvata" : "Spesa salvata");
  };

  const softDelete = (id, onSuccess) => {
    // 1. Questa è l'azione reale che sposta l'elemento nel cestino
    const doDelete = () => {
      update((d) => { 
        const t = d.transactions.find((x) => x.id === id); 
        if (t) t.deletedAt = new Date().toISOString(); 
        return d; 
      }); 
      notify("Spostato nel cestino");
      
      // CHIUDE LA MODALE SOLO ORA! (Se la funzione onSuccess esiste)
      if (onSuccess) onSuccess(); 
    };

    const isIOS = typeof navigator !== 'undefined' && 
      (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1));

    if (isIOS) {
      if (window.confirm("Spostare questo movimento nel cestino? Potrai ripristinarlo in qualsiasi momento.")) {
        doDelete();
      }
    } else {
      setConfirmDlg({
        msg: "Spostare questo movimento nel cestino? Potrai ripristinarlo in qualsiasi momento.",
        onOk: doDelete,
      });
    }
  };

  const restoreTx = (id) => { update((d) => { const t = d.transactions.find((x) => x.id === id); if (t) delete t.deletedAt; return d; }); notify("Movimento ripristinato"); };
  const hardDelete = (id) => {
    const doDelete = () => {
      update((d) => { 
        d.transactions = d.transactions.filter((x) => x.id !== id); 
        return d; 
      }); 
      notify("Eliminato definitivamente");
    };

    const isIOS = typeof navigator !== 'undefined' && 
      (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1));

    const messaggio = "Eliminare definitivamente? Questa azione non è reversibile.";

    if (isIOS) {
      if (window.confirm(messaggio)) {
        doDelete();
      }
    } else {
      setConfirmDlg({
        msg: messaggio,
        onOk: doDelete,
      });
    }
  };

  /* ---------- Backup / Export / Import ---------- */
  const [backups, setBackups] = useState([]);
  const loadBackups = useCallback(async () => {
    const out = [];
    for (let i = 0; i < 5; i++) {
      try {
        const r = await window.storage.get(BACKUP_PREFIX + i);
        if (r?.value) { const b = JSON.parse(r.value); out.push({ slot: i, ts: b.ts, n: b.data.transactions.length }); }
      } catch {}
    }
    setBackups(out.sort((a, b) => b.ts.localeCompare(a.ts)));
  }, []);
  useEffect(() => { if (page === "impostazioni") loadBackups(); }, [page, loadBackups]);

  const manualBackup = async () => {
    try {
      const slot = ((data.saveCount || 0) + 1) % 5;
      await window.storage.set(BACKUP_PREFIX + slot, JSON.stringify({ ts: new Date().toISOString(), data }));
      notify("Backup creato");
      loadBackups();
    } catch { notify("Errore durante il backup"); }
  };

  const restoreBackup = (slot) => setConfirmDlg({
    msg: "Ripristinare questo backup? I dati attuali verranno sostituiti.",
    onOk: async () => {
      try {
        const r = await window.storage.get(BACKUP_PREFIX + slot);
        const b = JSON.parse(r.value);
        setData(b.data);
        notify("Backup ripristinato");
      } catch { notify("Impossibile leggere il backup"); }
    },
  });

  const download = (name, content, type) => {
    const blob = content instanceof Blob ? content : new Blob([content], { type });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const exportJSON = () => download(`C.A.R.O.L.-backup-${todayISO()}.json`, JSON.stringify(data, null, 2), "application/json");
  const exportCSV = () => {
    const rows = [["Data", "Tipo", "Categoria", "Conto", "Importo", "Metodo", "Note", "Tag"]];
    txs.forEach((t) => rows.push([t.data, t.tipo, catById[t.categoria]?.nome || "", accById[t.conto]?.nome || "", String(t.importo).replace(".", ","), t.metodo || "", (t.note || "").replace(/;/g, ","), (t.tags || []).join("|")]));
    download(`C.A.R.O.L.-movimenti-${todayISO()}.csv`, "\uFEFF" + rows.map((r) => r.join(";")).join("\n"), "text/csv");
  };
  const exportXLSX = () => {
    const wb = XLSX.utils.book_new();
    const movRows = txs.map((t) => ({ Data: t.data, Tipo: t.tipo, Categoria: catById[t.categoria]?.nome || "", Gruppo: getTxGroup(t, catById) || "", Conto: accById[t.conto]?.nome || "", Importo: t.tipo === "spesa" ? -t.importo : t.importo, Metodo: t.metodo || "", Note: t.note || "" }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(movRows), "Movimenti");
    const contiRows = (data.accounts || []).map((a) => ({ Conto: a.nome, Tipo: a.tipo, "Saldo iniziale": a.saldoIniziale, "Saldo attuale": Math.round((balances[a.id] || 0) * 100) / 100 }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(contiRows), "Conti");
    const months = [...new Set(txs.map((t) => monthKey(t.data)))].sort();
    const riep = months.map((mk) => { const s = monthStats(mk); return { Mese: mk, Entrate: s.entrate, Uscite: s.uscite, Investimenti: s.inv, Risparmio: s.risparmio }; });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(riep), "Riepilogo");
    const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    download(`C.A.R.O.L.-report-${todayISO()}.xlsx`, new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  };

  const importJSON = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!Array.isArray(parsed.transactions)) throw new Error();
        setConfirmDlg({ msg: `Importare ${parsed.transactions.length} movimenti? I dati attuali verranno sostituiti (viene creato un backup automatico prima).`, onOk: async () => { await manualBackup(); setData({ ...freshData(false), ...parsed, version: DATA_VERSION }); notify("Dati importati"); } });
      } catch { notify("File non valido: atteso un backup JSON di C.A.R.O.L."); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  /* ---------- Command palette ---------- */
  useEffect(() => {
    const h = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); setPalette((p) => !p); }
      if (e.key === "Escape") { setPalette(false); }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, []);

  const NAV = [
    { id: "dashboard", label: "Dashboard", icon: "◈" },
    { id: "movimenti", label: "Movimenti", icon: "⇄" },
    { id: "budget", label: "Budget", icon: "◔" },
    { id: "categorie", label: "Categorie", icon: "❖" },
    { id: "conti", label: "Conti", icon: "▣" },
    { id: "viaggi", label: "Viaggi", icon: "✦" },
    { id: "investimenti", label: "Investimenti", icon: "▲" },
    { id: "carriera", label: "Stipendio", icon: "◱" },
    { id: "report", label: "Report", icon: "∿" },
    { id: "obiettivi", label: "Obiettivi", icon: "◎" },
    { id: "archivio", label: "Archivio", icon: "🗂" },
    { id: "impostazioni", label: "Impostazioni", icon: "⚙" },
  ];

  const orderedNav = useMemo(() => {
    const saved = (data?.settings?.navOrder || []).filter((id) => NAV.some((n) => n.id === id));
    const missing = NAV.filter((n) => !saved.includes(n.id)).map((n) => n.id);
    return [...saved, ...missing].map((id) => NAV.find((n) => n.id === id)).filter(Boolean);
  }, [data, NAV]);

  const moveNavItem = (sourceId, targetId) => {
    if (!sourceId || !targetId || sourceId === targetId) return;
    const ids = orderedNav.map((n) => n.id);
    const from = ids.indexOf(sourceId);
    const to = ids.indexOf(targetId);
    if (from < 0 || to < 0) return;
    const next = [...ids];
    next.splice(from, 1);
    next.splice(to, 0, sourceId);
    update((d) => { d.settings.navOrder = next; return d; });
    setDraggedNavId(null);
  };
  
  const mainRef = useRef(null);

  useEffect(() => {
    mainRef.current?.scrollTo({
      top: 0,
      behavior: "auto",
    });
  }, [page]);
  
  /* ---------- Skeleton loading ---------- */
  if (!data) {
    return (
      <div className="min-h-screen bg-[#0A0C12] p-4 pt-[max(1rem,env(safe-area-inset-top))] md:p-8">
        <StyleTag />
        <div className="max-w-6xl mx-auto md:pl-56">
          <div className="skeleton h-4 w-24 rounded-md mb-2" />
          <div className="skeleton h-8 w-72 rounded-lg mb-6" />
          <div className="skeleton h-64 w-full rounded-2xl mb-5" />
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-5">
            {[0, 1, 2, 3].map((i) => <div key={i} className="skeleton h-20 rounded-2xl" style={{ animationDelay: `${i * 120}ms` }} />)}
          </div>
          <div className="grid lg:grid-cols-5 gap-5">
            <div className="skeleton lg:col-span-3 h-72 rounded-2xl" />
            <div className="skeleton lg:col-span-2 h-72 rounded-2xl" />
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-[#0A0C12] text-slate-200 font-body overflow-x-hidden">
      <StyleTag />
      {/* C.A.R.O.L. ambientale */}
      <div className="fixed inset-0 pointer-events-none" aria-hidden>
        <div className="absolute -top-40 -left-40 w-[560px] h-[560px] rounded-full opacity-25 blur-[120px]" style={{ background: "radial-gradient(circle, #6366F1, transparent 70%)", animation: "drift 26s ease-in-out infinite" }} />
        <div className="absolute top-1/3 -right-52 w-[520px] h-[520px] rounded-full opacity-20 blur-[130px]" style={{ background: "radial-gradient(circle, #2DD4BF, transparent 70%)", animation: "drift 32s ease-in-out infinite reverse" }} />
        <div className="absolute inset-0" style={{ background: "radial-gradient(ellipse 80% 60% at 50% -10%, rgba(139,157,249,0.06), transparent)" }} />
      </div>

      <div className="relative flex h-screen overflow-hidden">
        {/* Sidebar */}
        <aside className="hidden md:flex flex-col w-56 shrink-0 p-5 gap-1 border-r border-white/5 h-screen overflow-hidden">
          <div className="flex items-center gap-2.5 mb-4 px-1" style={{ animation: "fadeUp .5s both" }}>
            <Logo size={34} />
            <div>
              <span className="font-display text-lg text-white tracking-tight leading-none block">C.A.R.O.L</span>
              <span className="text-[9px] uppercase tracking-[0.22em] text-slate-500">Assistant</span>
            </div>
          </div>
          {orderedNav.map((n, i) => (
            <button
              key={n.id}
              draggable={reorderMode}
              onClick={() => { if (reorderMode) return; setPage(n.id); }}
              onDragStart={() => setDraggedNavId(n.id)}
              onDragOver={(e) => { e.preventDefault(); }}
              onDrop={() => moveNavItem(draggedNavId, n.id)}
              onDragEnd={() => setDraggedNavId(null)}
              className={`relative flex items-center gap-3 px-3 py-2 rounded-xl text-sm transition-all duration-200 ${page === n.id ? "bg-white/[0.08] text-white" : "text-slate-400 hover:text-white hover:bg-white/5 hover:translate-x-0.5"} ${reorderMode ? "cursor-grab" : "cursor-pointer"}`} 
              style={{ animation: `fadeUp .5s both`, animationDelay: `${60 + i * 40}ms` }}>
              {page === n.id && <span className="absolute left-0 top-1/2 -translate-y-1/2 w-[3px] h-4 rounded-full bg-gradient-to-b from-indigo-300 to-teal-300" style={{ animation: "fadeIn .25s both" }} />}
              {reorderMode && <span className="text-slate-500 text-sm">⋮⋮</span>}
              <span className={`text-base transition-opacity ${page === n.id ? "opacity-100" : "opacity-60"}`}>{n.icon}</span>{n.label}
            </button>
          ))}
          <button onClick={() => setReorderMode((v) => !v)} className="mt-3 px-2 py-1 rounded-full text-[8px] uppercase tracking-[0.28em] text-slate-500/70 hover:text-slate-300 hover:bg-white/5 transition-all self-center w-fit">
            {reorderMode ? "confirm" : "change order"}
          </button>
          <div className="mt-auto px-2">
            <button onClick={() => setPalette(true)} className="w-full flex items-center justify-between px-3 py-2 rounded-xl bg-white/5 border border-white/10 text-xs text-slate-400 hover:bg-white/10 transition-all">
              <span>Cerca ovunque</span><kbd className="px-1.5 py-0.5 rounded bg-white/10 text-[10px]">⌘K</kbd>
            </button>
            <div className="mt-3 space-y-2">
              <div className={`flex items-center gap-1.5 text-[11px] transition-colors ${saveState === "error" ? "text-rose-400" : "text-slate-500"}`}>
                <span className={`w-1.5 h-1.5 rounded-full ${saveState === "saving" ? "bg-amber-400 animate-pulse" : saveState === "error" ? "bg-rose-400" : "bg-emerald-400"}`} />
                {saveState === "saving" ? "Salvataggio…" : saveState === "error" ? "Errore di salvataggio" : "Salvato in locale"}
              </div>
              {repository.hasRemote && (
                <button onClick={() => pullNow()} disabled={syncState === "pulling" || syncState === "pushing"} className="w-full flex items-center gap-1.5 px-2 py-1.5 rounded-lg text-[11px] bg-white/5 border border-white/10 hover:bg-white/10 disabled:opacity-60 transition-all" title="Rileggi tutto dal foglio">
                  {syncState === "pulling" || syncState === "pushing" ? <Spinner /> : <span className={`w-1.5 h-1.5 rounded-full ${syncState === "error" ? "bg-rose-400" : pendingPush ? "bg-amber-400" : "bg-emerald-400"}`} />}
                  <span className={syncState === "error" ? "text-rose-300" : "text-slate-400"}>
                    {syncState === "pulling" ? "Lettura foglio…" : syncState === "pushing" ? "Invio al foglio…" : syncState === "error" ? "Sync non riuscita" : pendingPush ? "In attesa di invio" : "Sincronizzato"}
                  </span>
                  <span className="ml-auto text-slate-600">⟳</span>
                </button>
              )}
            </div>
          </div>
        </aside>

        {/* Main */}
        <main ref={mainRef} className="main-pad flex-1 min-w-0 h-screen overflow-y-auto overflow-x-hidden p-4 pt-[max(1rem,env(safe-area-inset-top))] md:p-8">
          {/* topbar mobile */}
          <div className="md:hidden flex items-center justify-between gap-2 mb-5">
            <div className="flex items-center gap-2 min-w-0">
              <Logo size={26} />
              <span className="font-display text-white truncate">{NAV.find((n) => n.id === page)?.label || "C.A.R.O.L"}</span>
            </div>
            <button 
              onClick={() => setPalette(true)} 
              aria-label="Cerca" 
              className="w-10 h-10 shrink-0 grid place-items-center text-2xl text-slate-400 hover:text-white active:scale-95 transition-all"
            >
              ⌕
            </button>
          </div>

          <div key={page} style={{ animation: "pageIn .32s cubic-bezier(.22,1,.36,1)" }}>
          {syncError && (
            <div className="mb-4 rounded-2xl border border-rose-400/25 bg-rose-500/[0.07] p-4 flex flex-wrap items-center gap-3" style={{ animation: "fadeUp .35s both" }}>
              <span className="text-lg">⚠</span>
              <div className="min-w-0 flex-1">
                <p className="text-sm text-rose-200">{syncError.message}</p>
                {syncError.hint && <p className="text-xs text-slate-400 mt-0.5">{syncError.hint}</p>}
                <p className="text-[11px] text-slate-500 mt-1">I tuoi dati restano al sicuro in locale: nulla è andato perso.</p>
              </div>
              <div className="flex gap-2">
                {syncError.retriable && <BtnGhost onClick={() => pushNow(data)} disabled={syncState === "pushing"} className="!py-1.5 !text-xs">{syncState === "pushing" ? "Invio…" : "Riprova"}</BtnGhost>}
                <button onClick={() => setSyncError(null)} className="text-xs text-slate-500 hover:text-white px-2 transition-colors">Chiudi</button>
              </div>
            </div>
          )}
          {page === "dashboard" && <Dashboard {...{ patrimonio: patrimonioShown, isCurrentMonth, selMonth, setSelMonth, deltaMese, cur, prev, series, chartRange, setChartRange, txs, catById, accById, insights, investito, data, update, setTxModal, softDelete, setPage }} />}
          {page === "movimenti" && <Movimenti {...{ txs, catById, accById, data, setTxModal, softDelete }} />}
          {page === "budget" && <BudgetPage {...{ data, update, cur, catById, notify }} />}
          {page === "categorie" && <CategoriePage {...{ data, update, notify, setConfirmDlg, txs, setCatEditor }} />}
          {page === "conti" && <Conti {...{ data, balances, update, notify, setConfirmDlg }} txsAll={txs} onTransfer={() => setTxModal({ tipo: "trasferimento" })} />}
          {page === "viaggi" && <ViaggiPage {...{ data, update, notify, setConfirmDlg, catById }} />}
          {page === "investimenti" && <InvestimentiPage {...{ data, update, notify, setConfirmDlg }} />}
          {page === "carriera" && <CarrieraPage {...{ data, update, notify, setConfirmDlg }} />}

/* ---- Navigatore mese: ◀ Luglio 2026 ▶ — il calendario apre in un portal,
       sopra qualsiasi card (backdrop-filter crea stacking context) ---- */
function MonthNavigator({ value, onChange, max }) {
  const [open, setOpen] = useState(false);
  const [viewY, setViewY] = useState(parseMk(value).y);
  const [pos, setPos] = useState({ top: 0, left: 0 });
  const btnRef = useRef(null);
  const panelRef = useRef(null);

  const place = useCallback(() => {
    const r = btnRef.current?.getBoundingClientRect();
    if (!r) return;
    const W = 288;
    setPos({ top: Math.min(r.bottom + 8, window.innerHeight - 340), left: Math.max(8, Math.min(r.left + r.width / 2 - W / 2, window.innerWidth - W - 8)) });
  }, []);

  const toggle = () => { if (!open) { place(); setViewY(parseMk(value).y); } setOpen((o) => !o); };

  useEffect(() => {
    if (!open) return;
    const onDown = (e) => { if (!btnRef.current?.contains(e.target) && !panelRef.current?.contains(e.target)) setOpen(false); };
    const onKey = (e) => { if (e.key === "Escape") setOpen(false); };
    const onMove = () => place();
    document.addEventListener("mousedown", onDown);
    document.addEventListener("keydown", onKey);
    window.addEventListener("resize", onMove);
    window.addEventListener("scroll", onMove, true);
    return () => { document.removeEventListener("mousedown", onDown); document.removeEventListener("keydown", onKey); window.removeEventListener("resize", onMove); window.removeEventListener("scroll", onMove, true); };
  }, [open, place]);

  const { m: selM, y: selY } = parseMk(value);
  const nowMk = monthKey(new Date());
  const maxY = max ? parseMk(max).y : YEAR_MAX;

  return (
    <>
      <div className="flex items-center gap-1 bg-white/5 border border-white/10 rounded-xl p-1 w-full sm:w-auto" ref={btnRef}>
        <button onClick={() => onChange(addMonthsMk(value, -1))} className="w-9 h-9 shrink-0 rounded-lg grid place-items-center text-slate-400 hover:text-white hover:bg-white/10 active:scale-90 transition-all" title="Mese precedente">◀</button>
        <button onClick={toggle} className={`flex-1 px-3 py-2 rounded-lg text-sm transition-all min-w-[9.5rem] text-center ${open ? "bg-white/15 text-white" : "text-white hover:bg-white/10"}`} title="Apri il calendario">
          {labelMk(value)} <span className="text-slate-500 text-xs ml-1">▾</span>
        </button>
        <button onClick={() => onChange(addMonthsMk(value, 1))} disabled={max && value >= max} className="w-9 h-9 shrink-0 rounded-lg grid place-items-center text-slate-400 hover:text-white hover:bg-white/10 disabled:opacity-20 disabled:hover:bg-transparent disabled:cursor-not-allowed active:scale-90 transition-all" title="Mese successivo">▶</button>
      </div>
      {open && createPortal(
        <div ref={panelRef} className="fixed z-[95] w-72 rounded-2xl p-3 shadow-2xl border border-white/15" style={{ top: pos.top, left: pos.left, background: "rgba(14,17,26,0.97)", backdropFilter: "blur(24px)", animation: "popIn .2s cubic-bezier(.22,1,.36,1) both" }}>
          <div className="flex items-center justify-between mb-3">
            <button onClick={() => setViewY((y) => Math.max(YEAR_MIN, y - 1))} disabled={viewY <= YEAR_MIN} className="w-9 h-9 rounded-lg grid place-items-center text-slate-400 hover:text-white hover:bg-white/10 disabled:opacity-30 transition-all">◀</button>
            <div className="flex gap-1">
              {[viewY - 1, viewY, viewY + 1].filter((y) => y >= YEAR_MIN && y <= YEAR_MAX).map((y) => (
                <button key={y} onClick={() => setViewY(y)} className={`px-2.5 py-1 rounded-lg text-sm transition-all ${y === viewY ? "font-display text-white bg-white/10" : "text-slate-500 hover:text-white"}`}>{y}</button>
              ))}
            </div>
            <button onClick={() => setViewY((y) => Math.min(YEAR_MAX, y + 1))} disabled={viewY >= YEAR_MAX || (max && viewY >= maxY)} className="w-9 h-9 rounded-lg grid place-items-center text-slate-400 hover:text-white hover:bg-white/10 disabled:opacity-30 disabled:hover:bg-transparent disabled:cursor-not-allowed transition-all">▶</button>
          </div>
          <div className="grid grid-cols-3 gap-2">
            {MESI.map((label, m) => {
              const mk = mkOf(viewY, m);
              const active = m === selM && viewY === selY;
              const isNow = mk === nowMk;
              const isDisabled = max && mk > max;
              return (
                <button key={m} onClick={() => { onChange(mk); setOpen(false); }} disabled={isDisabled} className={`py-2.5 rounded-xl text-sm transition-all active:scale-95 ${active ? "bg-gradient-to-r from-indigo-400 to-violet-400 text-slate-950 font-semibold shadow-lg shadow-indigo-500/30" : isNow ? "text-indigo-300 bg-indigo-400/10 border border-indigo-400/30 hover:bg-indigo-400/20" : "text-slate-300 bg-white/5 hover:bg-white/10 hover:text-white disabled:opacity-10 disabled:hover:bg-white/5 disabled:hover:text-slate-300 disabled:cursor-not-allowed"}`}>{label}</button>
              );
            })}
          </div>
          <button onClick={() => { onChange(nowMk); setOpen(false); }} className="w-full mt-3 py-2 rounded-xl text-xs text-slate-400 bg-white/5 hover:bg-white/10 hover:text-white transition-all">Torna a oggi</button>
        </div>,
        document.body
      )}
    </>
  );
}

function MonthYearSelect({ value, onChange }) {

  return (

      <Select value={m} onChange={(e) => onChange(mkOf(y, Number(e.target.value)))} className="!w-auto">{MESI.map((l, i) => <option key={i} value={i}>{l}</option>)}</Select>
      <Select value={y} onChange={(e) => onChange(mkOf(Number(e.target.value), m))} className="!w-auto">{Array.from({ length: YEAR_MAX - YEAR_MIN + 1 }, (_, i) => YEAR_MIN + i).map((yy) => <option key={yy} value={yy}>{yy}</option>)}</Select>
    </div>
  );
}


function Dashboard({ patrimonio, isCurrentMonth, selMonth, setSelMonth, deltaMese, cur, prev, series, chartRange, setChartRange, txs, catById, accById, insights, investito, data, update, setTxModal, softDelete, setPage }) {
  const budgetTot = Object.values(data.budgets || {}).reduce((s, v) => s + v, 0);
  const budgetSpeso = Object.keys(data.budgets || {}).reduce((s, k) => s + cur.mt.filter((t) => t.tipo === "spesa" && t.categoria === k).reduce((x, t) => x + t.importo, 0), 0);
  const monthTxs = useMemo(() => txs.filter((t) => monthKey(t.data) === selMonth).slice(0, 6), [txs, selMonth]);

  /* La Dashboard può mostrare una qualsiasi combinazione dei tre blocchi
     patrimoniali. I valori vengono letti dalle sezioni Investimenti e Stipendio/TFR. */
  const savedToggles = data.settings?.patrimonioToggles || {};
  const [patrimonioToggles, setPatrimonioToggles] = useState({
    liquidi: savedToggles.liquidi ?? true,
    investimenti: savedToggles.investimenti ?? true,
    tfr: savedToggles.tfr ?? false,
  });

  useEffect(() => {
    const next = {
      liquidi: savedToggles.liquidi ?? true,
      investimenti: savedToggles.investimenti ?? true,
      tfr: savedToggles.tfr ?? false,
    };
    if (
      next.liquidi !== patrimonioToggles.liquidi ||
      next.investimenti !== patrimonioToggles.investimenti ||
      next.tfr !== patrimonioToggles.tfr
    ) setPatrimonioToggles(next);
  }, [data.settings?.patrimonioToggles?.liquidi, data.settings?.patrimonioToggles?.investimenti, data.settings?.patrimonioToggles?.tfr]); // eslint-disable-line

  const pf = usePortfolio(data.assets || [], data.trades || [], data.quotes || {}, data.portfolioSnapshots || []);
  const [isUpdatingQuotes, setIsUpdatingQuotes] = useState(false);

  /* Funzione per aggiornare le quotazioni, usata all'avvio e al click */
  const forceUpdateQuotes = async () => {
    if (!pf.aperte || pf.aperte.length === 0 || isUpdatingQuotes) return;
    setIsUpdatingQuotes(true);

    const cfg = data.settings?.market || {};
    marketData.configura(cfg);

    let ciSonoAggiornamenti = false;
    const nuoviDati = {};

    for (const a of pf.aperte) {
      try {
        const q = await marketData.quote(a, { forza: true });
        nuoviDati[a.id] = {
          prezzo: q.prezzo,
          variazione: q.variazione,
          valuta: q.valuta || a.valuta,
          fonte: q.fonte,
          aggiornato: new Date().toISOString()
        };
        ciSonoAggiornamenti = true;
      } catch (e) {
        // Ignoriamo gli errori silenziosamente sulla Dashboard
      }
    }

    if (ciSonoAggiornamenti) {
      update((d) => {
        if (!d.quotes) d.quotes = {};
        const oggi = new Date().toISOString().slice(0, 10);
        
        for (const [id, qData] of Object.entries(nuoviDati)) {
          d.quotes[id] = { ...(d.quotes[id] || {}), ...qData };
          const st = d.quotes[id].storico || [];
          const senzaOggi = st.filter((p) => p.data !== oggi);
          d.quotes[id].storico = [...senzaOggi, { data: oggi, prezzo: qData.prezzo }].slice(-400);
        }
        return d;
      });
    }
    
    setIsUpdatingQuotes(false);
  };

  // Esegue l'aggiornamento in automatico all'apertura della pagina
  useEffect(() => {
    forceUpdateQuotes();
  }, []); // eslint-disable-line

  const carrieraStats = useCarrieraStats(data, new Date().getFullYear());

  const valueAtOrBefore = useCallback((rows, key, valueKey, mk) => {
    const sorted = (rows || []).filter((r) => r && r[key] && r[key] <= mk).sort((a, b) => a[key].localeCompare(b[key]));
    return sorted.length ? Number(sorted[sorted.length - 1][valueKey]) || 0 : 0;
  }, []);

  const investimentiAt = useCallback((mk) => {
    if (mk === monthKey(new Date())) return pf.valore || 0;
    return valueAtOrBefore(pf.timeline, "mese", "Valore", mk);
  }, [pf, valueAtOrBefore]);

  const tfrAt = useCallback((mk) => {
    if (mk === monthKey(new Date())) return carrieraStats.tfrTotale || 0;
    return valueAtOrBefore(carrieraStats.tfrSerie, "mk", "totale", mk);
  }, [carrieraStats, valueAtOrBefore]);

  const interpolateMonthly = useCallback((iso, getValueFn) => {
    const mk = monthKey(iso);
    const prevMk = addMonthsMk(mk, -1);
    
    const prevVal = getValueFn(prevMk);
    const currVal = getValueFn(mk);
    
    const d = parseInt(iso.slice(8, 10), 10); // estrae il giorno (es. 15)
    const nowIso = todayISO();
    
    // Se siamo nel mese in corso, interpoliamo fino a 'oggi'
    if (mk === monthKey(nowIso)) {
      const todayD = new Date().getDate();
      const frac = todayD > 0 ? d / todayD : 1;
      return prevVal + (currVal - prevVal) * Math.min(1, frac);
    } 
    // Altrimenti interpoliamo sull'intero mese (passato)
    else {
      const [y, m] = mk.split("-").map(Number);
      const daysInMonth = new Date(y, m, 0).getDate();
      const frac = d / daysInMonth;
      return prevVal + (currVal - prevVal) * frac;
    }
  }, []);

  const componentValues = useMemo(() => ({
    liquidi: patrimonio,
    investimenti: investimentiAt(selMonth),
    tfr: tfrAt(selMonth),
  }), [patrimonio, selMonth, investimentiAt, tfrAt]);

  const patrimonioVisualizzato = useMemo(() => (
    (patrimonioToggles.liquidi ? componentValues.liquidi : 0) +
    (patrimonioToggles.investimenti ? componentValues.investimenti : 0) +
    (patrimonioToggles.tfr ? componentValues.tfr : 0)
  ), [patrimonioToggles, componentValues]);

  const togglePatrimonio = (key) => {
    const next = { ...patrimonioToggles, [key]: !patrimonioToggles[key] };
    setPatrimonioToggles(next);
    update((d) => {
      d.settings = d.settings || {};
      d.settings.patrimonioToggles = next;
      return d;
    });
  };

  const seriePatrimonio = useMemo(() => series.map((point) => {
    const liquidi = point.valore || 0;
    
    // Invece del gradino secco, usiamo la nostra nuova interpolazione!
    const investimenti = interpolateMonthly(point.iso, investimentiAt);
    const tfr = interpolateMonthly(point.iso, tfrAt);
    
    return {
      ...point,
      valore: Math.round(
        (patrimonioToggles.liquidi ? liquidi : 0) +
        (patrimonioToggles.investimenti ? investimenti : 0) +
        (patrimonioToggles.tfr ? tfr : 0)
      ),
    };
  }), [series, patrimonioToggles, investimentiAt, tfrAt, interpolateMonthly]);

  const deltaPatrimonio = useMemo(() => {
    const current = patrimonioVisualizzato;
    const previousMk = addMonthsMk(selMonth, -1);
    const previousLiquidi = prev ? patrimonio - cur.risparmio - cur.inv : 0;
    const previousInvestimenti = investimentiAt(previousMk);
    const previousTfr = tfrAt(previousMk);
    const fallbackLiquidi = previousLiquidi || 0;
    const previous = (patrimonioToggles.liquidi ? fallbackLiquidi : 0) +
      (patrimonioToggles.investimenti ? previousInvestimenti : 0) +
      (patrimonioToggles.tfr ? previousTfr : 0);
    return current - previous;
  }, [patrimonioVisualizzato, selMonth, patrimonioToggles, investimentiAt, tfrAt, patrimonio, prev, cur]);

  const toggleItems = [
    { key: "liquidi", label: "Cash", short: "Cash", icon: "●" },
    { key: "investimenti", label: "Portfolio", short: "Portfolio", icon: "↗" },
    { key: "tfr", label: "Ret. Account", short: "Ret. Account", icon: "◴" },
  ];

  return (
    <div className="max-w-6xl mx-auto">
      <header className="mb-6 flex flex-wrap items-end justify-between gap-3" style={{ animation: "fadeUp .5s both" }}>
        <div>
          <p className="text-xs uppercase tracking-[0.2em] text-slate-500">Dashboard</p>
          <h1 className="font-display text-2xl md:text-3xl text-white mt-1">Monthly Recap</h1>
        </div>
        <MonthNavigator value={selMonth} onChange={setSelMonth} max={monthKey(new Date())} />
      </header>
      {/* Hero patrimonio */}
      <Card className="p-5 sm:p-6 md:p-8 mb-5 relative overflow-hidden" delay={40} hover={false}>
        <div className="absolute -top-24 -right-24 w-72 h-72 rounded-full opacity-20 blur-3xl bg-gradient-to-br from-indigo-400 to-teal-300" />
        <div className="relative flex flex-col md:flex-row md:items-start justify-between gap-5">
          <div key={selMonth} style={{ animation: "fadeUp .4s both" }}>
            <div className="flex items-center gap-2 mb-1">
              <p className="text-sm text-slate-400">
                {isCurrentMonth ? "Financial Net Worth" : `Patrimonio a fine ${labelMk(selMonth).toLowerCase()}`}
              </p>
              {/* Mostra il tasto di aggiornamento solo sul mese in corso e se ci sono investimenti */}
              {isCurrentMonth && pf.aperte?.length > 0 && (
                <button 
                  onClick={forceUpdateQuotes} 
                  disabled={isUpdatingQuotes}
                  className={`text-slate-500 hover:text-white transition-all text-xs flex items-center justify-center w-5 h-5 rounded-md hover:bg-white/10 ${isUpdatingQuotes ? "animate-spin text-white" : ""}`}
                  title="Aggiorna quotazioni investimenti"
                >
                  ⟳
                </button>
              )}
            </div>
            <CountEur value={patrimonioVisualizzato} cls="font-display text-3xl sm:text-4xl md:text-5xl text-white tracking-tight tabular-nums" />
            <div className="mt-3 flex items-center gap-2 flex-wrap">
              <Chip tone={deltaPatrimonio >= 0 ? "up" : "down"}>{deltaPatrimonio >= 0 ? "▲" : "▼"} {eur(Math.abs(deltaPatrimonio))}</Chip>
              {!isCurrentMonth && <Chip>Vista storica</Chip>}
              {patrimonioToggles.investimenti && componentValues.investimenti > 0 && <Chip>{eur(componentValues.investimenti)} {toggleItems.find(i => i.key === "investimenti")?.label}</Chip>}
              {patrimonioToggles.tfr && componentValues.tfr > 0 && <Chip>{eur(componentValues.tfr)} {toggleItems.find(i => i.key === "tfr")?.label}</Chip>}
            </div>
          </div>
          <div className="flex flex-col items-stretch gap-2 shrink-0 w-full md:w-auto mt-1 md:mt-0">
            {/* Toggle Componenti Patrimonio */}
            <div className="flex gap-1 bg-white/5 rounded-xl p-1">
              {toggleItems.map((item) => {
                const active = patrimonioToggles[item.key];
                return (
                  <button
                    key={item.key}
                    type="button"
                    onClick={() => togglePatrimonio(item.key)}
                    className={`flex-1 px-3 py-1.5 rounded-lg text-xs whitespace-nowrap transition-all text-center ${
                      active ? "bg-white/15 text-white" : "text-slate-400 hover:text-white"
                    }`}
                  >
                    {item.short}
                  </button>
                );
              })}
            </div>
            {/* Selettore Tempo */}
            <div className="flex gap-1 bg-white/5 rounded-xl p-1">
              {[
                { l: "1M", v: 30 }, 
                { l: "3M", v: 90 }, 
                { l: "1Y", v: 365 }, 
                { l: "All", v: "all" }
              ].map((r) => (
                <button 
                  key={r.v} 
                  onClick={() => setChartRange(r.v)} 
                  className={`flex-1 px-3 py-1.5 rounded-lg text-xs whitespace-nowrap transition-all text-center ${chartRange == r.v ? "bg-white/15 text-white" : "text-slate-400 hover:text-white"}`}
                >
                  {r.l}
                </button>
              ))}
            </div>
          </div>
        </div>
        {/* GRAFICO */}
        <div className="h-48 md:h-56 mt-6 -mx-2">
          <ResponsiveContainer width="100%" height="100%">
            <AreaChart data={seriePatrimonio} margin={{ top: 4, right: 8, left: 8, bottom: 0 }}>
              <defs>
                <linearGradient id="gw" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#8B9DF9" stopOpacity={0.45} />
                  <stop offset="100%" stopColor="#8B9DF9" stopOpacity={0} />
                </linearGradient>
                <linearGradient id="gws" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stopColor="#8B9DF9" />
                  <stop offset="60%" stopColor="#A78BFA" />
                  <stop offset="100%" stopColor="#5EEAD4" />
                </linearGradient>
              </defs>
              <XAxis dataKey="giorno" tick={{ fill: "#64748B", fontSize: 11 }} axisLine={false} tickLine={false} minTickGap={40} />
              <YAxis hide domain={["dataMin - 200", "dataMax + 200"]} />
              <Tooltip content={<ChartTip />} />
              <Area type="monotone" dataKey="valore" name="Patrimonio" stroke="url(#gws)" strokeWidth={2.5} fill="url(#gw)" animationDuration={600} activeDot={{ r: 4, fill: "#5EEAD4", stroke: "rgba(94,234,212,.3)", strokeWidth: 6 }} />
            </AreaChart>
          </ResponsiveContainer>
        </div>
      </Card>
      {/* Quick stats */}
      <div key={"qs-" + selMonth} className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-5">
        {[
          { l: "Entrate mese", v: cur.entrate, tone: "text-emerald-300" },
          { l: "Uscite mese", v: cur.uscite, tone: "text-rose-300" },
          { l: "Risparmio", v: cur.risparmio, tone: cur.risparmio >= 0 ? "text-teal-300" : "text-rose-300" },
          { l: "Budget rimanente", v: Math.max(0, budgetTot - budgetSpeso), tone: "text-indigo-300" },
        ].map((s, i) => (
          <Card key={s.l} className="p-4" delay={60 + i * 60}>
            <p className="text-xs text-slate-400">{s.l}</p>
            <CountEur value={s.v} cls={`font-display text-xl md:text-2xl mt-1 block tabular-nums ${s.tone}`} />
          </Card>
        ))}
      </div>

      <div className="grid lg:grid-cols-5 gap-5">
        {/* Movimenti del mese */}
        <Card className="lg:col-span-3 p-5 min-w-0" delay={340} hover={false}>
          <div className="flex items-center justify-between mb-3">
            <h2 className="font-display text-white">Movimenti di {labelMk(selMonth).toLowerCase()}</h2>
            <button onClick={() => setPage("movimenti")} className="text-xs text-indigo-300 hover:text-indigo-200 transition-colors">Vedi tutti →</button>
          </div>
          <div key={"tx-" + selMonth}>
            <TxList txs={monthTxs} catById={catById} accById={accById} onEdit={setTxModal} onDelete={softDelete} compact />
            {monthTxs.length === 0 && <EmptyState text={`Nessun movimento a ${labelMk(selMonth).toLowerCase()}. Tocca + per registrarne uno.`} />}
          </div>
        </Card>

        {/* Insight */}
        <Card className="lg:col-span-2 p-5" delay={400} hover={false}>
          <h2 className="font-display text-white mb-3">Insight del mese</h2>
          <div key={"in-" + selMonth} className="space-y-3">
            {insights.map((t, i) => (
              <div key={i} className="flex gap-3 items-start p-3 rounded-xl bg-white/[0.04] border border-white/[0.06]" style={{ animation: `fadeUp .5s both`, animationDelay: `${120 + i * 90}ms` }}>
                <span className="text-indigo-300 mt-0.5">✦</span>
                <p className="text-sm text-slate-300 leading-snug">{t}</p>
              </div>
            ))}
            {insights.length === 0 && <EmptyState text="Gli insight appariranno quando ci saranno movimenti nel mese." />}
          </div>
        </Card>
      </div>
    </div>
  );
}


const TxRow = memo(function TxRow({ t, c, contoNome, contoDestNome, onEdit, compact, i }) {
  const isIn = t.tipo === "entrata";
  const isTr = t.tipo === "trasferimento";
  return (
    <div 
      onClick={() => onEdit(t)} 
      className="group flex items-center gap-3 py-2.5 px-1 rounded-lg cursor-pointer hover:bg-white/[0.06] active:bg-white/10 transition-colors" 
      style={{ animation: `fadeUp .4s both`, animationDelay: `${Math.min(i, 12) * 35}ms` }}
    >
      <div className="w-9 h-9 rounded-xl grid place-items-center text-base shrink-0" style={{ background: (c?.colore || "#94A3B8") + "1f", border: `1px solid ${(c?.colore || "#94A3B8")}33` }}>
        {isTr ? "⇄" : c?.icona || "•"}
      </div>
      <div className="min-w-0 flex-1">
        <p className="text-sm text-white truncate">{t.note || (isTr ? "Trasferimento tra conti" : c?.nome || "Movimento")}</p>
        <p className="text-xs text-slate-500 truncate">{[isTr ? `${contoNome || "?"} → ${contoDestNome || "?"}` : c ? c.nome + (t.sottocategoria ? " › " + t.sottocategoria : "") : null, !isTr ? contoNome : null, fmtDate(t.data)].filter(Boolean).join(" · ")}</p>
      </div>
      <span className={`text-sm tabular-nums font-medium shrink-0 whitespace-nowrap ${isIn ? "text-emerald-300" : isTr ? "text-slate-400" : "text-slate-200"}`}>{isIn ? "+" : isTr ? "" : "−"}{eur(t.importo)}</span>
    </div>
  );
});

function TxList({ txs, catById, accById, onEdit, onDelete, compact }) {
  return (
    <div className="divide-y divide-white/[0.05]">
      {txs.map((t, i) => (
        <TxRow key={t.id} t={t} c={catById[t.categoria]} contoNome={accById[t.conto]?.nome} contoDestNome={accById[t.contoDest]?.nome} onEdit={onEdit} onDelete={onDelete} compact={compact} i={i} />
      ))}
    </div>
  );
}

function Movimenti({ txs, catById, accById, data, setTxModal, softDelete }) {
  const nowMk = monthKey(new Date());
  const curYear = new Date().getFullYear();
  const [q, setQ] = useState("");
  const dq = useDeferredValue(q);
  const [fCat, setFCat] = useState("");
  const [fConto, setFConto] = useState("");
  const [fTipo, setFTipo] = useState("");
