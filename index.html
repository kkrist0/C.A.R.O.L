  const [pmode, setPmode] = useState("tutto"); // tutto | mese | anno | intervallo
  const [pMk, setPMk] = useState(nowMk);
  const [pYear, setPYear] = useState(curYear);
  const [pFrom, setPFrom] = useState(mkOf(curYear, 0));
  const [pTo, setPTo] = useState(nowMk);
  const [view, setView] = useState("gruppi"); // gruppi | lista
  const [limit, setLimit] = useState(60);
  const [collapsedGroups, setCollapsedGroups] = useState(new Set());
  const [expandedGroups, setExpandedGroups] = useState(new Set([nowMk]));
  const [showFilters, setShowFilters] = useState(false);

  // Effetto che controlla il campo di ricerca
  useEffect(() => {
    // Se il campo è vuoto, apri SOLO il mese corrente. Altrimenti lascia gestire alla ricerca.
    if (dq === "") {
      setExpandedGroups(new Set([nowMk]));
    }
  }, [dq, nowMk]);

  const toggleGroup = (mk) => {
    setExpandedGroups((prev) => {
      const next = new Set(prev);
      if (next.has(mk)) next.delete(mk);
      else next.add(mk);
      return next;
    });
  };
  useEffect(() => { setLimit(60); }, [dq, fCat, fConto, fTipo, pmode, pMk, pYear, pFrom, pTo]);

  /* mesi del periodo (null = nessun filtro temporale) */
  const periodMonths = useMemo(() => {
    if (pmode === "mese") return [pMk];
    if (pmode === "anno") return MESI.map((_, m) => mkOf(pYear, m));
    if (pmode === "intervallo") {
      let a = pFrom, b = pTo;
      if (a > b) [a, b] = [b, a];
      const out = []; let mk = a;
      while (mk <= b && out.length < 72) { out.push(mk); mk = addMonthsMk(mk, 1); }
      return out;
    }
    return null;
  }, [pmode, pMk, pYear, pFrom, pTo]);
  const periodSet = useMemo(() => (periodMonths ? new Set(periodMonths) : null), [periodMonths]);
  const periodLabel = pmode === "tutto" ? "Tutto lo storico" : pmode === "mese" ? labelMk(pMk) : pmode === "anno" ? `Anno ${pYear}` : `${labelMk(periodMonths[0])} → ${labelMk(periodMonths[periodMonths.length - 1])}`;

  const filtered = useMemo(() => txs.filter((t) => {
    if (periodSet && !periodSet.has(monthKey(t.data))) return false;
    if (fCat && t.categoria !== fCat) return false;
    if (fConto && t.conto !== fConto && t.contoDest !== fConto) return false;
    if (fTipo && t.tipo !== fTipo) return false;
    if (dq) {
      const s = `${t.note || ""} ${catById[t.categoria]?.nome || ""} ${t.sottocategoria || ""} ${accById[t.conto]?.nome || ""} ${(t.tags || []).join(" ")}`.toLowerCase();
      const escapeRegExp = (string) => string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const query = escapeRegExp(dq.toLowerCase());
      const regex = new RegExp(`\\b${query}`, 'i');
      if (!regex.test(s)) return false;
    }
    return true;
  }), [txs, dq, fCat, fConto, fTipo, periodSet, catById, accById]);

  /* totali del set filtrato */
  const tot = useMemo(() => {
    const spese = filtered.filter((t) => t.tipo === "spesa").reduce((s, t) => s + t.importo, 0);
    const entrate = filtered.filter((t) => t.tipo === "entrata").reduce((s, t) => s + t.importo, 0);
    return { spese, entrate };
  }, [filtered]);

  /* raggruppamento per mese (desc) */
  const groups = useMemo(() => {
    const m = new Map();
    filtered.forEach((t) => { const mk = monthKey(t.data); if (!m.has(mk)) m.set(mk, []); m.get(mk).push(t); });
    return [...m.entries()].sort((a, b) => b[0].localeCompare(a[0])).map(([mk, list]) => ({
      mk, list,
      spese: list.filter((t) => t.tipo === "spesa").reduce((s, t) => s + t.importo, 0),
      entrate: list.filter((t) => t.tipo === "entrata").reduce((s, t) => s + t.importo, 0),
    }));
  }, [filtered]);

  /* grafico spese mese per mese sul periodo (anno o intervallo) */
  const chartData = useMemo(() => {
    if (!periodMonths || pmode === "mese") return null;
    return periodMonths.map((mk) => {
      const mt = filtered.filter((t) => monthKey(t.data) === mk);
      return {
        mese: periodMonths.length > 12 ? labelMkShort(mk) : MESI[parseMk(mk).m],
        Spese: Math.round(mt.filter((t) => t.tipo === "spesa").reduce((s, t) => s + t.importo, 0)),
        Entrate: Math.round(mt.filter((t) => t.tipo === "entrata").reduce((s, t) => s + t.importo, 0)),
      };
    });
  }, [periodMonths, pmode, filtered]);
  const chartAvg = useMemo(() => {
    if (!chartData) return null;
    const attivi = chartData.filter((r) => r.Spese > 0);
    return attivi.length ? attivi.reduce((s, r) => s + r.Spese, 0) / attivi.length : 0;
  }, [chartData]);

  /* distribuzione categorie del periodo filtrato */
  const catDist = useMemo(() => {
    const m = {};
    filtered.filter((t) => t.tipo === "spesa").forEach((t) => (m[t.categoria] = (m[t.categoria] || 0) + t.importo));
    const entries = Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 6);
    const max = Math.max(1, ...entries.map(([, v]) => v));
    return { entries, max };
  }, [filtered]);

  const visible = filtered.slice(0, limit);

  return (
    <div className="max-w-4xl mx-auto">
      <header className="mb-5 flex items-end justify-between gap-3 flex-wrap" style={{ animation: "fadeUp .5s both" }}>
        <div>
          <p className="text-xs uppercase tracking-[0.2em] text-slate-500">Movimenti</p>
          <h1 className="font-display text-xl sm:text-2xl text-white mt-1">Spese ed entrate nel tempo</h1>
        </div>
        <BtnPrimary onClick={() => setTxModal({})}>+ Nuovo</BtnPrimary>
      </header>

      {/* filtro periodo */}
      <Card className="p-4 mb-4" hover={false} delay={40}>
        <div className="flex flex-wrap items-center gap-3">
          <div className="flex gap-1 bg-white/5 rounded-xl p-1">
            {[{ v: "tutto", l: "Tutto" }, { v: "mese", l: "Mese" }, { v: "anno", l: "Anno" }, { v: "intervallo", l: "Intervallo" }].map((t) => (
              <button key={t.v} onClick={() => setPmode(t.v)} className={`px-3 py-1.5 rounded-lg text-xs transition-all ${pmode === t.v ? "bg-white/15 text-white" : "text-slate-400 hover:text-white"}`}>{t.l}</button>
            ))}
          </div>
          {pmode === "mese" && <MonthNavigator value={pMk} onChange={setPMk} />}
          {pmode === "anno" && (
            <div className="flex items-center gap-1 bg-white/5 border border-white/10 rounded-xl p-1 flex-wrap">
              <button onClick={() => setPYear((y) => Math.max(YEAR_MIN, y - 1))} disabled={pYear <= YEAR_MIN} className="w-8 h-8 rounded-lg grid place-items-center text-slate-400 hover:text-white hover:bg-white/10 disabled:opacity-30 transition-all">◀</button>
              {Array.from({ length: YEAR_MAX - YEAR_MIN + 1 }, (_, i) => YEAR_MIN + i).map((y) => (
                <button key={y} onClick={() => setPYear(y)} className={`px-2.5 py-1.5 rounded-lg text-xs transition-all ${pYear === y ? "bg-white/15 text-white" : "text-slate-500 hover:text-white"}`}>{y}</button>
              ))}
              <button onClick={() => setPYear((y) => Math.min(YEAR_MAX, y + 1))} disabled={pYear >= YEAR_MAX} className="w-8 h-8 rounded-lg grid place-items-center text-slate-400 hover:text-white hover:bg-white/10 disabled:opacity-30 transition-all">▶</button>
            </div>
          )}
          {pmode === "intervallo" && (
            <div className="flex flex-wrap items-center gap-2">
              <MonthYearSelect value={pFrom} onChange={setPFrom} />
              <span className="text-slate-500 text-sm">→</span>
              <MonthYearSelect value={pTo} onChange={setPTo} />
            </div>
          )}

          {/* TASTO RESET VISIBILE SOLO SU DESKTOP (in alto a destra) */}
          <div className="hidden md:flex ml-auto bg-white/5 rounded-xl p-1">
            <button 
              onClick={() => { setQ(""); setFTipo(""); setFCat(""); setFConto(""); }} 
              disabled={!(q || fTipo || fCat || fConto)}
              className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs transition-all duration-300 ${
                q || fTipo || fCat || fConto
                  ? "bg-rose-500/15 text-rose-300 hover:bg-rose-500/25 active:scale-95 cursor-pointer"
                  : "text-slate-500 cursor-not-allowed"
              }`}
            >
              ✕ Azzera filtri
            </button>
          </div>

          {/* PULSANTE FILTRI VISIBILE SOLO SU MOBILE */}
          <button
            onClick={() => setShowFilters(!showFilters)}
            className={`md:hidden ml-auto p-1 active:scale-95 transition-colors duration-300 ${
              q || fTipo || fCat || fConto
                ? "text-indigo-400"
                : "text-white/40 hover:text-white/70"
            }`}
            aria-label="Mostra o nascondi i filtri"
          >
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="7" y1="12" x2="17" y2="12" />
              <line x1="11" y1="18" x2="13" y2="18" />
            </svg>
          </button>
        </div>

        {/* GRIGLIA ANIMATA E PULSANTE RESET */}
        <div className={`flex flex-col transition-all duration-300 ease-in-out overflow-hidden ${showFilters ? "max-h-[500px] mt-3 opacity-100" : "max-h-0 opacity-0 md:max-h-[500px] md:mt-3 md:opacity-100"}`}>
          
          <div className="grid sm:grid-cols-2 md:grid-cols-4 gap-3">
            <Input placeholder="Cerca note, categorie, tag…" value={q} onChange={(e) => setQ(e.target.value)} />
            <Select value={fTipo} onChange={(e) => setFTipo(e.target.value)}><option value="">Tutti i tipi</option><option value="spesa">Spese</option><option value="entrata">Entrate</option><option value="trasferimento">Trasferimenti</option></Select>
            <Select value={fCat} onChange={(e) => setFCat(e.target.value)}><option value="">Tutte le categorie</option>{[...data.categories].sort((a, b) => a.ordine - b.ordine).map((c) => <option key={c.id} value={c.id}>{c.icona} {c.nome}</option>)}</Select>
            <Select value={fConto} onChange={(e) => setFConto(e.target.value)}><option value="">Tutti i conti</option>{data.accounts.map((a) => <option key={a.id} value={a.id}>{a.icona} {a.nome}</option>)}</Select>
          </div>

          {/* TASTO RESET VISIBILE SOLO SU MOBILE (in basso sotto i filtri) */}
          <div className="mt-3 flex md:hidden justify-end">
            <button 
              onClick={() => { setQ(""); setFTipo(""); setFCat(""); setFConto(""); }} 
              disabled={!(q || fTipo || fCat || fConto)}
              className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs transition-all duration-300 ${
                q || fTipo || fCat || fConto
                  ? "bg-rose-500/15 text-rose-300 hover:bg-rose-500/25 active:scale-95 cursor-pointer"
                  : "bg-white/5 text-slate-500 cursor-not-allowed"
              }`}
            >
              ✕ Azzera filtri
            </button>
          </div>
          
        </div>
      </Card>

      {/* riepilogo del periodo filtrato */}
      <div key={"sum-" + periodLabel + fCat + fConto + fTipo} className="grid grid-cols-3 gap-3 mb-4">
        <Card className="p-3.5" delay={60}><p className="text-[11px] text-slate-500">Spese · {periodLabel.toLowerCase()}</p><CountEur value={tot.spese} cls="font-display text-lg text-rose-300 tabular-nums" /></Card>
        <Card className="p-3.5" delay={110}><p className="text-[11px] text-slate-500">Entrate</p><CountEur value={tot.entrate} cls="font-display text-lg text-emerald-300 tabular-nums" /></Card>
        <Card className="p-3.5" delay={160}><p className="text-[11px] text-slate-500">Saldo</p><CountEur value={tot.entrate - tot.spese} cls={`font-display text-lg tabular-nums ${tot.entrate - tot.spese >= 0 ? "text-teal-300" : "text-rose-300"}`} /></Card>
      </div>

      {/* grafici del periodo (anno / intervallo) */}
      {chartData && (
        <Card className="p-5 mb-4" hover={false} delay={180}>
          <h2 className="font-display text-white mb-3">Spese mese per mese · {periodLabel}</h2>
          <div className="h-52">
            <ResponsiveContainer width="100%" height="100%">
              <ComposedChart data={chartData} barGap={3}>
                <CartesianGrid vertical={false} stroke="rgba(255,255,255,.05)" />
                <XAxis dataKey="mese" tick={{ fill: "#64748B", fontSize: 11 }} axisLine={false} tickLine={false} minTickGap={10} />
                <YAxis tick={{ fill: "#64748B", fontSize: 11 }} axisLine={false} tickLine={false} width={44} />
                <Tooltip content={<ChartTip />} cursor={{ fill: "rgba(255,255,255,.04)" }} />
                <Bar dataKey="Spese" fill="#FB7185" fillOpacity={0.85} radius={[6, 6, 0, 0]} maxBarSize={46} animationDuration={900} />
                <Line type="monotone" dataKey="Spese" name="Andamento" stroke="#FDA4AF" strokeWidth={2} dot={{ r: 2.5, fill: "#FDA4AF" }} animationDuration={1100} />
              </ComposedChart>
            </ResponsiveContainer>
          </div>
          {chartAvg > 0 && <p className="text-[11px] text-slate-500 mt-2">Media dei mesi con spese: <b className="text-slate-300">{eur(chartAvg)}</b> · i mesi sopra la media meritano un'occhiata.</p>}
          {catDist.entries.length > 0 && (
            <div className="mt-4 space-y-2">
              <p className="text-[11px] uppercase tracking-wider text-slate-500">Distribuzione categorie</p>
              {catDist.entries.map(([k, v]) => {
                const c = catById[k];
                return (
                  <div key={k} className="flex items-center gap-2.5">
                    <span className="w-6 text-center text-sm shrink-0">{c?.icona || "•"}</span>
                    <span className="text-xs text-slate-300 w-28 truncate shrink-0">{c?.nome || "Senza categoria"}</span>
                    <div className="flex-1 h-2 rounded-full bg-white/5 overflow-hidden">
                      <div className="h-full rounded-full transition-all duration-700 ease-out" style={{ width: `${(v / catDist.max) * 100}%`, background: c?.colore || "#8B9DF9" }} />
                    </div>
                    <span className="text-xs text-slate-400 tabular-nums w-20 text-right shrink-0">{eur(v)}</span>
                  </div>
                );
              })}
            </div>
          )}
        </Card>
      )}

      {/* vista: raggruppata / lista */}
      <div className="flex items-center justify-between mb-3" style={{ animation: "fadeUp .4s both" }}>
        <p className="text-xs text-slate-500">{filtered.length} movimenti</p>
        <div className="flex gap-1 bg-white/5 rounded-xl p-1">
          {[{ v: "gruppi", l: "Per mese" }, { v: "lista", l: "Lista" }].map((t) => (
            <button key={t.v} onClick={() => setView(t.v)} className={`px-3 py-1 rounded-lg text-xs transition-all ${view === t.v ? "bg-white/15 text-white" : "text-slate-400 hover:text-white"}`}>{t.l}</button>
          ))}
        </div>
      </div>
      {view === "gruppi" ? (
        <div className="space-y-4">
          {groups.map((g, gi) => {
            // È espanso se c'è del testo nella ricerca, OPPURE se l'utente/il default lo ha espanso
            const isExpanded = dq !== "" ? true : expandedGroups.has(g.mk);
            
            return (
              <Card key={g.mk} className="p-4" hover={false} delay={Math.min(gi, 6) * 60}>
                <div 
                  className={`flex items-center justify-between mb-1 flex-wrap gap-2 select-none ${dq === "" ? "cursor-pointer" : ""}`}
                  // Permettiamo di cliccare per chiudere/aprire solo se NON stiamo cercando
                  onClick={() => { if (dq === "") toggleGroup(g.mk); }}
                >
                  <h3 className="font-display text-white flex items-center gap-2">
                    <span className="text-slate-500 text-xs transition-transform duration-200" style={{ transform: isExpanded ? "rotate(0deg)" : "rotate(-90deg)" }}>▼</span>
                    {labelMk(g.mk)}
                  </h3>
                  <div className="flex gap-2 text-xs">
                    {g.spese > 0 && <Chip tone="down">Spese {eur(g.spese)}</Chip>}
                    {g.entrate > 0 && <Chip tone="up">Entrate {eur(g.entrate)}</Chip>}
                  </div>
                </div>
                {isExpanded && (
                  <div style={{ animation: "fadeIn .2s ease-out" }}>
                    <TxList txs={g.list} catById={catById} accById={accById} onEdit={setTxModal} onDelete={softDelete} />
                    <p className="text-[11px] text-slate-500 mt-2 pt-2 border-t border-white/[0.05] text-right">Totale {MESI[parseMk(g.mk).m]}: <b className="text-slate-300">{eur(g.spese)}</b> di spese{g.entrate > 0 ? ` · ${eur(g.entrate)} di entrate` : ""}</p>
                  </div>
                )}
              </Card>
            );
          })}
          {groups.length === 0 && <Card className="p-4" hover={false}><EmptyState text="Nessun movimento con questi filtri." /></Card>}
        </div>
      ) : (
        <Card className="p-4" hover={false}>
          <TxList txs={visible} catById={catById} accById={accById} onEdit={setTxModal} onDelete={softDelete} />
          {filtered.length === 0 && <EmptyState text="Nessun risultato con questi filtri." />}
          {filtered.length > visible.length && (
            <button onClick={() => setLimit((l) => l + 100)} className="w-full mt-3 py-2 rounded-xl bg-white/5 border border-white/10 text-xs text-slate-300 hover:bg-white/10 transition-all">Mostra altri {Math.min(100, filtered.length - visible.length)}</button>
          )}
        </Card>
      )}
    </div>
  );
}


/* ============================================================
   VIAGGI — components/WorldMap
   Mappa SVG vettoriale: pan, zoom, paesi cliccabili, pin animati,
   clustering automatico per prossimità. Zero dipendenze esterne.
   ============================================================ */
/* ============================================================
   GOOGLE DRIVE — archivio dei documenti personali
   Autenticazione con Google Identity Services (token client-side):
   nessun backend, nessun segreto nel file. L'ambito richiesto è
   drive.file, il più ristretto possibile: l'app vede soltanto i
   file che ha creato lei, non il resto del tuo Drive.
   ============================================================ */
const DRIVE_CFG_KEY = "C.A.R.O.L.:drive";
const DRIVE_SCOPE_BASE = "https://www.googleapis.com/auth/drive.file";
const DRIVE_SCOPE_LETTURA = "https://www.googleapis.com/auth/drive.readonly";
const DRIVE_ROOT = ["Finance Manager", "Documenti"];
/* Aggiungere un tipo di documento significa aggiungere una riga qui:
   la cartella su Drive, la pagina e i filtri si adeguano da soli. */
const DOC_CATEGORIE = [
  { id: "cedolini", nome: "Cedolini", cartella: "Cedolini", icona: "💼", colore: "#8B9DF9", perAnno: true, prefisso: "Cedolino" },
  { id: "cu", nome: "CU", cartella: "CU", icona: "📑", colore: "#5EEAD4", perAnno: true, prefisso: "CU" },
  { id: "m730", nome: "Modello 730", cartella: "730", icona: "🧾", colore: "#FBBF24", perAnno: true, prefisso: "730" },
  { id: "f24", nome: "F24", cartella: "F24", icona: "🏛️", colore: "#F472B6", perAnno: true, prefisso: "F24" },
  { id: "estratti", nome: "Estratti conto", cartella: "Estratti Conto", icona: "🏦", colore: "#38BDF8", perAnno: true, prefisso: "Estratto" },
  { id: "investimenti", nome: "Investimenti", cartella: "Investimenti", icona: "📈", colore: "#A78BFA", perAnno: true, prefisso: "Investimento" },
  { id: "fatture", nome: "Fatture e ricevute", cartella: "Fatture", icona: "🧮", colore: "#86EFAC", perAnno: true, prefisso: "Fattura" },
  { id: "assicurazioni", nome: "Assicurazioni", cartella: "Assicurazioni", icona: "🛡️", colore: "#FDBA74", perAnno: false, prefisso: "Polizza" },
  { id: "auto", nome: "Auto", cartella: "Auto", icona: "🚗", colore: "#C4B5FD", perAnno: false, prefisso: "Auto" },
  { id: "altro", nome: "Altro", cartella: "Altro", icona: "📂", colore: "#94A3B8", perAnno: false, prefisso: "Documento" },
];
const docCat = (id) => DOC_CATEGORIE.find((c) => c.id === id) || DOC_CATEGORIE[DOC_CATEGORIE.length - 1];

/** Nome del file su Drive: una regola unica, valida sia per l'archivio
    sia per i cedolini caricati dalla sezione Stipendio.
    Con il mese  → Cedolino_Luglio_2026.pdf
    Con l'anno   → CU_2026.pdf
    Senza date   → Documento_2026-08-05.pdf */
function nomeFileDocumento({ tipo, mese, anno, originale }) {
  const cat = docCat(tipo);
  const est = (originale || "").match(/\.[a-z0-9]+$/i)?.[0]?.toLowerCase() || ".pdf";
  if (mese) {
    const { y, m } = parseMk(mese);
    const nomeMese = MESI_ESTESI[m];
    return `${cat.prefisso}_${nomeMese}_${y}${est}`;
  }
  if (anno) return `${cat.prefisso}_${anno}${est}`;
  return `${cat.prefisso}_${todayISO()}${est}`;
}
const MESI_ESTESI = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];

/** l'origine da registrare in Google Cloud: schema + dominio, senza percorso */
function origineCorrente() {
  try { return window.location.origin; } catch { return ""; }
}

class DriveError extends Error {
  constructor(tipo, messaggio, { suggerimento = "" } = {}) { super(messaggio); this.tipo = tipo; this.suggerimento = suggerimento; }
}

const driveService = {
  clientId: "",
  token: null,           // { access_token, scadenza }
  _tokenClient: null,
  _cartelle: new Map(),  // percorso → id, per non ricrearle a ogni caricamento
  _blob: new Map(),      // fileId → object URL già scaricato

  configura(cfg) {
    if (cfg.clientId !== this.clientId) { this.clientId = cfg.clientId || ""; this._tokenClient = null; }
    this.letturaEsterna = !!cfg.letturaEsterna;
  },
  get collegato() { return !!this.token?.access_token && Date.now() < (this.token.scadenza || 0); },
  get scope() { return this.letturaEsterna ? `${DRIVE_SCOPE_BASE} ${DRIVE_SCOPE_LETTURA}` : DRIVE_SCOPE_BASE; },

  /** carica la libreria di Google una sola volta */
  async _caricaGis() {
    if (window.google?.accounts?.oauth2) return window.google;
    if (!this._gisPromise) {
      this._gisPromise = new Promise((res, rej) => {
        const sc = document.createElement("script");
        sc.src = "https://accounts.google.com/gsi/client";
        sc.async = true; sc.defer = true;
        sc.onload = () => (window.google?.accounts?.oauth2 ? res(window.google) : rej(new DriveError("libreria", "Libreria Google non disponibile.")));
        sc.onerror = () => rej(new DriveError("rete", "Impossibile caricare la libreria Google.", { suggerimento: "Serve una connessione attiva." }));
        document.head.appendChild(sc);
      });
    }
    return this._gisPromise;
  },

  /** chiede il consenso e ottiene un token valido circa un'ora */
  async collega({ silenzioso = false } = {}) {
    if (!this.clientId) throw new DriveError("config", "Manca l'ID client OAuth.", { suggerimento: "Impostalo in Impostazioni → Google Drive." });
    if (location.protocol === "file:") {
      throw new DriveError("origine", "Google non consente l'accesso da un file aperto localmente.",
        { suggerimento: "Pubblica l'app su un indirizzo https (per esempio GitHub Pages) e autorizza quell'origine." });
    }
    const google = await this._caricaGis();
    return new Promise((res, rej) => {
      this._tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: this.clientId,
        scope: this.scope,
        prompt: silenzioso ? "" : "consent",
        callback: (r) => {
          if (r.error) {
            const testo = `${r.error} ${r.error_description || ""}`;
            if (/invalid_client|unregistered|origin/i.test(testo)) {
              return rej(new DriveError("origine", "Google non riconosce questa origine.",
                { suggerimento: `Aggiungi ${origineCorrente()} tra le "Origini JavaScript autorizzate" del tuo ID client, senza percorso finale.` }));
            }
            return rej(new DriveError("consenso", "Autorizzazione non concessa.", { suggerimento: r.error_description || "" }));
          }
          this.token = { access_token: r.access_token, scadenza: Date.now() + (Number(r.expires_in) || 3600) * 1000 - 60000 };
          res(this.token);
        },
        error_callback: (e) => {
          const t = `${e?.type || ""} ${e?.message || ""}`;
          if (/invalid_client|origin|idpiframe/i.test(t)) {
            return rej(new DriveError("origine", "Google non riconosce questa origine.",
              { suggerimento: `Aggiungi ${origineCorrente()} tra le "Origini JavaScript autorizzate" del tuo ID client.` }));
          }
          rej(new DriveError("consenso", "Finestra di autorizzazione chiusa prima di concedere l'accesso.", { suggerimento: "Riprova e completa i passaggi nella finestra di Google." }));
        },
      });
      this._tokenClient.requestAccessToken({ prompt: silenzioso ? "" : "consent" });
    });
  },

  scollega() {
    try { if (this.token?.access_token) window.google?.accounts?.oauth2?.revoke(this.token.access_token, () => {}); } catch {}
    this.token = null; this._cartelle.clear();
    this._blob.forEach((u) => URL.revokeObjectURL(u)); this._blob.clear();
  },

  /** rinnova il token in silenzio quando sta per scadere */
  async _assicuraToken() {
    if (this.collegato) return this.token.access_token;
    await this.collega({ silenzioso: true });
    return this.token.access_token;
  },

  async _api(url, opts = {}, tentativo = 0) {
    const tk = await this._assicuraToken();
    const r = await fetch(url, { ...opts, headers: { Authorization: `Bearer ${tk}`, ...(opts.headers || {}) } });
    if (r.status === 401 && tentativo === 0) { this.token = null; return this._api(url, opts, 1); }   // token scaduto: uno e un solo nuovo tentativo
    if (r.status === 403) {
      const t = await r.text();
      if (/rateLimit|userRateLimit|quota/i.test(t)) throw new DriveError("limite", "Google ha applicato un limite temporaneo.", { suggerimento: "Riprova tra un minuto." });
      throw new DriveError("permessi", "Permesso negato da Google Drive.", { suggerimento: "Verifica gli ambiti concessi durante l'autorizzazione." });
    }
    if (r.status === 404) throw new DriveError("nonTrovato", "File o cartella non trovati su Drive.");
    if (!r.ok) throw new DriveError("api", `Errore Google Drive (${r.status}).`);
    return r;
  },

  /** crea la cartella se non esiste e ne restituisce l'identificativo */
  async _cartella(nome, genitore) {
    const chiave = `${genitore || "root"}/${nome}`;
    if (this._cartelle.has(chiave)) return this._cartelle.get(chiave);
    const q = [`name='${nome.replace(/'/g, "\\'")}'`, "mimeType='application/vnd.google-apps.folder'", "trashed=false", genitore ? `'${genitore}' in parents` : "'root' in parents"].join(" and ");
    const r = await this._api(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)&pageSize=1`);
    const j = await r.json();
    let id = j.files?.[0]?.id;
    if (!id) {
      const c = await this._api("https://www.googleapis.com/drive/v3/files?fields=id", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: nome, mimeType: "application/vnd.google-apps.folder", parents: genitore ? [genitore] : undefined }),
      });
      id = (await c.json()).id;
    }
    this._cartelle.set(chiave, id);
    return id;
  },

  /** Finance Manager / Documenti / <categoria> [/ <anno>] */
  async percorso(categoria, anno) {
    let padre = null;
    const parti = [...DRIVE_ROOT, categoria];
    if (anno) parti.push(String(anno));
    for (const nome of parti) padre = await this._cartella(nome, padre);
    return padre;
  },

  /** carica un file mantenendo l'originale su Drive (multipart: metadati + contenuto) */
  async carica(file, { categoria = "Cedolini", anno, nomeFile }) {
    const parent = await this.percorso(categoria, anno);
    const meta = { name: nomeFile || file.name, parents: [parent] };
    const bordo = "C.A.R.O.L." + Math.random().toString(36).slice(2);
    const corpo = new Blob([
      `--${bordo}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n`,
      `--${bordo}\r\nContent-Type: ${file.type || "application/octet-stream"}\r\n\r\n`,
      file, `\r\n--${bordo}--`,
    ]);
    const r = await this._api("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,mimeType,size,webViewLink,createdTime", {
      method: "POST", headers: { "Content-Type": `multipart/related; boundary=${bordo}` }, body: corpo,
    });
    const j = await r.json();
    return { driveFileId: j.id, nomeFile: j.name, mime: j.mimeType, dimensione: Number(j.size) || file.size, webViewLink: j.webViewLink, dataCaricamento: (j.createdTime || new Date().toISOString()).slice(0, 10) };
  },

  /** scarica il contenuto e ne crea un indirizzo temporaneo: nessun file reso pubblico */
  async contenuto(fileId) {
    if (this._blob.has(fileId)) return this._blob.get(fileId);
    const r = await this._api(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    const url = URL.createObjectURL(await r.blob());
    this._blob.set(fileId, url);
    return url;
  },

  /** sostituisce il contenuto conservando lo stesso file su Drive: il riferimento resta valido */
  async sostituisci(fileId, file, nuovoNome) {
    const r = await this._api(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media&fields=id,name,mimeType,size,modifiedTime`, {
      method: "PATCH", headers: { "Content-Type": file.type || "application/octet-stream" }, body: file,
    });
    const j = await r.json();
    if (nuovoNome && nuovoNome !== j.name) {
      await this._api(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=name`, {
        method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: nuovoNome }),
      });
    }
    this._blob.delete(fileId);   // l'anteprima in cache non è più valida
    return { driveFileId: fileId, nomeFile: nuovoNome || j.name, mime: j.mimeType, dimensione: Number(j.size) || file.size, dataCaricamento: (j.modifiedTime || new Date().toISOString()).slice(0, 10) };
  },

  /** verifica che il file esista ancora su Drive (stato della sincronizzazione) */
  async verifica(fileId) {
    try {
      const r = await this._api(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=id,name,size,modifiedTime,trashed`);
      const j = await r.json();
      return j.trashed ? { stato: "cestinato" } : { stato: "ok", nome: j.name, dimensione: Number(j.size) || 0, modificato: j.modifiedTime };
    } catch (e) { return { stato: e.tipo === "nonTrovato" ? "mancante" : "errore", messaggio: e.message }; }
  },

  async elimina(fileId) { try { await this._api(`https://www.googleapis.com/drive/v3/files/${fileId}`, { method: "DELETE" }); } catch (e) { if (e.tipo !== "nonTrovato") throw e; } },

  /** cerca una cartella per nome senza crearla; null se non esiste */
  async trovaCartella(nome, genitore) {
    const q = [`name='${nome.replace(/'/g, "\\'")}'`, "mimeType='application/vnd.google-apps.folder'", "trashed=false", genitore ? `'${genitore}' in parents` : "'root' in parents"].join(" and ");
    const r = await this._api(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)&pageSize=1`);
    return (await r.json()).files?.[0]?.id || null;
  },

  /** percorso già esistente, senza crearne di nuovi */
  async percorsoEsistente(parti) {
    let padre = null;
    for (const nome of parti) {
      padre = await this.trovaCartella(nome, padre);
      if (!padre) return null;
    }
    return padre;
  },

  /** tutti i file di una categoria, comprese le sottocartelle per anno */
  async scansiona(cartellaCategoria) {
    const base = await this.percorsoEsistente([...DRIVE_ROOT, cartellaCategoria]);
    if (!base) return [];
    const dentro = await this.elenca(base);
    const file = dentro.filter((f) => !/folder/.test(f.mimeType)).map((f) => ({ ...f, anno: "" }));
    const sottocartelle = dentro.filter((f) => /folder/.test(f.mimeType));
    for (const c of sottocartelle) {
      const figli = await this.elenca(c.id);
      figli.filter((f) => !/folder/.test(f.mimeType)).forEach((f) => file.push({ ...f, anno: /^20\d{2}$/.test(c.name) ? c.name : "" }));
    }
    return file;
  },

  /** elenca i PDF di una cartella (serve per l'importazione automatica) */
  async elenca(cartellaId) {
    const q = `'${cartellaId}' in parents and trashed=false`;
    const r = await this._api(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name,mimeType,size,createdTime)&pageSize=200&orderBy=name`);
    return (await r.json()).files || [];
  },
};

/* --- riconoscimento del mese dal nome del file --- */
const MESI_NOME = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];
/** Cedolino_Luglio_2026.pdf · BustaPaga_07_2026.pdf · 2026-07 cedolino.pdf → "2026-07" */
function meseDaNomeFile(nome) {
  const n = (nome || "").toLowerCase().replace(/\.[a-z0-9]+$/, "");
  let anno = null, mese = null;
  const isoDiretto = n.match(/(20\d{2})[-_ ](0[1-9]|1[0-2])/);
  if (isoDiretto) return `${isoDiretto[1]}-${isoDiretto[2]}`;
  const annoM = n.match(/(20\d{2})/);
  if (annoM) anno = annoM[1];
  for (let i = 0; i < 12; i++) if (n.includes(MESI_NOME[i])) { mese = String(i + 1).padStart(2, "0"); break; }
  if (!mese) {
    const num = n.match(/(?:^|[^0-9])(0[1-9]|1[0-2])(?:[^0-9]|$)/);
    if (num && anno) mese = num[1];
  }
  return anno && mese ? `${anno}-${mese}` : null;
}

/* ---------------- services/cedoliniStore ----------------
   I cedolini caricati come file restano in chiavi separate dell'archivio
   locale: non entrano nel blob principale e quindi non finiscono mai su
   Google Sheets, dove una cella regge al massimo 50.000 caratteri.
   Sul foglio viaggia solo il riferimento (link o nome del file).
   -------------------------------------------------------- */
const CEDOLINO_PREFIX = "C.A.R.O.L.:cedolino:";
const cedoliniStore = {
  async leggi(payslipId) {
    try { const r = await window.storage.get(CEDOLINO_PREFIX + payslipId); return r?.value ? JSON.parse(r.value) : null; } catch { return null; }
  },
  async salva(payslipId, file) {
    const dati = await this._prepara(file);
    await window.storage.set(CEDOLINO_PREFIX + payslipId, JSON.stringify(dati));
    return { tipo: "file", nome: file.name, mime: dati.mime, dimensione: dati.dimensione };
  },
  async elimina(payslipId) { try { await window.storage.delete(CEDOLINO_PREFIX + payslipId); } catch {} },

  /** le immagini vengono ridotte per non saturare lo spazio; i PDF restano intatti */
  async _prepara(file) {
    const troppoGrande = file.size > 4 * 1024 * 1024;
    if (troppoGrande) throw new Error("Il file supera i 4 MB: caricalo su Drive e incolla il link.");
    if (!file.type.startsWith("image/")) {
      const b64 = await this._base64(file);
      return { mime: file.type || "application/pdf", nome: file.name, dimensione: file.size, dati: b64 };
    }
    const b64 = await this._comprimiImmagine(file);
    return { mime: "image/jpeg", nome: file.name, dimensione: Math.round((b64.length * 3) / 4), dati: b64 };
  },
  _base64(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(",")[1] || "");
      r.onerror = () => rej(new Error("Impossibile leggere il file."));
      r.readAsDataURL(file);
    });
  },
  _comprimiImmagine(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max = 1800;
          const scala = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * scala); c.height = Math.round(img.height * scala);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL("image/jpeg", 0.78).split(",")[1]);
        };
        img.onerror = () => rej(new Error("Immagine non leggibile."));
        img.src = String(r.result);
      };
      r.onerror = () => rej(new Error("Impossibile leggere il file."));
      r.readAsDataURL(file);
    });
  },
  dataUrl(d) { return `data:${d.mime};base64,${d.dati}`; },
};

/* ---------------- services/photoService ----------------
   Copertina automatica: cerca il MONUMENTO PIÙ ICONICO della destinazione.
   Il criterio di fama sono le visualizzazioni della pagina Wikipedia negli
   ultimi 60 giorni: attorno a Roma vince il Colosseo, a Parigi la Torre
   Eiffel, a Milano il Duomo. La pagina della città stessa viene esclusa
   dalla gara (è un panorama, non un simbolo) e usata solo come ripiego.
   -------------------------------------------------------- */
const photoService = {
  _cache: new Map(),
  _langs: ["it", "en"],
  /* pagine che non rappresentano mai una meta */
  _bad(t) { return /disambigua|disambiguation|\(film\)|\(album\)|\(azienda\)|\(gruppo|società|s\.p\.a|stazione di|aeroporto|ospedale|liceo|università degli studi|linea \d|metropolitana di|elezioni|storia di|economia di|geografia di|provincia di|comune di|arcidiocesi|diocesi/i.test(t); },
  _norm(s) { return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim(); },

  /** monumenti e attrazioni attorno al punto, ordinati per popolarità reale */
  async byLandmark(lat, lon, lang, nomeLuogo) {
    const url = `https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*` +
      `&generator=geosearch&ggscoord=${lat}%7C${lon}&ggsradius=10000&ggslimit=40` +
      `&prop=pageimages|coordinates|pageviews&piprop=thumbnail&pithumbsize=1600&pvipdays=60`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const pages = Object.values((await res.json())?.query?.pages || {});
    const luogo = this._norm(nomeLuogo);
    const scored = pages
      .filter((p) => p.thumbnail?.source && !this._bad(p.title))
      .map((p) => ({
        title: p.title,
        img: p.thumbnail.source,
        /* somma delle visite giornaliere = quanto è conosciuto */
        views: Object.values(p.pageviews || {}).reduce((s, v) => s + (v || 0), 0),
        isLuogo: this._norm(p.title) === luogo,
      }))
      .sort((a, b) => b.views - a.views);
    if (!scored.length) return null;
    /* il simbolo della città: il più visitato che non sia la città stessa */
    const simbolo = scored.find((p) => !p.isLuogo && p.views > 0);
    const cityPage = scored.find((p) => p.isLuogo);
    const best = simbolo || cityPage || scored[0];
    return { img: best.img, title: best.title, alt: scored.filter((p) => p !== best).slice(0, 7).map((p) => p.img) };
  },

  /** articolo con quel titolo esatto (ripiego, e per luoghi che sono essi stessi l'attrazione) */
  async byTitle(titolo, lang, near) {
    if (!titolo) return null;
    const res = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(titolo)}?redirect=true`);
    if (!res.ok) return null;
    const j = await res.json();
    if (j.type === "disambiguation" || !j.thumbnail?.source) return null;
    if (near && j.coordinates && haversine([j.coordinates.lat, j.coordinates.lon], near) > 80) return null;
    return { img: j.originalimage?.source || j.thumbnail.source, title: j.title, alt: [] };
  },

  /** ricerca testuale, accettata solo se geograficamente coerente */
  async bySearch(query, lang, near) {
    const url = `https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrlimit=5&prop=pageimages|coordinates&piprop=thumbnail&pithumbsize=1600`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const pages = Object.values((await res.json())?.query?.pages || {})
      .filter((p) => p.thumbnail?.source && !this._bad(p.title))
      .sort((a, b) => (a.index || 9) - (b.index || 9));
    for (const p of pages) {
      const c = p.coordinates?.[0];
      if (near && (!c || haversine([c.lat, c.lon], near) > 80)) continue;
      return { img: p.thumbnail.source, title: p.title, alt: [] };
    }
    return null;
  },

  /** risultato completo: immagine scelta, titolo e alternative da scorrere */
  async lookup(citta, paese, lat, lon) {
    const key = `${citta}|${paese}|${lat}`;
    if (this._cache.has(key)) return this._cache.get(key);
    const near = lat != null && lon != null ? [lat, lon] : null;
    const nome = (citta || "").trim();
    let out = null;
    for (const lang of this._langs) {
      try { if (near) out = await this.byLandmark(lat, lon, lang, nome); } catch {}
      if (out?.img) break;
      try { out = await this.byTitle(nome, lang, near); } catch {}
      if (out?.img) break;
      try { out = await this.bySearch(`${nome} ${paese ? countryLabel(paese) : ""}`.trim(), lang, near); } catch {}
      if (out?.img) break;
      try { if (!nome && paese) out = await this.byTitle(countryLabel(paese), lang, null); } catch {}
      if (out?.img) break;
    }
    const val = out?.img ? out : null;
    this._cache.set(key, val);
    return val;
  },

  async best(citta, paese, lat, lon) { return (await this.lookup(citta, paese, lat, lon))?.img || null; },
  async candidates(citta, paese, lat, lon) {
    const r = await this.lookup(citta, paese, lat, lon);
    return r ? [r.img, ...(r.alt || [])] : [];
  },
};

/** hook: copertina automatica della destinazione (con override manuale) */
function useAutoCover(citta, paese, lat, lon, autoAttivo, onFound) {
  const [state, setState] = useState("idle"); // idle | loading | ok | none
  const [soggetto, setSoggetto] = useState("");
  const lastKey = useRef("");
  useEffect(() => {
    const key = `${citta}|${paese}|${lat}`;
    if (!autoAttivo || !citta || key === lastKey.current) return;
    lastKey.current = key;
    let alive = true;
    setState("loading");
    photoService.lookup(citta, paese, lat, lon)
      .then((r) => { if (!alive) return; if (r?.img) { setState("ok"); setSoggetto(r.title || ""); onFound(r.img); } else setState("none"); })
      .catch(() => alive && setState("none"));
    return () => { alive = false; };
  }, [citta, paese, lat, lon, autoAttivo]); // eslint-disable-line
  return { state, soggetto };
}

/* ---------------- services/geocodingService ----------------
   Ricerca luoghi reali (città, monumenti, spiagge, rifugi, hotel…)
   via Nominatim/OpenStreetMap, con fallback sul dataset locale.
   ------------------------------------------------------------ */
const geocodingService = {
  _cache: new Map(),
  local(q) {
    const ql = q.trim().toLowerCase();
    if (!ql) return [];
    return CITIES.filter(([nm, co]) => nm.toLowerCase().includes(ql) || countryLabel(co).toLowerCase().includes(ql))
      .slice(0, 6)
      .map(([nm, co, la, lo]) => ({ nome: nm, paese: co, lat: la, lon: lo, tipo: "città", fonte: "locale" }));
  },
  async search(q, signal) {
    const key = q.trim().toLowerCase();
    if (!key) return [];
    if (this._cache.has(key)) return this._cache.get(key);
    const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&accept-language=it&limit=6&q=${encodeURIComponent(q)}`;
    const res = await fetch(url, { signal, headers: { Accept: "application/json" } });
    if (!res.ok) throw new Error("geocoding non disponibile");
    const raw = await res.json();
    const out = raw.map((r) => {
      const cc = (r.address?.country_code || "").toUpperCase();
      const paese = Object.keys(COUNTRY_META).find((k) => COUNTRY_META[k][5] === cc || COUNTRY_META[k][0] === r.address?.country || k === r.address?.country) || r.address?.country || "";
      return {
        nome: (r.name || r.display_name.split(",")[0]).trim(),
        etichetta: r.display_name,
        paese, lat: +r.lat, lon: +r.lon,
        tipo: (r.type || r.category || "luogo").replace(/_/g, " "),
        fonte: "osm",
      };
    }).filter((x) => x.paese);
    this._cache.set(key, out);
    return out;
  },
};

/** hook: ricerca luoghi con debounce, annullamento e fallback offline */
function usePlaceSearch(query) {
  const [res, setRes] = useState([]);
  const [loading, setLoading] = useState(false);
  const [offline, setOffline] = useState(false);
  useEffect(() => {
    const q = query.trim();
    if (q.length < 2) { setRes([]); setLoading(false); setOffline(false); return; }
    const localHits = geocodingService.local(q);
    setRes(localHits);
    const ctrl = new AbortController();
    const t = setTimeout(async () => {
      setLoading(true);
      try {
        const remote = await geocodingService.search(q, ctrl.signal);
        const seen = new Set(remote.map((r) => r.nome.toLowerCase()));
        setRes([...remote, ...localHits.filter((l) => !seen.has(l.nome.toLowerCase()))].slice(0, 8));
        setOffline(false);
      } catch (e) {
        if (e.name !== "AbortError") { setOffline(true); setRes(localHits); }
      } finally { setLoading(false); }
    }, 450);
    return () => { clearTimeout(t); ctrl.abort(); };
  }, [query]);
  return { res, loading, offline };
}

/* ============================================================
   VIAGGI — Globe3D
   Globo terrestre realistico (globe.gl + three.js, caricati da CDN).
   Texture satellitari, atmosfera, rilievi, rotazione automatica,
   zoom cinematici, marker con glow, rotte animate tra i viaggi.
   Se la libreria non è disponibile (es. anteprima artifact) ricade
   automaticamente sulla mappa vettoriale.
   ============================================================ */
const GLOBE_TEX = {
  day: "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg",
  topo: "https://unpkg.com/three-globe/example/img/earth-topology.png",
  sky: "https://unpkg.com/three-globe/example/img/night-sky.png",
};

/** carica globe.gl una sola volta e lo tiene in cache */
let globeLibPromise = null;
function loadGlobeLib() {
  if (typeof window === "undefined") return Promise.reject(new Error("no window"));
  if (window.Globe) return Promise.resolve(window.Globe);
  if (globeLibPromise) return globeLibPromise;
  globeLibPromise = new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://unpkg.com/globe.gl@2.46.1/dist/globe.gl.min.js";
    sc.async = true;
    sc.onload = () => (window.Globe ? res(window.Globe) : rej(new Error("Globe non disponibile")));
    sc.onerror = () => rej(new Error("Impossibile caricare la libreria del globo"));
    document.head.appendChild(sc);
  });
  return globeLibPromise;
}

/** interpolazione sulla sfera: posizione dell'aereo lungo la rotta */
function slerpLatLng(a, b, t) {
  const rad = Math.PI / 180, deg = 180 / Math.PI;
  const [la1, lo1] = [a[0] * rad, a[1] * rad], [la2, lo2] = [b[0] * rad, b[1] * rad];
  const d = 2 * Math.asin(Math.sqrt(Math.sin((la2 - la1) / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin((lo2 - lo1) / 2) ** 2));
  if (!d) return { lat: a[0], lng: a[1] };
  const A = Math.sin((1 - t) * d) / Math.sin(d), B = Math.sin(t * d) / Math.sin(d);
  const x = A * Math.cos(la1) * Math.cos(lo1) + B * Math.cos(la2) * Math.cos(lo2);
  const y = A * Math.cos(la1) * Math.sin(lo1) + B * Math.cos(la2) * Math.sin(lo2);
  const z = A * Math.sin(la1) + B * Math.sin(la2);
  return { lat: Math.atan2(z, Math.hypot(x, y)) * deg, lng: Math.atan2(y, x) * deg };
}

function Globe3D({ trips, wishlist = [], onSelectTrip, selectedTripId, height = 470, onFallback }) {
  const holder = useRef(null);
  const globeRef = useRef(null);
  const planeRef = useRef(null);
  const [status, setStatus] = useState("loading"); // loading | ready | error
  const [hovered, setHovered] = useState(null);
  const [filtro, setFiltro] = useState([]);
  const [autoRot, setAutoRot] = useState(true);
  const cbRef = useRef({ onSelectTrip });
  useEffect(() => { cbRef.current.onSelectTrip = onSelectTrip; }, [onSelectTrip]);

  const visibili = useMemo(() => (filtro.length ? trips.filter((t) => filtro.includes(countryRegion(t.paese))) : trips).filter((t) => t.lat || t.lon), [trips, filtro]);

  /* cluster per prossimità geografica (gradi) */
  const marker = useMemo(() => {
    const out = [];
    [...visibili].sort((a, b) => (a.partenza || "").localeCompare(b.partenza || "")).forEach((t) => {
      const near = out.find((c) => Math.hypot(c.lat - t.lat, c.lng - t.lon) < 3.5);
      if (near) { near.trips.push(t); near.lat = (near.lat * (near.trips.length - 1) + t.lat) / near.trips.length; near.lng = (near.lng * (near.trips.length - 1) + t.lon) / near.trips.length; }
      else out.push({ id: t.id, lat: t.lat, lng: t.lon, trips: [t] });
    });
    return out.map((c) => ({ ...c, tipo: "viaggio", col: CONTINENT_COLORS[countryRegion(c.trips[0].paese)] || "#8B9DF9" }));
  }, [visibili]);

  const wishMarker = useMemo(() => wishlist.filter((w) => w.lat || w.lon).map((w) => ({ id: "w" + w.id, lat: w.lat, lng: w.lon, tipo: "wish", nome: w.nome, col: "#FCD34D" })), [wishlist]);
  const allMarkers = useMemo(() => [...marker, ...wishMarker], [marker, wishMarker]);

  /* rotte: solo tra viaggi realmente consecutivi nel tempo */
  const archi = useMemo(() => {
    const ord = [...visibili].sort((a, b) => (a.partenza || "").localeCompare(b.partenza || ""));
    const out = [];
    for (let i = 1; i < ord.length; i++) {
      const a = ord[i - 1], b = ord[i];
      if (haversine([a.lat, a.lon], [b.lat, b.lon]) < 60) continue; // stessa zona: nessuna rotta
      out.push({ startLat: a.lat, startLng: a.lon, endLat: b.lat, endLng: b.lon,
        col: [CONTINENT_COLORS[countryRegion(a.paese)] || "#8B9DF9", CONTINENT_COLORS[countryRegion(b.paese)] || "#5EEAD4"],
        from: [a.lat, a.lon], to: [b.lat, b.lon], label: `${a.citta || countryLabel(a.paese)} → ${b.citta || countryLabel(b.paese)}` });
    }
    return out;
  }, [visibili]);

  /* ---- inizializzazione del globo (una sola volta) ---- */
  useEffect(() => {
    let alive = true, globe = null, planeTimer = null;
    loadGlobeLib().then((Globe) => {
      if (!alive || !holder.current) return;
      globe = Globe({ animateIn: true })(holder.current)
        .globeImageUrl(GLOBE_TEX.day)
        .bumpImageUrl(GLOBE_TEX.topo)
        .backgroundImageUrl(GLOBE_TEX.sky)
        .backgroundColor("rgba(8,11,18,1)")
        .showAtmosphere(true).atmosphereColor("#7DD3FC").atmosphereAltitude(0.17)
        .arcAltitudeAutoScale(0.42).arcStroke(0.5).arcDashLength(0.45).arcDashGap(0.9).arcDashAnimateTime(2600)
        .arcColor("col").arcLabel("label").arcsTransitionDuration(700)
        .pointOfView({ lat: 30, lng: 10, altitude: 2.4 }, 0);
      globe.controls().autoRotate = true;
      globe.controls().autoRotateSpeed = 0.35;
      globe.controls().enableDamping = true;
      globe.controls().dampingFactor = 0.12;
      globe.controls().minDistance = 130;
      globe.controls().maxDistance = 560;
      globe.controls().addEventListener("start", () => { globe.controls().autoRotate = false; setAutoRot(false); });
      globeRef.current = globe;
      /* misura subito e poi di nuovo al frame successivo, quando il layout è assestato */
      const el0 = holder.current;
      if (el0?.clientWidth) { globe.width(el0.clientWidth); globe.height(el0.clientHeight); }
      requestAnimationFrame(() => {
        const el1 = holder.current;
        if (globeRef.current && el1?.clientWidth) { globeRef.current.width(el1.clientWidth); globeRef.current.height(el1.clientHeight); }
      });
      setStatus("ready");
    }).catch(() => { if (alive) { setStatus("error"); onFallback?.(); } });

    /* il globo deve seguire esattamente il riquadro che lo contiene, altrimenti
       la tela resta della dimensione iniziale e la Terra appare fuori centro */
    const adatta = () => {
      const g = globeRef.current, el = holder.current;
      if (!g || !el || !el.clientWidth) return;
      g.width(el.clientWidth);
      g.height(el.clientHeight);
    };
    const ro = typeof ResizeObserver !== "undefined" ? new ResizeObserver(adatta) : null;
    if (holder.current && ro) ro.observe(holder.current);
    window.addEventListener("resize", adatta);
    return () => {
      alive = false;
      ro?.disconnect();
      window.removeEventListener("resize", adatta);
      clearInterval(planeTimer);
      try { globeRef.current?._destructor?.(); } catch {}
      if (holder.current) holder.current.innerHTML = "";
      globeRef.current = null;
    };
  }, []); // eslint-disable-line

  /* riallinea le dimensioni a ogni cambio di stato o altezza */
  useEffect(() => {
    const g = globeRef.current, el = holder.current;
    if (status === "ready" && g && el?.clientWidth) { g.width(el.clientWidth); g.height(el.clientHeight); }
  }, [status, height]);

  /* ---- marker HTML: glow, hover, click ---- */
  useEffect(() => {
    const g = globeRef.current;
    if (status !== "ready" || !g) return;
    g.htmlElementsData(allMarkers)
      .htmlLat("lat").htmlLng("lng").htmlAltitude(0.012)
      .htmlElement((d) => {
        const el = document.createElement("div");
        el.style.cssText = "position:relative;width:0;height:0;pointer-events:auto;cursor:pointer;";
        if (d.tipo === "plane") {
          el.style.pointerEvents = "none";
          el.innerHTML = `<div class="gm-plane">✈</div>`;
          return el;
        }
        const isSel = d.tipo === "viaggio" && d.trips.some((t) => t.id === selectedTripId);
        const many = d.tipo === "viaggio" && d.trips.length > 1;
        const label = d.tipo === "wish" ? "★" : many ? d.trips.length : d.trips[0].icona || "✈";
        el.innerHTML = `
          <div class="gm ${isSel ? "gm-sel" : ""}" style="--c:${d.col}">
            <span class="gm-halo"></span>
            <span class="gm-dot">${label}</span>
          </div>`;
        const inner = el.firstElementChild;
        inner.addEventListener("mouseenter", () => setHovered(d));
        inner.addEventListener("mouseleave", () => setHovered((h) => (h === d ? null : h)));
        inner.addEventListener("click", (ev) => {
          ev.stopPropagation();
          if (d.tipo === "wish") return;
          const t = d.trips[0];
          globeRef.current?.pointOfView({ lat: t.lat, lng: t.lon, altitude: many ? 1.1 : 0.75 }, 1200);
          globeRef.current.controls().autoRotate = false; setAutoRot(false);
          cbRef.current.onSelectTrip?.(t);
        });
        return el;
      });
  }, [allMarkers, status, selectedTripId]);

  /* ---- rotte + aereo che percorre la tratta più recente ---- */
  useEffect(() => {
    const g = globeRef.current;
    if (status !== "ready" || !g) return;
    g.arcsData(archi);
    const last = archi[archi.length - 1];
    if (!last) { g.htmlElementsData(allMarkers); return; }
    /* il ciclo dell'aereo riscrive i marker: senza una guardia, il ciclo della
       versione precedente continuerebbe a reinserire i dati vecchi e i viaggi
       eliminati ricomparirebbero sul globo */
    let vivo = true, raf = null, timer = null;
    const t0 = performance.now();
    const step = () => {
      if (!vivo || globeRef.current !== g) return;
      const p = ((performance.now() - t0) / 5200) % 1;
      const pos = slerpLatLng(last.from, last.to, p);
      planeRef.current = { ...pos, p };
      g.htmlElementsData([...allMarkers, { id: "plane", tipo: "plane", lat: pos.lat, lng: pos.lng, col: "#E2E8F0", rot: 0 }]);
      timer = setTimeout(() => { if (vivo) raf = requestAnimationFrame(step); }, 90); // ~11fps: fluido e leggero
    };
    step();
    return () => { vivo = false; if (raf) cancelAnimationFrame(raf); if (timer) clearTimeout(timer); };
  }, [archi, status, allMarkers]);

  /* ---- vola verso il viaggio selezionato ---- */
  useEffect(() => {
    const g = globeRef.current;
    if (status !== "ready" || !g || !selectedTripId) return;
    const t = trips.find((x) => x.id === selectedTripId);
    if (t && (t.lat || t.lon)) g.pointOfView({ lat: t.lat, lng: t.lon, altitude: 0.9 }, 1400);
  }, [selectedTripId, status]); // eslint-disable-line

  const toggleRot = () => {
    const g = globeRef.current; if (!g) return;
    const next = !autoRot; g.controls().autoRotate = next; setAutoRot(next);
  };
  const resetView = () => { globeRef.current?.pointOfView({ lat: 25, lng: 10, altitude: 2.4 }, 1200); };
  const toggleCont = (c) => setFiltro((f) => (f.includes(c) ? f.filter((x) => x !== c) : [...f, c]));

  if (status === "error") return <WorldMap trips={trips} wishlist={wishlist} onSelectTrip={onSelectTrip} onSelectCountry={() => {}} selectedTripId={selectedTripId} height={height} />;

  return (
    <div className="relative rounded-2xl overflow-hidden border border-white/10 bg-[#080B12]" style={{ height }}>
      <div ref={holder} className="absolute inset-0" />

      {status === "loading" && (
        <div className="absolute inset-0 grid place-items-center">
          <div className="text-center">
            <div className="w-14 h-14 mx-auto rounded-full border-2 border-sky-400/30 border-t-sky-300" style={{ animation: "spin 1s linear infinite" }} />
            <p className="text-xs text-slate-500 mt-3">Carico il globo terrestre…</p>
          </div>
        </div>
      )}

      {/* legenda continenti */}
      {status === "ready" && (
        <div className="absolute top-3 left-1/2 -translate-x-1/2 flex flex-wrap justify-center gap-1.5 px-2 max-w-[92%] pointer-events-auto">
          {CONTINENTS.map((c) => {
            const on = !filtro.length || filtro.includes(c);
            return (
              <button key={c} onClick={() => toggleCont(c)} className={`flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] border transition-all ${on ? "text-white border-white/15" : "text-slate-500 border-white/5 opacity-50"}`} style={{ background: on ? "rgba(8,12,20,.8)" : "rgba(8,12,20,.5)", backdropFilter: "blur(10px)" }}>
                <span className="w-2 h-2 rounded-full" style={{ background: CONTINENT_COLORS[c] }} />{c}
              </button>
            );
          })}
        </div>
      )}

      {/* preview al passaggio del mouse */}
      {hovered && hovered.tipo !== "plane" && (
        <div className="absolute bottom-3 left-3 right-3 sm:right-auto sm:w-64 rounded-xl border border-white/12 p-3 pointer-events-none" style={{ background: "rgba(10,14,22,.94)", backdropFilter: "blur(16px)", animation: "fadeUp .2s both" }}>
          {hovered.tipo === "wish" ? (
            <><p className="text-sm text-amber-200">★ {hovered.nome}</p><p className="text-[11px] text-slate-500">Nella tua wishlist</p></>
          ) : (
            <>
              <div className="flex items-center gap-2">
                <span className="text-lg">{hovered.trips[0].icona}</span>
                <div className="min-w-0">
                  <p className="text-sm text-white truncate">{hovered.trips.length > 1 ? `${hovered.trips.length} viaggi` : hovered.trips[0].nome}</p>
                  <p className="text-[11px] text-slate-500 truncate">{countryFlag(hovered.trips[0].paese)} {hovered.trips[0].citta || countryLabel(hovered.trips[0].paese)}</p>
                </div>
              </div>
              <p className="text-[11px] text-slate-400 mt-1.5">{hovered.trips.map((t) => t.partenza?.slice(0, 4)).filter((v, i, a) => a.indexOf(v) === i).join(", ")} · clicca per esplorare</p>
            </>
          )}
        </div>
      )}

      {/* controlli */}
      {status === "ready" && (
        <div className="absolute top-3 right-3 flex flex-col gap-1.5">
          <button onClick={toggleRot} title={autoRot ? "Ferma la rotazione" : "Riprendi la rotazione"} className="w-8 h-8 rounded-lg text-sm border border-white/10 hover:bg-white/15 transition-all" style={{ background: "rgba(8,12,20,.85)", backdropFilter: "blur(12px)", color: autoRot ? "#7DD3FC" : "#94A3B8" }}>{autoRot ? "⏸" : "▶"}</button>
          <button onClick={resetView} title="Vista mondo" className="w-8 h-8 rounded-lg text-sm text-slate-300 border border-white/10 hover:bg-white/15 hover:text-white transition-all" style={{ background: "rgba(8,12,20,.85)", backdropFilter: "blur(12px)" }}>⌖</button>
        </div>
      )}
      {status === "ready" && (
        <p className="absolute bottom-3 right-3 text-[10px] text-slate-600 pointer-events-none">{visibili.length} {visibili.length === 1 ? "meta" : "mete"} · trascina per ruotare</p>
      )}
    </div>
  );
}

const CONTINENT_COLORS = { Europa: "#38BDF8", Asia: "#FB7185", America: "#FBBF24", Africa: "#A78BFA", Oceania: "#F472B6", Antartide: "#94A3B8" };
const CONTINENTS = ["Europa", "Asia", "America", "Africa", "Oceania"];
/* tinte terra: ogni continente ha una sua sfumatura, così la mappa si legge a colpo d'occhio */
const CONTINENT_LAND = { Europa: "#1C2A3E", Asia: "#31212D", America: "#312A1E", Africa: "#28213A", Oceania: "#301D2F", Antartide: "#1C222E" };
const PIN_PATH = "M0 0c-4.6-6-6.7-8.6-6.7-11.5a6.7 6.7 0 1 1 13.4 0C6.7-8.6 4.6-6 0 0z";

function WorldMap({ trips, wishlist = [], onSelectTrip, onSelectCountry, selectedCountry, selectedTripId, height = 460, showWishlist = true, showLegend = true, showRoutes = true, compact = false }) {
  const [view, setView] = useState({ x: 0, y: 0, k: 1 });
  const [hoverCountry, setHoverCountry] = useState(null);
  const [hoverPin, setHoverPin] = useState(null);
  const [filtro, setFiltro] = useState([]); // continenti attivi ([] = tutti)
  const svgRef = useRef(null);
  const drag = useRef(null);
  const pinch = useRef(null);

  const visibili = useMemo(() => (filtro.length ? trips.filter((t) => filtro.includes(countryRegion(t.paese))) : trips), [trips, filtro]);

  const visited = useMemo(() => {
    const m = {};
    visibili.forEach((t) => { if (t.paese) m[t.paese] = (m[t.paese] || 0) + 1; });
    return m;
  }, [visibili]);

  const clusters = useMemo(() => {
    const soglia = 30 / view.k;
    const out = [];
    visibili.filter((t) => t.lat || t.lon).forEach((t) => {
      const p = geoToXY(t.lat, t.lon);
      const near = out.find((c) => Math.hypot(c.x - p.x, c.y - p.y) < soglia);
      if (near) { near.trips.push(t); near.x = (near.x * (near.trips.length - 1) + p.x) / near.trips.length; near.y = (near.y * (near.trips.length - 1) + p.y) / near.trips.length; }
      else out.push({ x: p.x, y: p.y, trips: [t] });
    });
    return out;
  }, [visibili, view.k]);

  const wishPins = useMemo(() => (showWishlist ? wishlist.filter((w) => w.lat || w.lon).map((w) => ({ ...w, ...geoToXY(w.lat, w.lon) })) : []), [wishlist, showWishlist]);

  /* rotte da casa verso le mete più recenti */
  const routes = useMemo(() => {
    if (!showRoutes) return [];
    const ord = [...visibili].filter((t) => t.lat || t.lon).sort((a, b) => (a.partenza || "").localeCompare(b.partenza || ""));
    const out = [];
    for (let i = 1; i < ord.length; i++) {
      const a = ord[i - 1], b = ord[i];
      if (haversine([a.lat, a.lon], [b.lat, b.lon]) < 60) continue;
      const p1 = geoToXY(a.lat, a.lon), p2 = geoToXY(b.lat, b.lon);
      const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2 - Math.hypot(p2.x - p1.x, p2.y - p1.y) * 0.2;
      out.push({ d: `M${p1.x} ${p1.y} Q${mx} ${my} ${p2.x} ${p2.y}`, col: CONTINENT_COLORS[countryRegion(b.paese)] || "#8B9DF9" });
    }
    return out.slice(-8);
  }, [visibili, showRoutes]);

  const clampView = useCallback((v) => {
    const k = Math.max(1, Math.min(9, v.k));
    const maxX = (MAP_W * (k - 1)) / k, maxY = (MAP_H * (k - 1)) / k;
    return { k, x: Math.max(-maxX, Math.min(0, v.x)), y: Math.max(-maxY, Math.min(0, v.y)) };
  }, []);

  const onWheel = (e) => {
    e.preventDefault();
    const r = svgRef.current.getBoundingClientRect();
    const mx = ((e.clientX - r.left) / r.width) * (MAP_W / view.k) - view.x;
    const my = ((e.clientY - r.top) / r.height) * (MAP_H / view.k) - view.y;
    setView((v) => {
      const k = Math.max(1, Math.min(9, v.k * (e.deltaY < 0 ? 1.2 : 1 / 1.2)));
      return clampView({ k, x: -(mx - ((e.clientX - r.left) / r.width) * (MAP_W / k)), y: -(my - ((e.clientY - r.top) / r.height) * (MAP_H / k)) });
    });
  };
  const pt = (e) => { const t = e.touches ? e.touches[0] : e; return { x: t.clientX, y: t.clientY }; };
  const onDown = (e) => {
    if (e.touches && e.touches.length === 2) { pinch.current = { d: Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY), k: view.k }; return; }
    const p = pt(e); drag.current = { sx: p.x, sy: p.y, vx: view.x, vy: view.y, moved: false };
  };
  const onMove = (e) => {
    if (pinch.current && e.touches?.length === 2) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      setView((v) => clampView({ ...v, k: pinch.current.k * (d / pinch.current.d) })); return;
    }
    if (!drag.current) return;
    const p = pt(e), r = svgRef.current.getBoundingClientRect();
    const dx = ((p.x - drag.current.sx) / r.width) * MAP_W / view.k;
    const dy = ((p.y - drag.current.sy) / r.height) * MAP_H / view.k;
    if (Math.abs(p.x - drag.current.sx) + Math.abs(p.y - drag.current.sy) > 4) drag.current.moved = true;
    setView((v) => clampView({ ...v, x: drag.current.vx + dx, y: drag.current.vy + dy }));
  };
  const onUp = () => { drag.current = null; pinch.current = null; };
  const zoomTo = (lat, lon, k = 4) => { const p = geoToXY(lat, lon); setView(clampView({ k, x: MAP_W / (2 * k) - p.x, y: MAP_H / (2 * k) - p.y })); };
  const reset = () => setView({ x: 0, y: 0, k: 1 });
  const toggleCont = (c) => setFiltro((f) => (f.includes(c) ? f.filter((x) => x !== c) : [...f, c]));

  const vb = `${-view.x} ${-view.y} ${MAP_W / view.k} ${MAP_H / view.k}`;
  const inv = 1 / view.k;

  return (
    <div className="relative rounded-2xl overflow-hidden border border-white/10" style={{ height }}>
      <svg ref={svgRef} viewBox={vb} preserveAspectRatio="xMidYMid slice" className="w-full h-full touch-none select-none cursor-grab active:cursor-grabbing"
        onWheel={onWheel} onMouseDown={onDown} onMouseMove={onMove} onMouseUp={onUp} onMouseLeave={onUp}
        onTouchStart={onDown} onTouchMove={onMove} onTouchEnd={onUp}>
        <defs>
          <radialGradient id="ocean" cx="50%" cy="35%" r="75%">
            <stop offset="0%" stopColor="#12233D" /><stop offset="55%" stopColor="#0D1828" /><stop offset="100%" stopColor="#080D16" />
          </radialGradient>
          <filter id="pinGlow" x="-80%" y="-80%" width="260%" height="260%">
            <feDropShadow dx="0" dy="1.6" stdDeviation="1.8" floodColor="#000" floodOpacity="0.6" />
          </filter>
          <filter id="landShade" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="0.6" stdDeviation="0.8" floodColor="#000" floodOpacity="0.5" />
          </filter>
        </defs>
        <rect x="-200" y="-200" width={MAP_W + 400} height={MAP_H + 400} fill="url(#ocean)" />
        {/* paesi colorati per continente */}
        <g filter="url(#landShade)">
          {Object.entries(COUNTRY_PATHS).map(([nm, d]) => {
            const reg = countryRegion(nm);
            const base = CONTINENT_LAND[reg] || "#232A38";
            const isVisited = !!visited[nm];
            const isSel = selectedCountry === nm;
            const isHover = hoverCountry === nm;
            const accent = CONTINENT_COLORS[reg] || "#8B9DF9";
            return (
              <path key={nm} d={d}
                fill={isSel ? accent + "70" : isVisited ? accent + "3D" : isHover ? accent + "26" : base}
                stroke={isSel || isVisited ? accent + "99" : "rgba(148,163,184,0.14)"}
                strokeWidth={(isSel ? 0.9 : 0.35) * inv}
                style={{ transition: "fill .25s ease, stroke .25s ease", cursor: "pointer" }}
                onMouseEnter={() => setHoverCountry(nm)} onMouseLeave={() => setHoverCountry(null)}
                onClick={() => { if (!drag.current?.moved) onSelectCountry?.(nm); }} />
            );
          })}
        </g>

        {/* rotte */}
        {routes.map((r, i) => (
          <path key={i} d={r.d} fill="none" stroke={r.col} strokeWidth={0.9 * inv} strokeDasharray={`${2.5 * inv} ${3 * inv}`} opacity=".45">
            <animate attributeName="stroke-dashoffset" values={`${11 * inv};0`} dur="1.6s" repeatCount="indefinite" />
          </path>
        ))}

        {/* wishlist */}
        {wishPins.map((w) => (
          <g key={"w" + w.id} transform={`translate(${w.x} ${w.y}) scale(${inv})`} style={{ pointerEvents: "none" }}>
            <path d={PIN_PATH} fill="none" stroke="#FCD34D" strokeWidth="1.5" strokeDasharray="2.5 2" opacity=".9" />
          </g>
        ))}

        {/* pin viaggi: segnaposto a goccia colorati per continente */}
        {clusters.map((c, i) => {
          const many = c.trips.length > 1;
          const t0 = c.trips[0];
          const reg = countryRegion(t0.paese);
          const col = CONTINENT_COLORS[reg] || "#8B9DF9";
          const hovered = hoverPin === i;
          const active = !many && selectedTripId === t0.id;
          return (
            <g key={i} transform={`translate(${c.x} ${c.y}) scale(${inv})`} style={{ cursor: "pointer" }}
              onMouseEnter={() => setHoverPin(i)} onMouseLeave={() => setHoverPin(null)}
              onClick={(e) => { e.stopPropagation(); if (drag.current?.moved) return; if (many) zoomTo(t0.lat, t0.lon, Math.min(9, view.k * 2.4)); else onSelectTrip?.(t0); }}>
              <ellipse cy="1.5" rx={hovered ? 5 : 3.5} ry="1.5" fill="#000" opacity=".35" style={{ transition: "rx .25s" }} />
              {(active || hovered) && <circle cy="-11" r="12" fill={col} opacity=".16"><animate attributeName="r" values="9;15;9" dur="2.6s" repeatCount="indefinite" /></circle>}
              <g filter="url(#pinGlow)" style={{ transition: "transform .28s cubic-bezier(.22,1,.36,1)", transform: hovered || active ? "translateY(-3px) scale(1.16)" : "none" }}>
                <path d={PIN_PATH} fill={col} stroke="rgba(255,255,255,.85)" strokeWidth=".7" />
                <circle cy="-11.5" r="4.4" fill="rgba(10,13,20,.9)" />
                <text y="-9.8" textAnchor="middle" fontSize={many ? "6" : "5.2"} fill={many ? col : "#fff"} fontWeight="700" style={{ userSelect: "none" }}>{many ? c.trips.length : t0.icona || "✈"}</text>
              </g>
            </g>
          );
        })}
      </svg>

      {/* legenda / filtri continenti */}
      {showLegend && (
        <div className="absolute top-3 left-1/2 -translate-x-1/2 flex flex-wrap justify-center gap-1.5 px-2 max-w-[92%]">
          {CONTINENTS.map((c) => {
            const on = !filtro.length || filtro.includes(c);
            return (
              <button key={c} onClick={() => toggleCont(c)} className={`flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] border transition-all ${on ? "text-white border-white/15" : "text-slate-500 border-white/5 opacity-50"}`} style={{ background: on ? "rgba(14,17,26,.85)" : "rgba(14,17,26,.5)", backdropFilter: "blur(10px)" }}>
                <span className="w-2 h-2 rounded-full" style={{ background: CONTINENT_COLORS[c] }} />{c}
              </button>
            );
          })}
        </div>
      )}

      {hoverCountry && (
        <div className="absolute top-3 left-3 px-3 py-1.5 rounded-xl text-xs pointer-events-none border border-white/10" style={{ background: "rgba(14,17,26,.92)", backdropFilter: "blur(12px)", animation: "fadeIn .15s both" }}>
          <span className="mr-1.5">{countryFlag(hoverCountry)}</span>
          <span className="text-white">{countryLabel(hoverCountry)}</span>
          {visited[hoverCountry] && <span className="ml-2" style={{ color: CONTINENT_COLORS[countryRegion(hoverCountry)] }}>{visited[hoverCountry]} {visited[hoverCountry] === 1 ? "viaggio" : "viaggi"}</span>}
        </div>
      )}

      <div className="absolute top-3 right-3 flex flex-col gap-1.5">
        {[["+", () => setView((v) => clampView({ ...v, k: v.k * 1.4 }))], ["−", () => setView((v) => clampView({ ...v, k: v.k / 1.4 }))], ["⤢", reset]].map(([l, fn]) => (
          <button key={l} onClick={fn} className="w-8 h-8 rounded-lg text-sm text-slate-300 border border-white/10 hover:bg-white/15 hover:text-white transition-all" style={{ background: "rgba(14,17,26,.85)", backdropFilter: "blur(12px)" }}>{l}</button>
        ))}
      </div>
      {!compact && (
        <div className="absolute bottom-3 left-3 text-[10px] text-slate-500 pointer-events-none flex gap-3">
          <span>{visibili.length} {visibili.length === 1 ? "viaggio" : "viaggi"}</span>
          {wishPins.length > 0 && <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full border border-amber-300" />da visitare</span>}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   VIAGGI — pages + hooks + utility
   ============================================================ */
const HOME_BASE = [45.32, 8.86]; // Vigevano: origine per la stima delle distanze
const dayCount = (a, b) => { if (!a || !b) return 0; const d = Math.round((new Date(b + "T12:00") - new Date(a + "T12:00")) / 86400000) + 1; return d > 0 ? d : 0; };
const tripStatus = (t) => { const o = todayISO(); return t.partenza > o ? "futuro" : t.ritorno < o ? "passato" : "corso"; };
const daysTo = (d) => Math.ceil((new Date(d + "T00:00") - new Date(todayISO() + "T00:00")) / 86400000);

/** hook: tutte le statistiche derivate dai viaggi */
function useTripStats(trips, expenses) {
  return useMemo(() => {
    const speseByTrip = {};
    expenses.forEach((e) => { speseByTrip[e.tripId] = (speseByTrip[e.tripId] || 0) + e.importo; });
    const paesi = new Set(), citta = new Set(), continenti = new Set();
    let giorni = 0, km = 0;
    const perPaese = {}, perAnno = {}, perMese = {};
    trips.forEach((t) => {
      if (t.paese) { paesi.add(t.paese); const r = countryRegion(t.paese); if (r) continenti.add(r); }
      if (t.citta) citta.add(t.citta + "·" + t.paese);
      giorni += dayCount(t.partenza, t.ritorno);
      if (t.lat || t.lon) km += haversine(HOME_BASE, [t.lat, t.lon]) * 2;
      if (t.paese) { const p = perPaese[t.paese] || (perPaese[t.paese] = { n: 0, spesa: 0, ultima: "", citta: new Set() }); p.n++; p.spesa += speseByTrip[t.id] || 0; if (t.partenza > p.ultima) p.ultima = t.partenza; if (t.citta) p.citta.add(t.citta); }
      if (t.partenza) { const y = t.partenza.slice(0, 4), m = +t.partenza.slice(5, 7) - 1; perAnno[y] = (perAnno[y] || 0) + 1; perMese[m] = (perMese[m] || 0) + 1; }
    });
    const spesaTot = Object.values(speseByTrip).reduce((s, v) => s + v, 0);
    const top = (o) => Object.entries(o).sort((a, b) => (b[1].n ?? b[1]) - (a[1].n ?? a[1]))[0];
    const cittaCount = {};
    trips.forEach((t) => { if (t.citta) cittaCount[t.citta] = (cittaCount[t.citta] || 0) + 1; });
    const nVoli = expenses.filter((e) => e.categoria === "volo").length;
    const nHotel = expenses.filter((e) => e.categoria === "hotel").length;
    return {
      speseByTrip, spesaTot, paesi: paesi.size, citta: citta.size, continenti: continenti.size,
      giorni, km, perPaese, nViaggi: trips.length,
      mediaViaggio: trips.length ? spesaTot / trips.length : 0,
      mediaGiorno: giorni ? spesaTot / giorni : 0,
      topPaese: top(perPaese), topCitta: Object.entries(cittaCount).sort((a, b) => b[1] - a[1])[0],
      topAnno: Object.entries(perAnno).sort((a, b) => b[1] - a[1])[0],
      topMese: Object.entries(perMese).sort((a, b) => b[1] - a[1])[0],
      nVoli, nHotel,
    };
  }, [trips, expenses]);
}

function ViaggiPage({ data, update, notify, setConfirmDlg, catById }) {
  const [tab, setTab] = useState("mappa");
  const [openTrip, setOpenTrip] = useState(null);
  const [editTrip, setEditTrip] = useState(null);
  const [country, setCountry] = useState(null);
  const [sel, setSel] = useState(null);          // viaggio selezionato nel pannello
  const [wishEdit, setWishEdit] = useState(null);

  const trips = data.trips || [];
  const expenses = data.tripExpenses || [];
  const wishlist = data.wishlist || [];
  const st = useTripStats(trips, expenses);
  const sorted = useMemo(() => [...trips].sort((a, b) => (b.partenza || "").localeCompare(a.partenza || "")), [trips]);
  const prossimo = useMemo(() => [...trips].filter((t) => tripStatus(t) !== "passato").sort((a, b) => a.partenza.localeCompare(b.partenza))[0], [trips]);
  const annoCorr = String(new Date().getFullYear());
  const quest = useMemo(() => {
    const tAnno = trips.filter((t) => (t.partenza || "").startsWith(annoCorr));
    const spesa = expenses.filter((e) => e.data.startsWith(annoCorr)).reduce((s, e) => s + e.importo, 0);
    return { viaggi: tAnno.length, paesi: new Set(tAnno.map((t) => t.paese)).size, spesa };
  }, [trips, expenses, annoCorr]);

  /* il pannello mostra: viaggio scelto → altrimenti il prossimo → altrimenti l'ultimo */
  const panelTrip = useMemo(() => (sel && trips.find((t) => t.id === sel)) || prossimo || sorted[0] || null, [sel, trips, prossimo, sorted]);

  const saveTrip = (t) => {
    update((d) => {
      if (!d.trips) d.trips = [];
      const i = d.trips.findIndex((x) => x.id === t.id);
      if (i >= 0) d.trips[i] = t; else d.trips.push({ ...t, id: t.id || uid() });
      return d;
    });
    setEditTrip(null);
    notify(trips.some((x) => x.id === t.id) ? "Viaggio aggiornato" : `"${t.nome}" aggiunto`);
  };
  const removeTrip = (t) => setConfirmDlg({
    msg: `Eliminare il viaggio "${t.nome}" e le sue ${expenses.filter((e) => e.tripId === t.id).length} spese?`,
    onOk: () => { update((d) => { d.trips = d.trips.filter((x) => x.id !== t.id); d.tripExpenses = (d.tripExpenses || []).filter((e) => e.tripId !== t.id); return d; }); setOpenTrip(null); setSel(null); notify("Viaggio eliminato"); },
  });

  const countryInfo = country ? st.perPaese[country] : null;

  return (
    <div className="max-w-6xl mx-auto">
      <header className="mb-5 flex items-end justify-between gap-3 flex-wrap" style={{ animation: "fadeUp .5s both" }}>
        <div>
          <p className="text-xs uppercase tracking-[0.2em] text-slate-500">Viaggi</p>
          <h1 className="font-display text-2xl md:text-3xl text-white mt-1">Il tuo diario del mondo 🌍</h1>
          <p className="text-sm text-slate-500 mt-1">Esplora i posti che hai visitato e tieni traccia delle tue avventure.</p>
        </div>
