/* ---- Riquadro cedolino: carica, trascina, sostituisci, elimina ---- */
function CedolinoBox({ payslipId, valore, onChange, notify, mese }) {
  const [suDrive, setSuDrive] = useState(driveService.collegato);
  const [drag, setDrag] = useState(false);
  const [caricando, setCaricando] = useState(false);
  const [errore, setErrore] = useState("");
  const [anteprima, setAnteprima] = useState(null);
  const [visore, setVisore] = useState(false);
  const inputRef = useRef(null);
  const [modoLink, setModoLink] = useState(valore?.tipo === "link");
  const [link, setLink] = useState(valore?.url || "");

  /* carica l'allegato salvato per mostrarne l'anteprima */
  useEffect(() => {
    let vivo = true;
    if (valore?.tipo === "file" && payslipId) {
      cedoliniStore.leggi(payslipId).then((d) => { if (vivo) setAnteprima(d); });
    } else setAnteprima(null);
    return () => { vivo = false; };
  }, [valore, payslipId]);

  const gestisciFile = async (file) => {
    if (!file) return;
    setErrore(""); setCaricando(true);
    try {
      if (suDrive && driveService.collegato) {
        const meseRif = mese || monthKey(new Date());
        const nomeFile = nomeFileDocumento({ tipo: "cedolini", mese: meseRif, originale: file.name });
        const doc = await driveService.carica(file, { categoria: docCat("cedolini").cartella, anno: meseRif.slice(0, 4), nomeFile });
        onChange({ tipo: "drive", ...doc, nome: doc.nomeFile });
        notify?.("Cedolino salvato su Google Drive");
      } else {
        const meta = await cedoliniStore.salva(payslipId, file);
        onChange(meta);
        notify?.("Cedolino allegato su questo dispositivo");
      }
    } catch (e) { setErrore(e.suggerimento ? `${e.message} ${e.suggerimento}` : e.message); }
    setCaricando(false);
  };

  const rimuovi = async () => {
    if (valore?.tipo === "drive" && valore.driveFileId) { try { await driveService.elimina(valore.driveFileId); } catch {} }
    await cedoliniStore.elimina(payslipId);
    onChange(null); setAnteprima(null); setLink("");
  };

  const vuoto = !valore;
  return (
    <div>
      <div className="flex items-center justify-between gap-2 mb-1.5 flex-wrap">
        <label className="text-xs uppercase tracking-wider text-slate-400">Cedolino</label>
        <div className="flex items-center gap-2">
          {driveService.collegato && !modoLink && (
            <button type="button" onClick={() => setSuDrive((v) => !v)} className={`text-[11px] px-2 py-0.5 rounded-full border transition-all ${suDrive ? "text-emerald-200 border-emerald-400/40 bg-emerald-400/10" : "text-slate-500 border-white/10"}`}>
              {suDrive ? "su Google Drive" : "su questo dispositivo"}
            </button>
          )}
          <button type="button" onClick={() => setModoLink((v) => !v)} className="text-[11px] text-indigo-300 hover:text-indigo-200 transition-colors">
            {modoLink ? "carica un file" : "usa un link"}
          </button>
        </div>
      </div>

      {modoLink ? (
        <div className="flex gap-2">
          <Input placeholder="https://drive.google.com/…" value={link} onChange={(e) => setLink(e.target.value)} />
          <BtnGhost onClick={() => { const u = link.trim(); if (u) { onChange({ tipo: "link", url: u, nome: "Cedolino" }); notify?.("Collegamento salvato"); } }}>Salva</BtnGhost>
        </div>
      ) : vuoto ? (
        <div
          onDragOver={(e) => { e.preventDefault(); setDrag(true); }}
          onDragLeave={() => setDrag(false)}
          onDrop={(e) => { e.preventDefault(); setDrag(false); gestisciFile(e.dataTransfer.files?.[0]); }}
          onClick={() => inputRef.current?.click()}
          className={`rounded-xl border border-dashed p-4 text-center cursor-pointer transition-all ${drag ? "border-indigo-400/70 bg-indigo-400/10" : "border-white/15 hover:border-white/30 hover:bg-white/[0.03]"}`}
        >
          {caricando ? (
            <span className="flex items-center justify-center gap-2 text-xs text-slate-400"><Spinner size={14} />Carico il file…</span>
          ) : (
            <>
              <p className="text-sm text-slate-300">Trascina qui il cedolino</p>
              <p className="text-[11px] text-slate-500 mt-0.5">PDF o immagine · oppure tocca per sceglierlo</p>
            </>
          )}
        </div>
      ) : (
        <div className="rounded-xl bg-white/[0.04] border border-white/[0.08] p-3 flex items-center gap-3">
          <span className="w-11 h-11 rounded-lg grid place-items-center text-lg shrink-0 overflow-hidden bg-white/5 border border-white/10">
            {anteprima?.mime?.startsWith("image/") ? <img src={cedoliniStore.dataUrl(anteprima)} alt="" className="w-full h-full object-cover" /> : valore.tipo === "drive" ? "☁️" : valore.tipo === "link" ? "🔗" : "📄"}
          </span>
          <div className="min-w-0 flex-1">
            <p className="text-sm text-white truncate">{valore.nome || "Cedolino"}</p>
            <p className="text-[11px] text-slate-500">
              {valore.tipo === "drive" ? `Google Drive${valore.dataCaricamento ? " · " + fmtDate(valore.dataCaricamento) : ""}${valore.dimensione ? " · " + (valore.dimensione / 1024).toFixed(0) + " KB" : ""}`
                : valore.tipo === "link" ? "collegamento esterno"
                : anteprima ? `${(anteprima.dimensione / 1024).toFixed(0)} KB · solo su questo dispositivo` : "in caricamento…"}
            </p>
          </div>
          <div className="flex gap-1.5 shrink-0">
            <button type="button" onClick={() => setVisore(true)} className="px-2.5 py-1.5 rounded-lg bg-white/5 border border-white/10 text-[11px] text-slate-200 hover:bg-white/10 transition-all">Apri</button>
            <button type="button" onClick={() => inputRef.current?.click()} className="px-2.5 py-1.5 rounded-lg bg-white/5 border border-white/10 text-[11px] text-slate-300 hover:bg-white/10 transition-all">Sostituisci</button>
            <button type="button" onClick={rimuovi} className="px-2 py-1.5 rounded-lg text-[11px] text-slate-500 hover:text-rose-300 transition-all">✕</button>
          </div>
        </div>
      )}
      <input ref={inputRef} type="file" accept="application/pdf,image/*" className="hidden" onChange={(e) => { gestisciFile(e.target.files?.[0]); e.target.value = ""; }} />
      {errore && <p className="text-[11px] text-amber-300 mt-1.5">{errore}</p>}
      {!modoLink && vuoto && (
        <p className="text-[11px] text-slate-500 mt-1.5">
          {suDrive && driveService.collegato
            ? "Il file viene salvato nel tuo Google Drive, in Finance Manager › Documenti › Cedolini. Nel foglio finisce solo il riferimento."
            : "Il file resta su questo dispositivo. Collega Google Drive in Impostazioni per ritrovarlo anche da telefono."}
        </p>
      )}
      {visore && <VisoreCedolino valore={valore} dati={anteprima} onClose={() => setVisore(false)} />}
    </div>
  );
}

/* ---- Visualizzatore a schermo intero con zoom e download ---- */
function VisoreCedolino({ valore, dati, onClose }) {
  const [zoom, setZoom] = useState(1);
  const [pos, setPos] = useState({ x: 0, y: 0 });
  const [daDrive, setDaDrive] = useState(null);
  const [erroreDrive, setErroreDrive] = useState("");
  const drag = useRef(null);
  /* i file su Drive vengono scaricati con il token: nessun link pubblico */
  useEffect(() => {
    let vivo = true;
    if (valore?.tipo === "drive" && valore.driveFileId) {
      driveService.contenuto(valore.driveFileId)
        .then((u) => vivo && setDaDrive(u))
        .catch((e) => vivo && setErroreDrive(e.suggerimento || e.message));
    }
    return () => { vivo = false; };
  }, [valore]);
  const isImg = dati?.mime?.startsWith("image/") || /\.(png|jpe?g|webp|gif)$/i.test(valore?.nome || "");
  const src = valore?.tipo === "drive" ? daDrive : valore?.tipo === "link" ? valore.url : dati ? cedoliniStore.dataUrl(dati) : null;

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = prev; };
  }, [onClose]);

  const scarica = () => {
    if (!src) return;
    const a = document.createElement("a");
    a.href = src; a.download = valore.nome || "cedolino";
    a.target = valore.tipo === "link" ? "_blank" : "";
    a.rel = "noreferrer"; a.click();
  };

  return createPortal(
    <div className="fixed inset-0 z-[118] flex flex-col" style={{ background: "rgba(6,8,13,.97)", animation: "fadeIn .2s both" }}>
      {/* barra superiore: la safe area evita che finisca sotto la tacca dell'iPhone */}
      <div className="flex items-center justify-between gap-3 px-4 py-3 border-b border-white/10 shrink-0"
        style={{ paddingTop: "calc(env(safe-area-inset-top, 0px) + 0.75rem)" }}>
        <p className="text-sm text-white truncate min-w-0">{valore?.nome || "Cedolino"}</p>
        <div className="flex items-center gap-1.5 shrink-0">
          {isImg && (
            <div className="hidden sm:flex items-center gap-1.5">
              <button onClick={() => setZoom((z) => Math.max(0.5, z - 0.25))} className="w-9 h-9 rounded-lg bg-white/5 border border-white/10 text-slate-300 hover:bg-white/10 transition-all">−</button>
              <span className="text-[11px] text-slate-400 w-12 text-center tabular-nums">{Math.round(zoom * 100)}%</span>
              <button onClick={() => setZoom((z) => Math.min(5, z + 0.25))} className="w-9 h-9 rounded-lg bg-white/5 border border-white/10 text-slate-300 hover:bg-white/10 transition-all">+</button>
              <button onClick={() => { setZoom(1); setPos({ x: 0, y: 0 }); }} className="px-2.5 h-9 rounded-lg bg-white/5 border border-white/10 text-[11px] text-slate-300 hover:bg-white/10 transition-all">Adatta</button>
            </div>
          )}
          <button onClick={scarica} className="hidden sm:block px-3 h-9 rounded-lg bg-white/5 border border-white/10 text-[11px] text-slate-200 hover:bg-white/10 transition-all">Scarica</button>
          <button onClick={onClose} aria-label="Chiudi" className="w-11 h-11 sm:w-9 sm:h-9 rounded-full bg-white/10 border border-white/15 text-slate-200 hover:bg-white/20 active:scale-95 transition-all text-lg">✕</button>
        </div>
      </div>
      <div className="flex-1 min-h-0 overflow-hidden grid place-items-center p-3"
        onWheel={(e) => { if (isImg) { e.preventDefault(); setZoom((z) => Math.max(0.5, Math.min(5, z * (e.deltaY < 0 ? 1.12 : 1 / 1.12)))); } }}
        onMouseDown={(e) => { if (isImg && zoom > 1) drag.current = { x: e.clientX - pos.x, y: e.clientY - pos.y }; }}
        onMouseMove={(e) => { if (drag.current) setPos({ x: e.clientX - drag.current.x, y: e.clientY - drag.current.y }); }}
        onMouseUp={() => (drag.current = null)} onMouseLeave={() => (drag.current = null)}>
        {!src ? (
          <div className="text-center">
            {erroreDrive ? <p className="text-sm text-amber-300">{erroreDrive}</p>
              : valore?.tipo === "drive" ? <span className="flex items-center gap-2 text-sm text-slate-400"><Spinner size={16} />Scarico da Google Drive…</span>
              : <p className="text-sm text-slate-500">Allegato non disponibile.</p>}
          </div>
        ) : isImg ? (
          <img src={src} alt="Cedolino" draggable={false}
            style={{ transform: `translate(${pos.x}px, ${pos.y}px) scale(${zoom})`, cursor: zoom > 1 ? "grab" : "default", transition: drag.current ? "none" : "transform .18s ease" }}
            className="max-w-full max-h-full object-contain select-none rounded-lg" />
        ) : (
          <iframe title="Cedolino" src={src} className="w-full h-full rounded-lg bg-white/5 border border-white/10" />
        )}
      </div>
      {/* su telefono i comandi stanno in basso: in alto sarebbero fuori portata */}
      <div className="sm:hidden shrink-0 border-t border-white/10 px-3 pt-2.5 flex items-center gap-2"
        style={{ paddingBottom: "calc(env(safe-area-inset-bottom, 0px) + 0.625rem)" }}>
        {isImg && (
          <>
            <button onClick={() => setZoom((z) => Math.max(0.5, z - 0.25))} className="w-12 h-11 rounded-xl bg-white/5 border border-white/10 text-slate-200 text-lg active:scale-95 transition-all">−</button>
            <span className="text-[11px] text-slate-400 w-12 text-center tabular-nums">{Math.round(zoom * 100)}%</span>
            <button onClick={() => setZoom((z) => Math.min(5, z + 0.25))} className="w-12 h-11 rounded-xl bg-white/5 border border-white/10 text-slate-200 text-lg active:scale-95 transition-all">+</button>
          </>
        )}
        <button onClick={scarica} className="flex-1 h-11 rounded-xl bg-white/5 border border-white/10 text-sm text-slate-200 active:scale-95 transition-all">Scarica</button>
        <button onClick={onClose} className="flex-1 h-11 rounded-xl bg-gradient-to-r from-indigo-400 to-violet-400 text-slate-950 text-sm font-semibold active:scale-95 transition-all">Chiudi</button>
      </div>
      <p className="hidden sm:block text-[11px] text-slate-600 text-center py-2 shrink-0">{isImg ? "Rotella per zoomare, trascina per spostare" : "Se il PDF non compare, usa Scarica per aprirlo"}</p>
    </div>,
    document.body
  );
}

/* ============================================================
   ARCHIVIO — documenti personali su Google Drive
   I file risiedono soltanto nel Drive dell'utente; qui restano
   i riferimenti. Aggiungere una categoria = una riga in DOC_CATEGORIE.
   ============================================================ */
function ArchivioPage({ data, update, notify, setConfirmDlg }) {
  const documenti = data.documenti || [];
  /* i cedolini allegati alle buste paga fanno parte dell'archivio a tutti gli effetti */
  const daBustePaga = useMemo(() => (data.payslips || [])
    .filter((p) => p.cedolino?.driveFileId)
    .map((p) => ({
      id: "busta:" + p.id, tipo: "cedolini", titolo: `Cedolino ${labelMk(p.mese)}`, nomeFile: p.cedolino.nome,
      driveFileId: p.cedolino.driveFileId, cartella: "Cedolini", anno: p.mese.slice(0, 4), mese: p.mese,
      dataCaricamento: p.cedolino.dataCaricamento || "", dimensione: p.cedolino.dimensione || 0,
      mime: p.cedolino.mime || "application/pdf", daBusta: true,
    })), [data.payslips]);

  const [categoria, setCategoria] = useState(null);      // null = panoramica
  const [anno, setAnno] = useState(new Date().getFullYear());
  const [cerca, setCerca] = useState("");
  const [aperto, setAperto] = useState(null);
  const [caricando, setCaricando] = useState(null);      // { nome, stato }
  const [verifiche, setVerifiche] = useState({});
  const [drag, setDrag] = useState(false);
  const inputRef = useRef(null);
  const sostituisciRef = useRef(null);
  const [daSostituire, setDaSostituire] = useState(null);

  const collegato = driveService.collegato;
  const perCategoria = useMemo(() => {
    const m = {};
    DOC_CATEGORIE.forEach((c) => (m[c.id] = []));
    const idNoti = new Set();
    [...documenti, ...daBustePaga].forEach((d) => {
      if (idNoti.has(d.driveFileId)) return;
      idNoti.add(d.driveFileId);
      (m[d.tipo] = m[d.tipo] || []).push(d);
    });
    return m;
  }, [documenti, daBustePaga]);

  const elenco = useMemo(() => {
    const idNoti = new Set(documenti.map((d) => d.driveFileId));
    const tutti = [...documenti, ...daBustePaga.filter((d) => !idNoti.has(d.driveFileId))];
    let l = categoria ? tutti.filter((d) => d.tipo === categoria) : tutti;
    if (categoria && docCat(categoria).perAnno) l = l.filter((d) => !d.anno || String(d.anno) === String(anno));
    const q = cerca.trim().toLowerCase();
    if (q) l = l.filter((d) => `${d.titolo} ${d.nomeFile} ${d.note}`.toLowerCase().includes(q));
    return [...l].sort((a, b) => (b.dataCaricamento || "").localeCompare(a.dataCaricamento || ""));
  }, [categoria, documenti, daBustePaga, anno, cerca]);

  /* --- caricamento su Drive --- */
  const carica = async (file, tipo) => {
    if (!file) return;
    if (!collegato) { notify("Collega Google Drive in Impostazioni per archiviare i documenti"); return; }
    const cat = docCat(tipo);
    setCaricando({ nome: file.name, stato: "invio" });
    try {
      const meseRif = cat.id === "cedolini" ? mkOf(anno, new Date().getMonth()) : null;
      const nomeFile = nomeFileDocumento({ tipo: cat.id, mese: meseRif, anno: cat.perAnno ? anno : null, originale: file.name });
      const doc = await driveService.carica(file, { categoria: cat.cartella, anno: cat.perAnno ? anno : null, nomeFile });
      update((d) => {
        if (!d.documenti) d.documenti = [];
        d.documenti.push({
          id: uid(), tipo: cat.id, titolo: file.name.replace(/\.[a-z0-9]+$/i, ""), nomeFile: doc.nomeFile,
          driveFileId: doc.driveFileId, cartella: cat.cartella, anno: cat.perAnno ? String(anno) : "",
          mese: meseRif || "", dataCaricamento: doc.dataCaricamento, dimensione: doc.dimensione, mime: doc.mime, collegatoA: "", note: "",
        });
        return d;
      });
      setCaricando({ nome: file.name, stato: "ok" });
      notify(`"${doc.nomeFile}" archiviato su Drive`);
      setTimeout(() => setCaricando(null), 1800);
    } catch (e) {
      setCaricando({ nome: file.name, stato: "errore", messaggio: e.suggerimento || e.message });
    }
  };

  const sostituisci = async (doc, file) => {
    if (!file) return;
    setCaricando({ nome: file.name, stato: "invio" });
    try {
      const agg = await driveService.sostituisci(doc.driveFileId, file, doc.nomeFile);
      update((d) => {
        const x = d.documenti.find((y) => y.id === doc.id);
        if (x) Object.assign(x, { dimensione: agg.dimensione, mime: agg.mime, dataCaricamento: agg.dataCaricamento });
        return d;
      });
      setCaricando({ nome: file.name, stato: "ok" });
      notify("Documento sostituito, il riferimento resta lo stesso");
      setTimeout(() => setCaricando(null), 1800);
    } catch (e) { setCaricando({ nome: file.name, stato: "errore", messaggio: e.suggerimento || e.message }); }
  };

  const elimina = (doc) => setConfirmDlg({
    msg: `Eliminare "${doc.titolo || doc.nomeFile}"? Verrà rimosso anche dal tuo Google Drive.`,
    onOk: async () => {
      try { await driveService.elimina(doc.driveFileId); } catch { /* se non c'è più va bene lo stesso */ }
      update((d) => { d.documenti = d.documenti.filter((x) => x.id !== doc.id); return d; });
      notify("Documento eliminato");
    },
  });

  const scarica = async (doc) => {
    try {
      const url = await driveService.contenuto(doc.driveFileId);
      const a = document.createElement("a"); a.href = url; a.download = doc.nomeFile; a.click();
    } catch (e) { notify(e.suggerimento || "Impossibile scaricare il documento"); }
  };

  /* --- recupera i documenti già presenti su Drive (anche caricati da altri dispositivi) --- */
  const [recupero, setRecupero] = useState(null);
  const recuperaDaDrive = async () => {
    if (!collegato) { notify("Collega prima Google Drive"); return; }
    const categorie = categoria ? [docCat(categoria)] : DOC_CATEGORIE;
    setRecupero({ fase: "lettura", nuovi: 0 });
    let nuovi = 0;
    try {
      for (const cat of categorie) {
        setRecupero({ fase: "lettura", corrente: cat.nome, nuovi });
        const file = await driveService.scansiona(cat.cartella);
        if (!file.length) continue;
        update((d) => {
          if (!d.documenti) d.documenti = [];
          const noti = new Set(d.documenti.map((x) => x.driveFileId));
          /* i cedolini già collegati alle buste paga non vanno duplicati */
          (d.payslips || []).forEach((p) => p.cedolino?.driveFileId && noti.add(p.cedolino.driveFileId));
          file.forEach((f) => {
            if (noti.has(f.id)) return;
            const mese = meseDaNomeFile(f.name);
            d.documenti.push({
              id: uid(), tipo: cat.id, titolo: f.name.replace(/\.[a-z0-9]+$/i, ""), nomeFile: f.name,
              driveFileId: f.id, cartella: cat.cartella, anno: f.anno || (mese ? mese.slice(0, 4) : ""),
              mese: mese || "", dataCaricamento: (f.createdTime || "").slice(0, 10),
              dimensione: Number(f.size) || 0, mime: f.mimeType, collegatoA: "", note: "Recuperato da Drive",
            });
            nuovi++;
          });
          return d;
        });
      }
      setRecupero({ fase: "fatto", nuovi });
      notify(nuovi ? `${nuovi} documenti recuperati da Drive` : "Nessun documento nuovo su Drive");
      setTimeout(() => setRecupero(null), 2500);
    } catch (e) {
      setRecupero({ fase: "errore", messaggio: e.suggerimento || e.message });
    }
  };

  /* --- controllo dello stato su Drive --- */
  const verificaTutti = async () => {
    const out = {};
    for (const d of elenco.slice(0, 30)) out[d.id] = await driveService.verifica(d.driveFileId);
    setVerifiche(out);
    const problemi = Object.values(out).filter((v) => v.stato !== "ok").length;
    notify(problemi ? `${problemi} documenti non trovati su Drive` : "Tutti i documenti sono al loro posto");
  };

  const anni = useMemo(() => {
    const s = new Set(documenti.map((d) => d.anno).filter(Boolean));
    s.add(String(new Date().getFullYear()));
    return [...s].sort((a, b) => b.localeCompare(a));
  }, [documenti]);

  return (
    <div className="max-w-5xl mx-auto">
      <header className="mb-5 flex items-end justify-between gap-3 flex-wrap" style={{ animation: "fadeUp .5s both" }}>
        <div>
          <p className="text-xs uppercase tracking-[0.2em] text-slate-500">Archivio</p>
          <h1 className="font-display text-xl sm:text-2xl text-white mt-1">I tuoi documenti</h1>
          <p className="text-xs text-slate-500 mt-1">I file vivono nel tuo Google Drive, in Finance Manager › Documenti. Qui resta solo il riferimento.</p>
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          <span className={`text-[11px] px-2.5 py-1 rounded-full border ${collegato ? "text-emerald-200 border-emerald-400/30 bg-emerald-400/10" : "text-amber-200 border-amber-400/30 bg-amber-400/10"}`}>
            {collegato ? "☁️ Drive collegato" : "Drive non collegato"}
          </span>
          {collegato && <BtnGhost onClick={recuperaDaDrive} className="!py-1.5 !text-xs">⟳ Recupera da Drive</BtnGhost>}
          {collegato && documenti.length > 0 && <BtnGhost onClick={verificaTutti} className="!py-1.5 !text-xs">Verifica archivio</BtnGhost>}
        </div>
      </header>

      {!collegato && (
        <Card className="p-4 mb-4 border-amber-400/25" hover={false}>
          <p className="text-sm text-amber-200">Per archiviare i documenti serve il collegamento a Google Drive.</p>
          <p className="text-[11px] text-slate-400 mt-1">Vai in Impostazioni → Documenti su Google Drive. Ricorda che Google non consente l'accesso se apri l'app come file locale: serve un indirizzo https.</p>
        </Card>
      )}

      {recupero && (
        <Card className={`p-3.5 mb-4 ${recupero.fase === "errore" ? "border-rose-400/30" : ""}`} hover={false}>
          <div className="flex items-center gap-3">
            {recupero.fase === "lettura" ? <Spinner size={16} /> : <span>{recupero.fase === "fatto" ? "✅" : "⚠"}</span>}
            <p className="text-sm text-slate-200 flex-1 min-w-0">
              {recupero.fase === "lettura" ? `Leggo il tuo Drive${recupero.corrente ? ` · ${recupero.corrente}` : ""}…`
                : recupero.fase === "fatto" ? (recupero.nuovi ? `${recupero.nuovi} documenti aggiunti all'archivio` : "Archivio già allineato con Drive")
                : recupero.messaggio}
            </p>
            {recupero.fase !== "lettura" && <button onClick={() => setRecupero(null)} className="text-xs text-slate-500 hover:text-white transition-colors">Chiudi</button>}
          </div>
        </Card>
      )}

      {caricando && (
        <Card className={`p-3.5 mb-4 ${caricando.stato === "errore" ? "border-rose-400/30" : caricando.stato === "ok" ? "border-emerald-400/30" : ""}`} hover={false}>
          <div className="flex items-center gap-3">
            {caricando.stato === "invio" ? <Spinner size={16} /> : <span>{caricando.stato === "ok" ? "✅" : "⚠"}</span>}
            <div className="min-w-0 flex-1">
              <p className="text-sm text-white truncate">{caricando.nome}</p>
              <p className="text-[11px] text-slate-400">
                {caricando.stato === "invio" ? "Caricamento su Google Drive…" : caricando.stato === "ok" ? "Caricato correttamente" : caricando.messaggio}
              </p>
            </div>
            {caricando.stato !== "invio" && <button onClick={() => setCaricando(null)} className="text-xs text-slate-500 hover:text-white transition-colors">Chiudi</button>}
          </div>
        </Card>
      )}

      {/* panoramica delle categorie */}
      {!categoria ? (
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
          {DOC_CATEGORIE.map((c, i) => {
            const n = (perCategoria[c.id] || []).length;
            return (
              <button key={c.id} onClick={() => setCategoria(c.id)}
                className="glass rounded-2xl card-hover p-4 text-left group"
                style={{ animation: "fadeUp .5s both", animationDelay: `${i * 35}ms` }}>
                <span className="w-10 h-10 rounded-xl grid place-items-center text-lg mb-2" style={{ background: c.colore + "1f", border: `1px solid ${c.colore}33` }}>{c.icona}</span>
                <p className="text-sm text-white truncate">{c.nome}</p>
                <p className="text-[11px] text-slate-500">{n === 0 ? "nessun documento" : `${n} document${n === 1 ? "o" : "i"}`}</p>
              </button>
            );
          })}
        </div>
      ) : (
        <>
          <div className="flex items-center gap-2 mb-4 flex-wrap">
            <button onClick={() => setCategoria(null)} className="text-xs text-slate-400 hover:text-white transition-colors">‹ Tutte le categorie</button>
            <span className="text-slate-600">·</span>
            <span className="text-sm text-white">{docCat(categoria).icona} {docCat(categoria).nome}</span>
            <div className="flex-1" />
            {docCat(categoria).perAnno && (
              <Select value={anno} onChange={(e) => setAnno(Number(e.target.value))} className="!w-28">
                {anni.map((a) => <option key={a} value={a}>{a}</option>)}
              </Select>
            )}
            <Input placeholder="Cerca…" value={cerca} onChange={(e) => setCerca(e.target.value)} className="!w-36" />
            <BtnPrimary onClick={() => inputRef.current?.click()} disabled={!collegato}>+ Carica</BtnPrimary>
          </div>

          <div
            onDragOver={(e) => { e.preventDefault(); setDrag(true); }}
            onDragLeave={() => setDrag(false)}
            onDrop={(e) => { e.preventDefault(); setDrag(false); carica(e.dataTransfer.files?.[0], categoria); }}
            className={`rounded-2xl border border-dashed p-4 mb-4 text-center transition-all ${drag ? "border-indigo-400/70 bg-indigo-400/10" : "border-white/12"}`}>
            <p className="text-xs text-slate-400">Trascina qui un documento per archiviarlo in <b className="text-slate-300">{docCat(categoria).cartella}{docCat(categoria).perAnno ? ` › ${anno}` : ""}</b></p>
          </div>

          <div className="space-y-2">
            {elenco.map((d, i) => {
              const v = verifiche[d.id];
              return (

                        {v && <span className={v.stato === "ok" ? " text-emerald-300" : " text-amber-300"}> · {v.stato === "ok" ? "presente su Drive ✅" : v.stato === "cestinato" ? "nel cestino di Drive" : "non trovato su Drive"}</span>}
                      </p>
                    </div>
                    <div className="flex gap-1.5 shrink-0">
                      <button onClick={() => setAperto(d)} className="px-2.5 py-1.5 rounded-lg bg-white/5 border border-white/10 text-[11px] text-slate-200 hover:bg-white/10 transition-all">Apri</button>

                      {!d.daBusta && <button onClick={() => elimina(d)} title="Elimina" className="w-8 h-8 rounded-lg text-[11px] text-slate-500 hover:text-rose-300 hover:bg-rose-500/10 transition-all">🗑</button>}
                    </div>
                  </div>
                </Card>
              );
            })}
            {!elenco.length && (
              <Card className="p-6" hover={false}>
                <EmptyState text={collegato ? "Nessun documento in questa categoria. Trascinane uno qui sopra." : "Collega Google Drive per iniziare ad archiviare."} />
              </Card>
            )}
          </div>
        </>
      )}

      <input ref={inputRef} type="file" className="hidden" onChange={(e) => { carica(e.target.files?.[0], categoria); e.target.value = ""; }} />
      <input ref={sostituisciRef} type="file" className="hidden" onChange={(e) => { if (daSostituire) sostituisci(daSostituire, e.target.files?.[0]); setDaSostituire(null); e.target.value = ""; }} />
      {aperto && <VisoreCedolino valore={{ tipo: "drive", driveFileId: aperto.driveFileId, nome: aperto.nomeFile }} dati={null} onClose={() => setAperto(null)} />}
    </div>
  );
}

/* ---- Importazione: legge una cartella di Drive e abbina i PDF ai mesi ---- */
function ImportDriveModal({ anno, payslips, onClose, onImporta }) {
  const [passo, setPasso] = useState("cartella");   // cartella | risultati
  const [idCartella, setIdCartella] = useState("");
  const [file, setFile] = useState([]);
  const [caricando, setCaricando] = useState(false);
  const [errore, setErrore] = useState("");
  const [scelti, setScelti] = useState({});

  const analizza = async () => {
    setCaricando(true); setErrore("");
    try {
      const id = estraiIdCartella(idCartella);
      const elenco = await driveService.elenca(id);
      const documenti = elenco.filter((f) => !/folder/.test(f.mimeType));
      const abbinati = documenti.map((f) => ({ file: f, mese: meseDaNomeFile(f.name) }));
      setFile(abbinati);
      setScelti(Object.fromEntries(abbinati.filter((a) => a.mese).map((a) => [a.file.id, a.mese])));
      setPasso("risultati");
    } catch (e) { setErrore(e.suggerimento ? `${e.message} ${e.suggerimento}` : e.message); }
    setCaricando(false);
  };

  const conferma = () => {
    const abbinamenti = Object.entries(scelti).filter(([, m]) => m).map(([fileId, mese]) => ({ mese, file: file.find((x) => x.file.id === fileId).file }));
    if (abbinamenti.length) onImporta(abbinamenti);
    onClose();
  };

  const conCedolino = new Set(payslips.filter((p) => p.cedolino).map((p) => p.mese));

  return (
    <Modal open onClose={onClose} title="Importa cedolini da Google Drive" wide>
      {passo === "cartella" ? (
        <div className="space-y-3">
          <p className="text-xs text-slate-400">Incolla il collegamento della cartella di Drive che contiene i cedolini. L'app riconosce il mese dal nome del file, per esempio <code className="text-indigo-300">Cedolino_Luglio_2026.pdf</code> o <code className="text-indigo-300">BustaPaga_07_2026.pdf</code>.</p>
          <div><Label>Cartella di Drive</Label><Input placeholder="https://drive.google.com/drive/folders/… oppure l'identificativo" value={idCartella} onChange={(e) => setIdCartella(e.target.value)} autoFocus /></div>
          {!driveService.letturaEsterna && (
            <p className="text-[11px] text-amber-300/80">Per leggere una cartella che non ha creato l'app, attiva "lettura di cartelle esistenti" in Impostazioni e ricollega l'account.</p>
          )}
          {errore && <div className="rounded-xl border border-amber-400/25 bg-amber-500/[0.07] p-3 text-xs text-amber-200">{errore}</div>}
        </div>
      ) : (
        <div className="space-y-2">
          <p className="text-xs text-slate-400">{file.filter((f) => f.mese).length} documenti riconosciuti su {file.length} trovati. Controlla gli abbinamenti prima di confermare.</p>
          <div className="max-h-72 overflow-y-auto space-y-1.5 pr-1">
            {file.map(({ file: f, mese }) => {
              const scelto = scelti[f.id] || "";
              const sovrascrive = scelto && conCedolino.has(scelto);
              return (
                <div key={f.id} className="flex items-center gap-2 p-2.5 rounded-xl bg-white/[0.04] border border-white/[0.07]">
                  <span className="text-base shrink-0">📄</span>
                  <div className="min-w-0 flex-1">
                    <p className="text-sm text-white truncate">{f.name}</p>
                    <p className="text-[11px] text-slate-500">{f.size ? `${(f.size / 1024).toFixed(0)} KB` : ""}{sovrascrive ? " · sostituirà quello già presente" : ""}</p>
                  </div>
                  <Select value={scelto} onChange={(e) => setScelti((s) => ({ ...s, [f.id]: e.target.value }))} className="!w-36 shrink-0">
                    <option value="">non importare</option>
                    {Array.from({ length: 12 }, (_, m) => mkOf(anno, m)).map((mk) => <option key={mk} value={mk}>{labelMk(mk)}</option>)}
                    {mese && !mese.startsWith(String(anno)) && <option value={mese}>{labelMk(mese)}</option>}
                  </Select>
                </div>
              );
            })}
            {!file.length && <EmptyState text="Nessun documento nella cartella." />}
          </div>
        </div>
      )}
      <div className="modal-actions flex justify-end gap-3 mt-5">
        <BtnGhost onClick={onClose}>Annulla</BtnGhost>
        {passo === "cartella"
          ? <BtnPrimary onClick={analizza} disabled={caricando || !idCartella.trim()}>{caricando ? <span className="flex items-center gap-2"><Spinner />Leggo…</span> : "Analizza cartella"}</BtnPrimary>
          : <BtnPrimary onClick={conferma}>Collega {Object.values(scelti).filter(Boolean).length} cedolini</BtnPrimary>}
      </div>
    </Modal>
  );
}

/** accetta sia il collegamento completo sia il solo identificativo */
function estraiIdCartella(v) {
  const s = (v || "").trim();
  const m = s.match(/folders\/([A-Za-z0-9_-]+)/) || s.match(/[?&]id=([A-Za-z0-9_-]+)/);
  return m ? m[1] : s;
}

class MarketError extends Error {
  constructor(tipo, messaggio, { suggerimento = "" } = {}) { super(messaggio); this.tipo = tipo; this.suggerimento = suggerimento; }
}

const fetchConTimeout = async (url, ms = 9000, opts = {}) => {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { ...opts, signal: ctrl.signal });
    if (r.status === 429) throw new MarketError("limite", "Troppe richieste al provider.", { suggerimento: "Attendi qualche minuto o inserisci una chiave personale." });
    if (r.status === 401 || r.status === 403) throw new MarketError("chiave", "Chiave non valida o accesso negato.", { suggerimento: "Controlla la chiave nelle impostazioni." });
    if (r.status === 404) throw new MarketError("nonTrovato", "Simbolo non trovato su questo provider.");
    if (!r.ok) throw new MarketError("rete", `Risposta del server: ${r.status}.`);
    return r;
  } catch (e) {
    if (e instanceof MarketError) throw e;
    if (e.name === "AbortError") throw new MarketError("timeout", "Il provider non ha risposto in tempo.");
    throw new MarketError("rete", "Provider non raggiungibile dal browser.", { suggerimento: "Molte API finanziarie bloccano le chiamate dirette dal browser (CORS)." });
  } finally { clearTimeout(t); }
};

/** Interfaccia comune a tutti i provider. */
class MarketDataProvider {
  get id() { return "abstract"; } get nome() { return "—"; } get richiedeChiave() { return false; }
  supporta() { return false; }
  async quote() { throw new MarketError("rete", "non implementato"); }
  async history() { return null; }
}

/** Crypto: nessuna chiave, CORS aperto — funziona sempre. */
class CoinGeckoProvider extends MarketDataProvider {
  get id() { return "coingecko"; } get nome() { return "CoinGecko"; }
  supporta(a) { return a.tipo === "Crypto" || !!catalogoDi(a)?.cg; }
  async quote(a) {
    const id = catalogoDi(a)?.cg || a.ticker.toLowerCase();
    const val = (a.valuta || "EUR").toLowerCase();
    const r = await fetchConTimeout(`https://api.coingecko.com/api/v3/simple/price?ids=${id}&vs_currencies=${val}&include_24hr_change=true`);
    const j = await r.json();
    const d = j[id];
    if (!d) throw new MarketError("nonTrovato", "Criptovaluta non trovata.");
    return { prezzo: d[val], variazione: d[`${val}_24h_change`] ?? null, valuta: (a.valuta || "EUR"), fonte: this.nome };
  }
  async history(a, giorni = 180) {
    const id = catalogoDi(a)?.cg || a.ticker.toLowerCase();
    const r = await fetchConTimeout(`https://api.coingecko.com/api/v3/coins/${id}/market_chart?vs_currency=${(a.valuta || "eur").toLowerCase()}&days=${giorni}`);
    const j = await r.json();
    return (j.prices || []).map(([ts, p]) => ({ data: new Date(ts).toISOString().slice(0, 10), prezzo: p }));
  }
}

/** Twelve Data: chiave gratuita, CORS aperto. Il piano free copre soprattutto i mercati USA. */
class TwelveDataProvider extends MarketDataProvider {
  constructor(key) { super(); this.key = key; }
  get id() { return "twelvedata"; } get nome() { return "Twelve Data"; } get richiedeChiave() { return true; }
  supporta(a) { return !!this.key && a.tipo !== "Crypto"; }
  async quote(a) {
    const sym = simboloPer(a, "y") || a.ticker;
    const r = await fetchConTimeout(`https://api.twelvedata.com/quote?symbol=${encodeURIComponent(sym)}&apikey=${this.key}`);
    const j = await r.json();
    if (j.status === "error" || j.code) {
      if (/limit/i.test(j.message || "")) throw new MarketError("limite", "Limite giornaliero del provider raggiunto.");
      throw new MarketError("nonTrovato", j.message || "Simbolo non disponibile nel piano in uso.", { suggerimento: "Il piano gratuito copre soprattutto i mercati USA." });
    }
    const p = Number(j.close ?? j.price);
    if (!p) throw new MarketError("vuoto", "Risposta senza prezzo.");
    return { prezzo: p, variazione: Number(j.percent_change) || null, valuta: j.currency || a.valuta, fonte: this.nome };
  }
  async history(a, giorni = 180) {
    const sym = simboloPer(a, "y") || a.ticker;
    const r = await fetchConTimeout(`https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(sym)}&interval=1day&outputsize=${Math.min(giorni, 500)}&apikey=${this.key}`);
    const j = await r.json();
    if (!j.values) return null;
    return j.values.map((v) => ({ data: v.datetime, prezzo: Number(v.close) })).reverse();
  }
}

/** Yahoo e Stooq non inviano CORS: raggiungibili solo tramite un ponte pubblico,
    che l'utente attiva consapevolmente dalle impostazioni. */
class YahooProvider extends MarketDataProvider {
  constructor(proxy) { super(); this.proxy = proxy; }
  get id() { return "yahoo"; } get nome() { return "Yahoo Finance"; }
  supporta(a) { return !!this.proxy && a.tipo !== "Crypto"; }
  _url(u) { return viaPonte(this.proxy, u); }
  /* una sola richiesta porta a casa prezzo, variazione e serie storica:
     è il modo più efficace per non esaurire i limiti dei provider */
  async quote(a) {
    const sym = simboloPer(a, "y") || a.ticker;
    const r = await fetchConTimeout(this._url(`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?range=3mo&interval=1d`), 11000);
    const j = await r.json();
    const res = j?.chart?.result?.[0];
    if (!res) throw new MarketError("nonTrovato", "Simbolo non trovato su Yahoo.");
    const meta = res.meta || {};
    const p = meta.regularMarketPrice;
    if (!p) throw new MarketError("vuoto", "Risposta senza prezzo.");
    const prec = meta.chartPreviousClose || meta.previousClose;
    const chiusure = res.indicators?.quote?.[0]?.close || [];
    const storico = (res.timestamp || []).map((ts, i) => ({ data: new Date(ts * 1000).toISOString().slice(0, 10), prezzo: chiusure[i] })).filter((x) => x.prezzo != null);
    return { prezzo: p, variazione: prec ? ((p - prec) / prec) * 100 : null, valuta: meta.currency || a.valuta, fonte: this.nome, storico };
  }
  async history(a, giorni = 180) {
    const sym = simboloPer(a, "y") || a.ticker;
    const range = giorni <= 35 ? "1mo" : giorni <= 100 ? "3mo" : giorni <= 200 ? "6mo" : giorni <= 400 ? "1y" : "5y";
    const r = await fetchConTimeout(this._url(`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?range=${range}&interval=1d`), 12000);
    const j = await r.json();
    const res = j?.chart?.result?.[0];
    if (!res) return null;
    const chiusure = res.indicators?.quote?.[0]?.close || [];
    return (res.timestamp || []).map((ts, i) => ({ data: new Date(ts * 1000).toISOString().slice(0, 10), prezzo: chiusure[i] })).filter((x) => x.prezzo != null);
  }
}

class StooqProvider extends MarketDataProvider {
  constructor(proxy) { super(); this.proxy = proxy; }
  get id() { return "stooq"; } get nome() { return "Stooq"; }
  supporta(a) { return !!this.proxy && !!simboloPer(a, "s"); }
  async quote(a) {
    const sym = simboloPer(a, "s");
    const r = await fetchConTimeout(viaPonte(this.proxy, `https://stooq.com/q/l/?s=${sym}&f=sd2t2ohlcv&h&e=csv`));
    const testo = await r.text();
    const righe = testo.trim().split("\n");
    if (righe.length < 2) throw new MarketError("vuoto", "Nessun dato da Stooq.");
    const c = righe[1].split(",");
    const p = Number(c[6]);
    if (!p || Number.isNaN(p)) throw new MarketError("nonTrovato", "Simbolo non quotato su Stooq.");
    const apertura = Number(c[3]);
    return { prezzo: p, variazione: apertura ? ((p - apertura) / apertura) * 100 : null, valuta: a.valuta, fonte: this.nome };
  }
}

/** Compone l'indirizzo passando dal ponte, qualunque forma abbia il template:
    con {url}, con "?url=" finale, oppure un semplice prefisso. */
function viaPonte(proxy, url) {
  const p = (proxy || "").trim();
  if (!p) return url;
  if (p.includes("{url}")) return p.replace("{url}", encodeURIComponent(url));
  if (/[?&](url|u|q|target)=$/.test(p)) return p + encodeURIComponent(url);
  if (/[?&](url|u|q|target)=https?:\/\//.test(p)) {
    /* l'utente ha incollato anche un indirizzo di esempio: lo sostituiamo */
    return p.replace(/([?&](?:url|u|q|target)=).*$/, `$1${encodeURIComponent(url)}`);
  }
  if (p.endsWith("=")) return p + encodeURIComponent(url);
  if (p.endsWith("/")) return p + url;
  return p + (p.includes("?") ? "&url=" : "?url=") + encodeURIComponent(url);
}

const catalogoDi = (a) => ETF_CATALOG.find((e) => e.isin && a.isin && e.isin === a.isin && (!a.mercato || e.borsa === a.mercato)) || ETF_CATALOG.find((e) => e.t === (a.ticker || "").toUpperCase());
const simboloPer = (a, campo) => a[`sym_${campo}`] || catalogoDi(a)?.[campo] || null;

/** Servizio: prova i provider in ordine e restituisce il primo risultato utile. */
class MarketDataService {
  constructor() {
    this.cfg = { twelvedata: "", finnhub: "", alphavantage: "", proxy: "" };
    this.cache = new Map();
    this.sospesi = new Map();   // provider → istante fino al quale non va interrogato
  }
  configura(cfg) { this.cfg = { ...this.cfg, ...cfg }; this.sospesi.clear(); }
  /** un provider che ha appena rifiutato non va richiamato per ogni simbolo successivo */
  _sospendi(id, tipo) {
    const durata = tipo === "chiave" ? 60 * 60000 : tipo === "limite" ? 10 * 60000 : 60000;
    this.sospesi.set(id, Date.now() + durata);
  }
  _attivo(p) { const fino = this.sospesi.get(p.id); return !fino || Date.now() > fino; }
  get statoProvider() {
    return this.providers.map((p) => ({ id: p.id, nome: p.nome, sospesoFino: this.sospesi.get(p.id) || null }));
  }
  get providers() {
    return [
      new CoinGeckoProvider(),
      new TwelveDataProvider(this.cfg.twelvedata),
      new YahooProvider(this.cfg.proxy),
      new StooqProvider(this.cfg.proxy),
      new AlphaVantageProvider(this.cfg.alphavantage),
      new FinnhubProvider(this.cfg.finnhub),
    ];
  }
  /** @returns {Promise<{prezzo:number,variazione:number|null,fonte:string}>} */
  /** chiave di cache: lo stesso ISIN può essere quotato su più borse con prezzi diversi */
  _chiave(a) { return `q:${a.isin || ""}|${(a.ticker || "").toUpperCase()}|${a.mercato || ""}`; }
  async quote(asset, { forza = false } = {}) {
    const key = this._chiave(asset);
    const inCache = this.cache.get(key);
    if (!forza && inCache && Date.now() - inCache.ts < 15 * 60000) return inCache.val;
    const errori = [];
    let sospesiOra = 0;
    for (const p of this.providers) {
      if (!p.supporta(asset)) continue;
      if (!this._attivo(p)) { sospesiOra++; continue; }        // salta chi ha appena rifiutato
      try {
        const val = await p.quote(asset);
        if (val?.prezzo) { this.cache.set(key, { ts: Date.now(), val }); return val; }
      } catch (e) {
        errori.push(`${p.nome}: ${e.message}`);
        if (e.tipo === "limite" || e.tipo === "chiave") this._sospendi(p.id, e.tipo);
      }
    }
    const dettaglio = errori[0] || (sospesiOra ? "Tutti i provider disponibili sono momentaneamente in pausa per aver superato il limite." : "Aggiungi una chiave o inserisci il prezzo a mano.");
    throw new MarketError("nessunProvider", "Nessun provider ha risposto.", { suggerimento: dettaglio });
  }
  async history(asset, giorni = 180) {
    /* se la quotazione in cache porta già la serie, non serve un'altra richiesta */
    const inCache = this.cache.get(this._chiave(asset));
    if (inCache?.val?.storico?.length > 1) return inCache.val.storico;
    for (const p of this.providers) {
      if (!p.supporta(asset) || !this._attivo(p)) continue;
      try { const h = await p.history(asset, giorni); if (h?.length) return h; }
      catch (e) { if (e.tipo === "limite" || e.tipo === "chiave") this._sospendi(p.id, e.tipo); }
    }
    return null;
  }
  /** Ricerca: prima il catalogo locale (sempre disponibile), poi eventuali provider online. */
  cerca(q) {
    const s = (q || "").trim().toUpperCase();
    if (s.length < 2) return [];
    return ETF_CATALOG.filter((e) => e.t.includes(s) || e.isin.includes(s) || e.nome.toUpperCase().includes(s) || e.em.toUpperCase().includes(s)).slice(0, 8);
  }
}

const ASSET_TYPES = ["ETF", "Azione", "Obbligazione", "Fondo", "Crypto", "Altro"];
const AREE = ["Globale", "USA", "Europa", "Emergenti", "Asia", "Italia", "Altro"];
const SETTORI = ["Diversificato", "Tecnologia", "Finanza", "Salute", "Energia", "Industriale", "Consumi", "Immobiliare", "Altro"];
const PALETTE = ["#8B9DF9", "#5EEAD4", "#FBBF24", "#F472B6", "#A78BFA", "#38BDF8", "#86EFAC", "#FB7185", "#FDBA74", "#67E8F9"];
const pct = (v, d = 2) => `${v >= 0 ? "+" : ""}${(v ?? 0).toFixed(d)}%`;

/** posizioni, P/L e allocazione calcolati dalle operazioni */
function usePortfolio(assets, trades, quotes, snapshots) {
  return useMemo(() => {
    const posizioni = (assets || []).map((a) => {
      const ops = (trades || []).filter((t) => t.assetId === a.id).sort((x, y) => x.data.localeCompare(y.data));
      let qta = 0, costo = 0, realizzato = 0, dividendi = 0, commissioni = 0;
      ops.forEach((t) => {
        commissioni += t.commissioni || 0;
        if (t.tipo === "acquisto") { costo += t.quantita * t.prezzo + (t.commissioni || 0); qta += t.quantita; }
        else if (t.tipo === "vendita") {
          const medio = qta ? costo / qta : 0;
          realizzato += t.quantita * (t.prezzo - medio) - (t.commissioni || 0);
          costo -= medio * t.quantita; qta -= t.quantita;
        } else if (t.tipo === "dividendo") dividendi += t.quantita * t.prezzo;
      });
      const q = (quotes || {})[a.id];
      const prezzo = q?.prezzo || 0;
      const valore = qta * prezzo;
      const medio = qta ? costo / qta : 0;
      const pl = prezzo ? valore - costo : 0;
      return { ...a, ops, qta, costo, medio, prezzo, valore, pl, plPct: costo ? (pl / costo) * 100 : 0, realizzato, dividendi, commissioni, varGiorno: q?.varGiorno ?? null, aggiornato: q?.ts, senzaPrezzo: !prezzo && qta > 0 };
    });
    const aperte = posizioni.filter((p) => p.qta > 0.0000001);
    const investito = aperte.reduce((s, p) => s + p.costo, 0);
    const valore = aperte.reduce((s, p) => s + p.valore, 0);
    const pl = aperte.reduce((s, p) => s + p.pl, 0);
    const dividendi = posizioni.reduce((s, p) => s + p.dividendi, 0);
    const realizzato = posizioni.reduce((s, p) => s + p.realizzato, 0);
    const varGiorno = aperte.reduce((s, p) => s + (p.varGiorno != null ? (p.valore * p.varGiorno) / 100 : 0), 0);

    const raggruppa = (campo) => {
      const m = {};
      aperte.forEach((p) => { const k = p[campo] || "Altro"; m[k] = (m[k] || 0) + p.valore; });
      return Object.entries(m).sort((a, b) => b[1] - a[1]).map(([name, value], i) => ({ name, value: Math.round(value), fill: PALETTE[i % PALETTE.length] }));
    };

    const priceHistoryByAsset = {};
    (assets || []).forEach((a) => {
      const storico = (quotes || {})[a.id]?.storico || [];
      priceHistoryByAsset[a.id] = storico.slice().sort((x, y) => x.data.localeCompare(y.data)).reduce((map, entry) => {
        const mk = monthKey(entry.data);
        map[mk] = entry.prezzo;
        return map;
      }, {});
    });
    const snapshotByMonth = (snapshots || []).reduce((map, s) => { if (s?.mese) map[s.mese] = s; return map; }, {});

    /* capitale investito e valore di mercato nel tempo, mese per mese */
    const tutte = [...(trades || [])].sort((a, b) => a.data.localeCompare(b.data));
    const timeline = [];
    if (tutte.length) {
      let mk = monthKey(tutte[0].data);
      const fine = monthKey(new Date());
      let cum = 0, i = 0;
      const holdings = {};
      while (mk <= fine && timeline.length < 180) {
        while (i < tutte.length && monthKey(tutte[i].data) <= mk) {
          const t = tutte[i];
          if (!holdings[t.assetId]) holdings[t.assetId] = { qta: 0, costo: 0 };
          const assetState = holdings[t.assetId];
          if (t.tipo === "acquisto") {
            assetState.qta += t.quantita;
            assetState.costo += t.quantita * t.prezzo + (t.commissioni || 0);
            cum += t.quantita * t.prezzo + (t.commissioni || 0);
          } else if (t.tipo === "vendita") {
            const medio = assetState.qta ? assetState.costo / assetState.qta : 0;
            assetState.qta -= t.quantita;
            assetState.costo -= medio * t.quantita;
            cum -= t.quantita * t.prezzo;
          }
          i++;
        }
        let valoreMk = 0;
        Object.entries(holdings).forEach(([assetId, state]) => {
          if (state.qta <= 0) return;
          const prezzoMk = priceHistoryByAsset[assetId]?.[mk];
          if (prezzoMk != null) valoreMk += state.qta * prezzoMk;
        });
        const snapshot = snapshotByMonth[mk];
        if (snapshot?.valore != null) {
          valoreMk = snapshot.valore;
        } else if (valoreMk === 0 && aperte.length && monthKey(new Date()) === mk) {
          valoreMk = valore;
        }
        timeline.push({ mese: mk, label: labelMkShort(mk), Investito: Math.round(cum), Valore: valoreMk != null ? Math.round(valoreMk) : null });
        mk = addMonthsMk(mk, 1);
      }
    }
    const primo = tutte.find((t) => t.tipo === "acquisto");
    const anni = primo ? Math.max(0.08, (Date.now() - new Date(primo.data + "T12:00")) / 31557600000) : 0;
    const twr = investito ? (pl / investito) * 100 : 0;
    const annuo = anni > 0.25 && investito ? (Math.pow(1 + pl / investito, 1 / anni) - 1) * 100 : null;

    return { posizioni, aperte, investito, valore, pl, plPct: investito ? (pl / investito) * 100 : 0, dividendi, realizzato, varGiorno,
      perArea: raggruppa("area"), perSettore: raggruppa("settore"), perValuta: raggruppa("valuta"),
      perAsset: aperte.map((p, i) => ({ name: p.nome, value: Math.round(p.valore), fill: PALETTE[i % PALETTE.length], peso: valore ? (p.valore / valore) * 100 : 0 })).sort((a, b) => b.value - a.value),
      timeline, twr, annuo, senzaPrezzi: aperte.some((p) => p.senzaPrezzo), portfolioSnapshots: snapshots || [] };
  }, [assets, trades, quotes, snapshots]);
}

function Sparkline({ punti, colore = "#8B9DF9", w = 90, h = 28 }) {
  if (!punti?.length || punti.length < 2) return <div style={{ width: w, height: h }} className="rounded bg-white/[0.04]" />;
  const val = punti.map((p) => p.prezzo);
  const min = Math.min(...val), max = Math.max(...val), span = max - min || 1;
  const d = punti.map((p, i) => `${(i / (punti.length - 1)) * w},${h - ((p.prezzo - min) / span) * (h - 4) - 2}`).join(" L");
  const su = val[val.length - 1] >= val[0];
  const c = su ? "#4ADE80" : "#FB7185";
  return (
    <svg width={w} height={h} className="shrink-0 overflow-visible">
      <polyline points={d.replace(/ L/g, " ")} fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={w} cy={h - ((val[val.length - 1] - min) / span) * (h - 4) - 2} r="2.2" fill={c} />
    </svg>
  );
}

  const [dati, setDati] = useState({});      // ticker → { prezzo, variazione, fonte, storico }
  const [caricando, setCaricando] = useState(false);
  const [errore, setErrore] = useState(null);
  const [progresso, setProgresso] = useState(null);
  const [filtro, setFiltro] = useState("");
  const posseduti = useMemo(() => new Set(assets.map((a) => (a.isin || a.ticker || "").toUpperCase())), [assets]);

  const lista = useMemo(() => {
    const q = filtro.trim().toUpperCase();
    return ETF_CATALOG.filter((e) => !q || e.t.includes(q) || e.nome.toUpperCase().includes(q) || e.em.toUpperCase().includes(q) || e.cat.toUpperCase().includes(q));
  }, [filtro]);

  const stop = useRef(false);
  const carica = async () => {
    setCaricando(true); setErrore(null); stop.current = false;
    const nuovi = { ...dati };
    let ok = 0, falliti = 0; let primoErrore = null;
    for (let i = 0; i < lista.length; i++) {
      if (stop.current) break;
      const e = lista[i];
      setProgresso({ fatti: i, totale: lista.length, corrente: e.t });
      const asset = { nome: e.nome, ticker: e.t, isin: e.isin, tipo: e.tipo || "ETF", valuta: e.val, mercato: e.borsa, sym_y: e.y, sym_s: e.s, cg: e.cg };
      try {
        const q = await marketData.quote(asset);          // porta con sé anche la serie storica
        nuovi[e.t] = { ...q, storico: q.storico?.slice(-45) || null };
        ok++;
        setDati({ ...nuovi });                             // i prezzi compaiono man mano
      } catch (err) { falliti++; if (!primoErrore) primoErrore = err; }
      await new Promise((r) => setTimeout(r, 110));        // respiro tra una richiesta e l'altra
    }
    setDati(nuovi); setCaricando(false); setProgresso(null);
    if (!ok) setErrore(primoErrore?.suggerimento || primoErrore?.message || "Nessuna fonte ha risposto.");
    else {
      setErrore(falliti ? `${falliti} strumenti non hanno un prezzo: ${primoErrore?.message || "fonte non disponibile"}` : null);
      notify?.(`${ok} quotazioni caricate${falliti ? ` · ${falliti} senza prezzo` : ""}`);
    }
  };
  useEffect(() => { if (onCaricaReady) onCaricaReady(carica); }, [onCaricaReady, carica]);

  return (
    <div style={{ animation: "fadeUp .4s both" }}>
      <Card className="p-4 mb-4" hover={false}>
        <div className="flex flex-col sm:flex-row sm:items-center gap-3">
          <div className="min-w-0 flex-1">
            <h2 className="font-display text-white">Mercato</h2>
            <p className="text-xs text-slate-500 mt-0.5">I principali ETF europei con prezzo e andamento a 90 giorni. Aggiungine uno al portafoglio per registrare i tuoi acquisti.</p>
          </div>
          <div className="flex gap-2 shrink-0">
            <Input placeholder="Filtra…" value={filtro} onChange={(e) => setFiltro(e.target.value)} className="!w-32" />
            {caricando ? (
              <BtnGhost onClick={() => { stop.current = true; }}>Interrompi</BtnGhost>
            ) : (
              <BtnPrimary onClick={carica}>⟳ Quotazioni ({lista.length})</BtnPrimary>
            )}
          </div>
        </div>
        {progresso && (
          <div className="mt-3">
            <div className="flex justify-between text-[11px] text-slate-400 mb-1">
              <span>Carico {progresso.corrente}…</span>
              <span className="tabular-nums">{progresso.fatti} / {progresso.totale}</span>
            </div>
            <div className="h-1.5 rounded-full bg-white/5 overflow-hidden">
              <div className="h-full rounded-full bg-gradient-to-r from-indigo-400 to-teal-300 transition-all duration-300" style={{ width: `${(progresso.fatti / progresso.totale) * 100}%` }} />
            </div>
          </div>
        )}
        {errore && (
          <div className="mt-3 rounded-xl border border-amber-400/25 bg-amber-500/[0.07] p-3">
            <p className="text-xs text-amber-200">Nessuna quotazione recuperata.</p>
            <p className="text-[11px] text-slate-400 mt-0.5">{errore}</p>
            <p className="text-[11px] text-slate-500 mt-1">Controlla il ponte in Impostazioni: dev'essere un indirizzo che inoltra le richieste, con <code className="text-indigo-300">{"{url}"}</code> al posto della destinazione.</p>
          </div>
        )}
      </Card>

      <div className="grid sm:grid-cols-2 gap-3">
        {lista.map((e, i) => {
          const q = dati[e.t];
          const su = (q?.variazione ?? 0) >= 0;
          const gia = posseduti.has((e.isin || e.t).toUpperCase());
          return (
            <Card key={e.t + e.borsa} className="p-4" delay={Math.min(i, 10) * 35}>
              <div className="flex items-start justify-between gap-3">
                <div className="min-w-0 flex-1">
                  <div className="flex items-center gap-2">
                    <span className="text-[11px] font-semibold text-indigo-300">{e.t}</span>
                    {gia && <Chip tone="up">in portafoglio</Chip>}
                  </div>
                  <p className="text-sm text-white truncate mt-0.5">{e.nome}</p>
                  <p className="text-[11px] text-slate-500 truncate">{e.isin ? e.isin + " · " : ""}{e.borsa} · {e.em}</p>
                </div>
                <Sparkline punti={q?.storico} />
              </div>
              <div className="flex items-end justify-between gap-2 mt-3">
                <div>
                  {q ? (
                    <>
                      <p className="font-display text-lg text-white tabular-nums">{eur(q.prezzo)}</p>
                      <p className={`text-[11px] tabular-nums ${su ? "text-emerald-300" : "text-rose-300"}`}>
                        {q.variazione != null ? `${su ? "▲" : "▼"} ${Math.abs(q.variazione).toFixed(2)}%` : "—"}
                        <span className="text-slate-600 ml-1.5">{q.fonte}</span>
                      </p>
                    </>
                  ) : (
                    <p className="text-xs text-slate-600">{caricando ? "…" : "prezzo non caricato"}</p>
                  )}
                </div>
                <BtnGhost onClick={() => onAggiungi(e, q)} className="!py-1.5 !text-xs">{gia ? "Nuovo acquisto" : "+ Portafoglio"}</BtnGhost>
              </div>
            </Card>
          );
        })}
      </div>
    </div>
  );
}

function CategoriePage({ data, update, notify, setConfirmDlg, txs, setCatEditor }) {
  const [newGroup, setNewGroup] = useState("");
  const dragId = useRef(null);
  const dragModeRef = useRef("move");
  const [dragOver, setDragOver] = useState(null);

  const usage = useMemo(() => {
    const m = {};
    txs.forEach((t) => { if (t.categoria) m[t.categoria] = (m[t.categoria] || 0) + 1; });
    return m;
  }, [txs]);

  const byGroup = useMemo(() => {
    const m = {};
    data.groups.forEach((g) => (m[g] = []));
    [...data.categories].sort((a, b) => a.ordine - b.ordine).forEach((c) => {
      const groups = getCategoryGroups(c);
      groups.forEach((g) => { (m[g] = m[g] || []).push(c); });
    });
    return m;
  }, [data]);

  const onDrop = (targetId, targetGroup) => {
    const id = dragId.current;
    const mode = dragModeRef.current;
    dragId.current = null;
    dragModeRef.current = "move";
    setDragOver(null);
    if (!id || id === targetId) return;
    update((d) => {
      const ordered = [...d.categories].sort((a, b) => a.ordine - b.ordine);
      const dragged = ordered.find((c) => c.id === id);
      if (!dragged) return d;
      const rest = ordered.filter((c) => c.id !== id);
      const groups = getCategoryGroups(dragged).filter(Boolean);
      const nextGroups = mode === "copy"
        ? [...new Set([...groups, targetGroup].filter(Boolean))]
        : (groups.includes(targetGroup) ? groups.filter((g) => g !== targetGroup && g !== "") : [targetGroup]);
      dragged.gruppo = nextGroups.join("|");
      const idx = targetId ? rest.findIndex((c) => c.id === targetId) : rest.length;
      rest.splice(idx < 0 ? rest.length : idx, 0, dragged);
      rest.forEach((c, i) => { const orig = d.categories.find((x) => x.id === c.id); orig.ordine = i; orig.gruppo = c.gruppo; });
      return d;
    });
  };

  const removeCatFromGroup = (c, g) => {
    const groups = getCategoryGroups(c).filter((x) => x !== g);
    const msg = groups.length
      ? `Rimuovere "${c.nome}" solo dal gruppo "${g}"? Rimarrà disponibile nei gruppi: ${groups.join(", ")}.`
      : `Rimuovere "${c.nome}" da "${g}"? Non resterà in nessun gruppo, quindi verrà eliminata completamente.`;
    setConfirmDlg({
      msg,
      onOk: () => {
        update((d) => {
          const cat = d.categories.find((x) => x.id === c.id);
          if (!cat) return d;
          const nextGroups = getCategoryGroups(cat).filter((x) => x !== g);
          if (nextGroups.length) {
            cat.gruppo = nextGroups.join("|");
          } else {
            d.categories = d.categories.filter((x) => x.id !== c.id);
            delete d.budgets[c.id];
          }
          return d;
        });
        notify(groups.length ? `Categoria rimossa da "${g}"` : `Categoria eliminata`);
      },
    });
  };

  const deleteGroup = (g) => {
    if ((byGroup[g] || []).length) { notify("Sposta o elimina prima le categorie del gruppo"); return; }
    setConfirmDlg({ msg: `Eliminare il gruppo vuoto "${g}"?`, onOk: () => update((d) => { d.groups = d.groups.filter((x) => x !== g); return d; }) });
  };

  return (
    <div className="max-w-3xl mx-auto">
      <header className="mb-5 flex items-end justify-between" style={{ animation: "fadeUp .5s both" }}>
        <div>
          <p className="text-xs uppercase tracking-[0.2em] text-slate-500">Categorie</p>
          <h1 className="font-display text-xl sm:text-2xl text-white mt-1">La tua struttura, le tue regole</h1>
        </div>
        <BtnPrimary onClick={() => setCatEditor({})}>+ Nuova</BtnPrimary>
      </header>
      <p className="text-xs text-slate-500 mb-4" style={{ animation: "fadeUp .5s both", animationDelay: "60ms" }}>Trascina la scheda per spostarla in un altro gruppo; trascina l'icona ⧉ per duplicarla in un altro gruppo. Tocca una categoria per modificarla.</p>

      {data.groups.map((g, gi) => (
        <Card key={g} className="p-4 mb-4" hover={false} delay={80 + gi * 60}>
          <div className="flex items-center justify-between mb-2">
            <h2 className="font-display text-white text-sm uppercase tracking-wider">{g}</h2>
            <button onClick={() => deleteGroup(g)} className="text-[11px] text-slate-600 hover:text-rose-300 transition-colors">Elimina gruppo</button>
          </div>
          <div className="space-y-1" onDragOver={(e) => e.preventDefault()} onDrop={() => onDrop(null, g)}>
            {(byGroup[g] || []).map((c) => (
              <div
                key={c.id}
                draggable
                onDragStart={(e) => { e.stopPropagation(); dragId.current = c.id; dragModeRef.current = "move"; }}
                onDragOver={(e) => { e.preventDefault(); e.stopPropagation(); setDragOver(c.id); }}
                onDragLeave={() => setDragOver((x) => (x === c.id ? null : x))}
                onDrop={(e) => { e.stopPropagation(); onDrop(c.id, g); }}
                onClick={() => setCatEditor({ cat: c })}
                className={`group flex items-center gap-3 p-2 rounded-xl cursor-grab active:cursor-grabbing transition-all border ${dragOver === c.id ? "border-indigo-400/60 bg-indigo-400/10" : "border-transparent hover:bg-white/[0.05]"}`}
              >
                <span className="text-slate-600 text-xs select-none">⠿</span>
                <span className="w-8 h-8 rounded-lg grid place-items-center text-base" style={{ background: c.colore + "1f", border: `1px solid ${c.colore}33` }}>{c.icona}</span>
                <div className="min-w-0 flex-1">
                  <p className="text-sm text-white truncate">{c.nome}</p>
                  <p className="text-[11px] text-slate-500 truncate">
                    {[c.sottocategorie.length ? `${c.sottocategorie.length} sottocategorie` : null, data.budgets[c.id] ? `budget ${eur(data.budgets[c.id])}` : null, usage[c.id] ? `${usage[c.id]} movimenti` : "mai usata"].filter(Boolean).join(" · ")}
                  </p>
                </div>
                <span className="w-3 h-3 rounded-full shrink-0" style={{ background: c.colore }} />
                <span
                  draggable
                  title="Trascina per aggiungere questo gruppo"
                  onDragStart={(e) => { e.stopPropagation(); dragId.current = c.id; dragModeRef.current = "copy"; }}
                  onDragOver={(e) => { e.preventDefault(); e.stopPropagation(); setDragOver(c.id); }}
                  onDrop={(e) => { e.stopPropagation(); onDrop(c.id, g); }}
                  className="w-7 h-7 rounded-lg grid place-items-center text-xs text-slate-400 opacity-70 hover:opacity-100 hover:bg-white/10 transition-all cursor-copy"
                >⧉</span>
                <button onClick={(e) => { e.stopPropagation(); removeCatFromGroup(c, g); }} className="w-7 h-7 rounded-lg text-xs text-slate-500 opacity-0 group-hover:opacity-100 hover:bg-rose-500/20 hover:text-rose-300 transition-all" title={`Rimuovi da ${g}`}>🗑</button>
              </div>
            ))}
            {(byGroup[g] || []).length === 0 && <p className="text-xs text-slate-600 py-2 px-2">Gruppo vuoto: trascina qui una categoria.</p>}
          </div>
        </Card>
      ))}

      <Card className="p-4" hover={false} delay={200}>
        <p className="text-sm text-white mb-3">Nuovo gruppo</p>
        <div className="flex gap-3">
          <Input placeholder="es. Famiglia, Auto, Business…" value={newGroup} onChange={(e) => setNewGroup(e.target.value)} />
          <BtnPrimary onClick={() => { const g = newGroup.trim(); if (!g || data.groups.includes(g)) return; update((d) => { d.groups.push(g); return d; }); setNewGroup(""); notify(`Gruppo "${g}" creato`); }}>Crea</BtnPrimary>
        </div>
      </Card>
    </div>
  );
}

function CatModal({ open, cat, prefillName, prefillGroup, onClose, data, update, notify, setConfirmDlg, onSaved }) {
  const isEdit = !!cat?.id;
  const [f, setF] = useState(null);
  const [subInput, setSubInput] = useState("");
  useEffect(() => {
    if (open) {
      const initialGroups = getCategoryGroups(cat).length ? getCategoryGroups(cat) : (prefillGroup ? [prefillGroup] : (data.groups[0] ? [data.groups[0]] : []));
      setF({ nome: cat?.nome || prefillName || "", gruppi: initialGroups, icona: cat?.icona || "✨", colore: cat?.colore || "#8B9DF9", sottocategorie: [...(cat?.sottocategorie || [])], budget: cat?.id && data.budgets[cat.id] ? String(data.budgets[cat.id]) : "" });
      setSubInput("");
    }
  }, [open, cat, prefillName, prefillGroup, data]);
  if (!open || !f) return null;
  const set = (k, v) => setF((x) => ({ ...x, [k]: v }));
  const addSub = () => { const s = subInput.trim(); if (!s || f.sottocategorie.includes(s)) return; set("sottocategorie", [...f.sottocategorie, s]); setSubInput(""); };
  const save = () => {
    if (!f.nome.trim()) return;
    let id = cat?.id;
    update((d) => {
      const gruppi = (f.gruppi || []).filter(Boolean);
      if (isEdit) {
        const c = d.categories.find((x) => x.id === id);
        Object.assign(c, { nome: f.nome.trim(), gruppo: gruppi.join("|"), icona: f.icona, colore: f.colore, sottocategorie: f.sottocategorie });
      } else {
        id = uid();
        d.categories.push({ id, nome: f.nome.trim(), gruppo: gruppi.join("|"), icona: f.icona, colore: f.colore, sottocategorie: f.sottocategorie, ordine: Math.max(-1, ...d.categories.map((c) => c.ordine)) + 1 });
      }
      const b = Number(f.budget);
      if (b > 0) d.budgets[id] = b; else delete d.budgets[id];
      return d;
    });
    notify(isEdit ? "Categoria aggiornata" : `Categoria "${f.nome.trim()}" creata`);
    if (onSaved) onSaved(id); else onClose();
  };
  const remove = () => {
    const n = data.transactions.filter((t) => t.categoria === cat.id).length;
    setConfirmDlg({
      msg: n ? `"${cat.nome}" è usata in ${n} movimenti: resteranno nello storico come "Senza categoria". Eliminare la categoria?` : `Eliminare la categoria "${cat.nome}"?`,
      onOk: () => { update((d) => { d.categories = d.categories.filter((x) => x.id !== cat.id); delete d.budgets[cat.id]; return d; }); notify("Categoria eliminata"); onClose(); },
    });
  };
  return (
    <Modal open={open} onClose={onClose} title={isEdit ? "Modifica categoria" : "Nuova categoria"} wide>
      <div className="grid sm:grid-cols-2 gap-4">
        <div><Label>Nome</Label><Input value={f.nome} onChange={(e) => set("nome", e.target.value)} placeholder="es. Palestra" autoFocus /></div>
        <div><Label>Gruppi</Label>
          <div className="flex flex-wrap gap-2 mt-1">
            {data.groups.map((g) => (
              <label key={g} className={`flex items-center gap-2 px-2.5 py-1.5 rounded-full border text-xs transition-all ${f.gruppi.includes(g) ? "border-indigo-400/60 bg-indigo-400/15 text-white" : "border-white/10 bg-white/5 text-slate-400"}`}>
                <input type="checkbox" checked={f.gruppi.includes(g)} onChange={(e) => set("gruppi", e.target.checked ? [...f.gruppi, g] : f.gruppi.filter((x) => x !== g))} />
                <span>{g}</span>
              </label>
            ))}
          </div>
        </div>
      </div>
      <div className="mt-4"><Label>Icona</Label>
        <div className="grid grid-cols-8 sm:grid-cols-11 gap-1.5">
          {EMOJI_SET.map((e) => (

          <input value={f.icona} onChange={(e) => set("icona", e.target.value)} maxLength={4} className="aspect-square rounded-xl bg-white/5 border border-white/10 text-center text-base outline-none focus:border-indigo-400/60 min-w-0" title="Emoji personalizzata" />
