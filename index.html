/* ---- Mini mappa del dettaglio viaggio: minimal, zoomata sulla destinazione ---- */
function MiniMap({ lat, lon, paese, colore = "#8B9DF9", height = 170 }) {
  const [vbAnim, setVbAnim] = useState(null);
  /* bounding box del paese di destinazione, per inquadrarlo */
  const box = useMemo(() => {
    const d = COUNTRY_PATHS[paese];
    const p = lat != null ? geoToXY(lat, lon) : null;
    if (!d) return p ? { x: p.x - 60, y: p.y - 32, w: 120, h: 64 } : { x: 0, y: 0, w: MAP_W, h: MAP_H };
    const nums = d.match(/-?\d+(\.\d+)?/g).map(Number);
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (let i = 0; i + 1 < nums.length; i += 2) {
      x0 = Math.min(x0, nums[i]); x1 = Math.max(x1, nums[i]);
      y0 = Math.min(y0, nums[i + 1]); y1 = Math.max(y1, nums[i + 1]);
    }
    /* include sempre il marker e mantiene proporzioni gradevoli */
    if (p) { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
    const pad = Math.max((x1 - x0) * 0.35, (y1 - y0) * 0.35, 8);
    x0 -= pad; y0 -= pad; x1 += pad; y1 += pad;
    let w = x1 - x0, h = y1 - y0;
    const ratio = 16 / 9;
    if (w / h < ratio) { const nw = h * ratio; x0 -= (nw - w) / 2; w = nw; } else { const nh = w / ratio; y0 -= (nh - h) / 2; h = nh; }
    return { x: x0, y: y0, w, h };
  }, [paese, lat, lon]);

  /* zoom cinematico: dalla vista larga alla destinazione */
  useEffect(() => {
    const wide = { x: box.x + box.w / 2 - box.w * 2.6, y: box.y + box.h / 2 - box.h * 2.6, w: box.w * 5.2, h: box.h * 5.2 };
    const reduce = window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;
    if (reduce) { setVbAnim(box); return; }
    const t0 = performance.now(), dur = 1100;
    let raf;
    const tick = (now) => {
      const p = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      setVbAnim({ x: wide.x + (box.x - wide.x) * e, y: wide.y + (box.y - wide.y) * e, w: wide.w + (box.w - wide.w) * e, h: wide.h + (box.h - wide.h) * e });
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [box]);

  const vb = vbAnim || box;
  const pin = lat != null ? geoToXY(lat, lon) : null;
  const scale = vb.w / MAP_W;              // spessore dei bordi proporzionale allo zoom
  const pinScale = Math.max(0.35, vb.h / 105); // marker di dimensione costante a schermo

  return (
    <div className="relative rounded-xl overflow-hidden border border-white/10" style={{ height, background: "#0B111C" }}>
      <svg viewBox={`${vb.x} ${vb.y} ${vb.w} ${vb.h}`} className="w-full h-full" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="mmSea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#101A2B" /><stop offset="100%" stopColor="#0A101A" />
          </linearGradient>
        </defs>
        <rect x={vb.x - 500} y={vb.y - 500} width={vb.w + 1000} height={vb.h + 1000} fill="url(#mmSea)" />
        {/* terre emerse in tinta unica: nessun colore casuale, solo contrasto terra/mare */}
        {Object.entries(COUNTRY_PATHS).map(([nm, d]) => (
          <path key={nm} d={d}
            fill={nm === paese ? colore + "3A" : "rgba(148,163,184,0.10)"}
            stroke={nm === paese ? colore + "AA" : "rgba(148,163,184,0.18)"}
            strokeWidth={(nm === paese ? 1.1 : 0.4) * scale}
            style={{ transition: "fill .5s ease" }} />
        ))}
        {pin && (
          <g transform={`translate(${pin.x} ${pin.y}) scale(${pinScale})`}>
            <circle r="16" fill={colore} opacity=".18"><animate attributeName="r" values="10;22;10" dur="2.8s" repeatCount="indefinite" /><animate attributeName="opacity" values=".3;0;.3" dur="2.8s" repeatCount="indefinite" /></circle>
            <path d={PIN_PATH} fill={colore} stroke="rgba(255,255,255,.9)" strokeWidth=".8" />
            <circle cy="-11.5" r="4.2" fill="rgba(10,13,20,.92)" />
          </g>
        )}
      </svg>
      <div className="absolute bottom-2 left-2.5 flex items-center gap-1.5 px-2 py-1 rounded-lg text-[11px] pointer-events-none" style={{ background: "rgba(10,14,22,.85)", backdropFilter: "blur(10px)" }}>
        <span>{countryFlag(paese)}</span><span className="text-slate-200">{countryLabel(paese)}</span>
      </div>
    </div>
  );
}

/* ---- Dettaglio viaggio: hero, budget, spese, timeline, galleria ---- */
function TripDetail({ trip, data, update, notify, setConfirmDlg, onClose, onEdit, onDelete }) {
  const [tab, setTab] = useState("panoramica");
  const [expModal, setExpModal] = useState(null);
  const [lightbox, setLightbox] = useState(null);
  const expenses = useMemo(() => (data.tripExpenses || []).filter((e) => e.tripId === trip.id).sort((a, b) => b.data.localeCompare(a.data)), [data.tripExpenses, trip.id]);
  const totale = expenses.reduce((s, e) => s + e.importo, 0);
  const gg = dayCount(trip.partenza, trip.ritorno);
  const pct = trip.budget > 0 ? (totale / trip.budget) * 100 : 0;
  const status = tripStatus(trip);

  const byCat = useMemo(() => {
    const m = {};
    expenses.forEach((e) => (m[e.categoria] = (m[e.categoria] || 0) + e.importo));
    return Object.entries(m).map(([k, v]) => ({ name: tripCat(k).nome, value: Math.round(v), fill: tripCat(k).colore, icona: tripCat(k).icona })).sort((a, b) => b.value - a.value);
  }, [expenses]);

  /* timeline: giorni del viaggio con le spese di quel giorno */
  const timeline = useMemo(() => {
    if (!trip.partenza || !gg) return [];
    return Array.from({ length: Math.min(gg, 60) }, (_, i) => {
      const d = new Date(trip.partenza + "T12:00"); d.setDate(d.getDate() + i);
      const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      const day = expenses.filter((e) => e.data === iso);
      return { n: i + 1, iso, label: d.toLocaleDateString("it-IT", { weekday: "short", day: "2-digit", month: "short" }), spese: day, tot: day.reduce((s, e) => s + e.importo, 0) };
    });
  }, [trip, gg, expenses]);

  /* salva spesa + eventuale registrazione nel bilancio principale */
  const saveExp = (e) => {
    const isNew = !e.id || !expenses.some((x) => x.id === e.id);
    const id = e.id || uid();
    update((d) => {
      if (!d.tripExpenses) d.tripExpenses = [];
      const i = d.tripExpenses.findIndex((x) => x.id === id);
      const rec = { ...e, id, tripId: trip.id };
      if (i >= 0) d.tripExpenses[i] = rec; else d.tripExpenses.push(rec);
      /* sincronizzazione col modulo Finanza: crea/aggiorna la transazione collegata */
      if (trip.syncFinanza) {
        const catId = d.categories.find((c) => c.nome.toLowerCase() === "viaggi")?.id
          || (() => { const nid = uid(); d.categories.push({ id: nid, nome: "Viaggi", gruppo: "Wants", icona: "✈️", colore: "#FDBA74", sottocategorie: [], ordine: Math.max(-1, ...d.categories.map((c) => c.ordine)) + 1 }); return nid; })();
        const linked = d.transactions.find((t) => t.tripExpenseId === id);
        const tx = { id: linked?.id || uid(), tipo: "spesa", importo: rec.importo, data: rec.data, categoria: catId, sottocategoria: tripCat(rec.categoria).nome, conto: rec.conto || d.accounts[0]?.id, metodo: rec.metodo, note: `${trip.nome}: ${rec.descrizione || tripCat(rec.categoria).nome}`, tags: ["viaggio"], tripExpenseId: id, tripId: trip.id };
        if (linked) { const li = d.transactions.findIndex((t) => t.id === linked.id); d.transactions[li] = tx; }
        else d.transactions.unshift(tx);
        d.transactions.sort((a, b) => b.data.localeCompare(a.data));
      }
      return d;
    });
    setExpModal(null);
    notify(isNew ? "Spesa aggiunta" + (trip.syncFinanza ? " e registrata nel bilancio" : "") : "Spesa aggiornata");
  };

  const delExp = (id) => setConfirmDlg({
    msg: "Eliminare questa spesa del viaggio?" + (trip.syncFinanza ? " Verrà rimossa anche dal bilancio principale." : ""),
    onOk: () => { update((d) => { d.tripExpenses = d.tripExpenses.filter((x) => x.id !== id); d.transactions = d.transactions.filter((t) => t.tripExpenseId !== id); return d; }); notify("Spesa eliminata"); },
  });

  const toggleSync = () => {
    update((d) => { const t = d.trips.find((x) => x.id === trip.id); if (t) t.syncFinanza = !t.syncFinanza; return d; });
    notify(trip.syncFinanza ? "Spese scollegate dal bilancio" : "Le nuove spese verranno registrate nel bilancio");
  };

  return createPortal(
    <div className="fixed inset-0 z-[75] overflow-y-auto" style={{ animation: "fadeIn .2s both" }}>
      <div className="fixed inset-0 bg-black/70 backdrop-blur-sm" onClick={onClose} />
      <div className="relative max-w-3xl mx-auto sm:my-8 rounded-none sm:rounded-3xl overflow-hidden border-0 sm:border border-white/10 min-h-full sm:min-h-0" style={{ background: "rgba(12,15,23,.98)", animation: "popIn .32s cubic-bezier(.22,1,.36,1) both", paddingBottom: "env(safe-area-inset-bottom)" }}>
        {/* hero */}
        <div className="h-40 sm:h-52 md:h-56 relative" style={{ background: `linear-gradient(135deg, ${trip.colore}55, #0F1420)` }}>
          {trip.cover && <img src={trip.cover} alt="" className="absolute inset-0 w-full h-full object-cover opacity-75" onError={(e) => (e.currentTarget.style.display = "none")} />}
          <div className="absolute inset-0" style={{ background: "linear-gradient(180deg, rgba(10,12,18,.4) 0%, transparent 35%, rgba(12,15,23,.97))" }} />
          <button onClick={onClose} className="absolute top-3 right-3 w-9 h-9 rounded-full grid place-items-center text-white/90 border border-white/15 hover:bg-white/15 transition-all" style={{ background: "rgba(0,0,0,.35)", backdropFilter: "blur(8px)" }}>✕</button>
          <div className="absolute bottom-4 left-5 right-5">
            <div className="flex items-center gap-2 mb-1">
              <span className="text-2xl">{trip.icona}</span>
              {status === "corso" && <Chip tone="up">In corso</Chip>}
              {status === "futuro" && <Chip tone="up">Tra {daysTo(trip.partenza)} giorni</Chip>}
            </div>
            <h2 className="font-display text-xl sm:text-2xl md:text-3xl text-white truncate">{trip.nome}</h2>
            <p className="text-xs sm:text-sm text-slate-300 mt-0.5">{countryFlag(trip.paese)} {trip.citta ? trip.citta + " · " : ""}{countryLabel(trip.paese)} · {fmtDate(trip.partenza)} → {fmtDate(trip.ritorno)}</p>
          </div>
        </div>

        <div className="p-4 sm:p-5">
          {/* budget */}
          <div className="grid grid-cols-3 gap-2 sm:gap-3 mb-4">
            <Card className="p-3.5" hover={false}><p className="text-[11px] text-slate-500">Speso</p><CountEur value={totale} cls={`font-display text-lg tabular-nums ${pct > 100 ? "text-rose-300" : "text-white"}`} /></Card>
            <Card className="p-3.5" hover={false}><p className="text-[11px] text-slate-500">Budget</p><p className="font-display text-lg text-slate-300 tabular-nums">{trip.budget > 0 ? eur(trip.budget) : "—"}</p></Card>
            <Card className="p-3.5" hover={false}><p className="text-[11px] text-slate-500">{gg} giorni · media</p><p className="font-display text-lg text-indigo-300 tabular-nums">{eur(gg ? totale / gg : 0)}</p></Card>
          </div>
          {trip.budget > 0 && (
            <div className="mb-4">
              <div className="h-2 rounded-full bg-white/5 overflow-hidden">
                <div className="h-full rounded-full transition-all duration-1000 ease-out" style={{ width: `${Math.min(100, pct)}%`, background: pct > 100 ? "linear-gradient(90deg,#FB7185,#F43F5E)" : pct > 80 ? "linear-gradient(90deg,#FBBF24,#F59E0B)" : `linear-gradient(90deg,${trip.colore},#A5B4FC)` }} />
              </div>
              <p className={`text-[11px] mt-1 ${pct > 100 ? "text-rose-300" : "text-slate-500"}`}>{pct > 100 ? `Budget superato di ${eur(totale - trip.budget)}` : `${Math.round(pct)}% usato · restano ${eur(trip.budget - totale)}`}</p>
            </div>
          )}

          {/* tab */}
          <div className="flex gap-1 bg-white/5 rounded-xl p-1 mb-4 overflow-x-auto">
            {[{ v: "panoramica", l: "Panoramica" }, { v: "spese", l: `Spese (${expenses.length})` }, { v: "timeline", l: "Timeline" }, { v: "album", l: `Album (${(trip.foto || []).length})` }].map((t) => (
              <button key={t.v} onClick={() => setTab(t.v)} className={`px-3 py-1.5 rounded-lg text-xs whitespace-nowrap transition-all ${tab === t.v ? "bg-white/15 text-white" : "text-slate-400 hover:text-white"}`}>{t.l}</button>
            ))}
          </div>

          {tab === "panoramica" && (
            <div className="space-y-4" style={{ animation: "fadeUp .3s both" }}>
              {trip.descrizione && <p className="text-sm text-slate-300 leading-relaxed">{trip.descrizione}</p>}
              <div className="grid sm:grid-cols-2 gap-4">
                <Card className="p-4" hover={false}>
                  <p className="text-xs text-slate-400 mb-2">Spese per categoria</p>
                  {byCat.length ? (
                    <div className="flex items-center gap-3">
                      <div className="w-20 h-20 sm:w-24 sm:h-24 shrink-0">
                        <ResponsiveContainer width="100%" height="100%">
                          <PieChart><Pie data={byCat} dataKey="value" innerRadius="52%" outerRadius="88%" paddingAngle={3} animationDuration={900}>{byCat.map((e, i) => <Cell key={i} fill={e.fill} stroke="transparent" />)}</Pie><Tooltip content={<ChartTip />} /></PieChart>
                        </ResponsiveContainer>
                      </div>
                      <div className="flex-1 space-y-1 text-xs max-h-24 overflow-y-auto min-w-0">
                        {byCat.slice(0, 6).map((c) => (
                          <div key={c.name} className="flex justify-between gap-2"><span className="text-slate-300 truncate">{c.icona} {c.name}</span><span className="text-slate-400 tabular-nums">{eur(c.value)}</span></div>
                        ))}
                      </div>
                    </div>
                  ) : <EmptyState text="Nessuna spesa registrata." />}
                </Card>
                <Card className="p-4" hover={false}>
                  <p className="text-xs text-slate-400 mb-2">Dove</p>
                  <MiniMap lat={trip.lat} lon={trip.lon} paese={trip.paese} colore={trip.colore} height={170} />
                  <div className="grid grid-cols-2 gap-2 mt-3 text-xs">
                    <div><p className="text-slate-500">Persone</p><p className="text-white">{trip.persone || 1}</p></div>
                    <div><p className="text-slate-500">Distanza (a/r)</p><p className="text-white">{trip.lat || trip.lon ? `${(haversine(HOME_BASE, [trip.lat, trip.lon]) * 2).toLocaleString("it-IT")} km` : "—"}</p></div>
                  </div>
                </Card>
              </div>
              {trip.note && <Card className="p-4" hover={false}><p className="text-xs text-slate-400 mb-1">Note</p><p className="text-sm text-slate-300 whitespace-pre-wrap">{trip.note}</p></Card>}
              <label className="flex items-center gap-3 p-3.5 rounded-xl bg-white/[0.04] border border-white/[0.06] cursor-pointer" onClick={toggleSync}>
                <span className={`w-10 h-5.5 rounded-full transition-all relative shrink-0 ${trip.syncFinanza ? "bg-gradient-to-r from-indigo-400 to-violet-400" : "bg-white/10"}`} style={{ height: 22 }}>
                  <span className={`absolute top-0.5 w-[18px] h-[18px] rounded-full bg-white transition-all ${trip.syncFinanza ? "left-[22px]" : "left-0.5"}`} />
                </span>
                <span className="text-sm text-slate-300">Registra le spese anche nel bilancio principale</span>
              </label>
            </div>
          )}

          {tab === "spese" && (
            <div style={{ animation: "fadeUp .3s both" }}>
              <div className="flex justify-between items-center mb-3">
                <p className="text-xs text-slate-500">{expenses.length} spese · {eur(totale)}</p>
                <BtnPrimary onClick={() => setExpModal({})} className="!py-1.5 !text-xs">+ Spesa</BtnPrimary>
              </div>
              <div className="divide-y divide-white/[0.05]">
                {expenses.map((e, i) => {
                  const c = tripCat(e.categoria);
                  return (
                    <div key={e.id} className="group flex items-center gap-3 py-2.5" style={{ animation: "fadeUp .35s both", animationDelay: `${Math.min(i, 10) * 30}ms` }}>
                      <span className="w-9 h-9 rounded-xl grid place-items-center text-base shrink-0" style={{ background: c.colore + "1f", border: `1px solid ${c.colore}33` }}>{c.icona}</span>
                      <div className="min-w-0 flex-1">
                        <p className="text-sm text-white truncate">{e.descrizione || c.nome}</p>
                        <p className="text-xs text-slate-500 truncate">{c.nome} · {fmtDate(e.data)}{e.metodo ? ` · ${e.metodo}` : ""}</p>
                      </div>
                      <span className="text-sm text-slate-200 tabular-nums">{eur(e.importo)}</span>
                      <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onClick={() => setExpModal(e)} className="w-7 h-7 rounded-lg bg-white/5 hover:bg-white/10 text-xs transition-all">✎</button>
                        <button onClick={() => delExp(e.id)} className="w-7 h-7 rounded-lg bg-white/5 hover:bg-rose-500/20 text-xs hover:text-rose-300 transition-all">🗑</button>
                      </div>
                    </div>
                  );
                })}
                {expenses.length === 0 && <EmptyState text="Nessuna spesa. Aggiungi voli, hotel, ristoranti…" />}
              </div>
            </div>
          )}

          {tab === "timeline" && (
            <div className="space-y-3" style={{ animation: "fadeUp .3s both" }}>
              {timeline.map((d, i) => (
                <div key={d.iso} className="flex gap-3" style={{ animation: "fadeUp .35s both", animationDelay: `${Math.min(i, 12) * 40}ms` }}>
                  <div className="flex flex-col items-center shrink-0">
                    <span className="w-8 h-8 rounded-full grid place-items-center text-[11px] font-semibold" style={{ background: trip.colore + "22", border: `1px solid ${trip.colore}55`, color: trip.colore }}>{d.n}</span>
                    {i < timeline.length - 1 && <span className="w-px flex-1 bg-white/10 my-1" />}
                  </div>
                  <div className="flex-1 pb-2 min-w-0">
                    <div className="flex justify-between items-baseline gap-2">
                      <p className="text-sm text-white capitalize">{d.label}</p>
                      {d.tot > 0 && <span className="text-xs text-slate-400 tabular-nums">{eur(d.tot)}</span>}
                    </div>
                    {d.spese.length ? (
                      <div className="mt-1.5 flex flex-wrap gap-1.5">
                        {d.spese.map((e) => { const c = tripCat(e.categoria); return (
                          <span key={e.id} className="text-[11px] px-2 py-1 rounded-lg border" style={{ background: c.colore + "14", borderColor: c.colore + "33", color: "#e2e8f0" }}>{c.icona} {e.descrizione || c.nome} · {eur(e.importo)}</span>
                        ); })}
                      </div>
                    ) : <p className="text-[11px] text-slate-600 mt-0.5">Nessuna spesa registrata</p>}
                  </div>
                </div>
              ))}
              {!timeline.length && <EmptyState text="Imposta le date del viaggio per vedere la timeline." />}
            </div>
          )}

          {tab === "album" && (
            <div style={{ animation: "fadeUp .3s both" }}>
              {(trip.foto || []).length ? (
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                  {trip.foto.map((f, i) => (
                    <button key={i} onClick={() => setLightbox(i)} className="aspect-square rounded-xl overflow-hidden border border-white/10 group">
                      <img src={f} alt="" loading="lazy" className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" onError={(e) => (e.currentTarget.parentElement.style.display = "none")} />
                    </button>
                  ))}
                </div>
              ) : <EmptyState text="Album vuoto. Aggiungi i link delle foto modificando il viaggio." />}
            </div>
          )}

          <div className="modal-actions flex flex-wrap items-center gap-2 mt-5 pt-4 border-t border-white/[0.06]">
            <BtnGhost onClick={onEdit}>Modifica</BtnGhost>
            <button onClick={onDelete} className="text-xs text-rose-300/70 hover:text-rose-300 px-2 transition-colors">Elimina</button>
            <div className="flex-1" />
            <BtnPrimary onClick={() => { setTab("spese"); setExpModal({}); }}>+ Spesa</BtnPrimary>
          </div>
        </div>
      </div>

      <TripExpenseModal open={!!expModal} exp={expModal} trip={trip} accounts={data.accounts} onClose={() => setExpModal(null)} onSave={saveExp} />
      {lightbox != null && (
        <div className="fixed inset-0 z-[115] bg-black/95 flex items-center justify-center" style={{ animation: "fadeIn .2s both" }} onClick={() => setLightbox(null)}>
          <img src={trip.foto[lightbox]} alt="" className="max-w-[92vw] max-h-[86vh] object-contain rounded-xl" style={{ animation: "popIn .3s cubic-bezier(.22,1,.36,1) both" }} />
          <button onClick={(e) => { e.stopPropagation(); setLightbox((l) => (l - 1 + trip.foto.length) % trip.foto.length); }} className="absolute left-4 w-11 h-11 rounded-full bg-white/10 text-white text-xl hover:bg-white/20 transition-all">‹</button>
          <button onClick={(e) => { e.stopPropagation(); setLightbox((l) => (l + 1) % trip.foto.length); }} className="absolute right-4 w-11 h-11 rounded-full bg-white/10 text-white text-xl hover:bg-white/20 transition-all">›</button>
          <span className="absolute bottom-6 text-xs text-slate-400">{lightbox + 1} / {trip.foto.length}</span>
        </div>
      )}
    </div>,
    document.body
  );
}

function TripExpenseModal({ open, exp, trip, accounts, onClose, onSave }) {
  const [f, setF] = useState(null);
  useEffect(() => { if (open) setF({ id: exp?.id, data: exp?.data || (tripStatus(trip) === "futuro" ? trip.partenza : todayISO()), categoria: exp?.categoria || "ristoranti", importo: exp?.importo ?? "", descrizione: exp?.descrizione || "", metodo: exp?.metodo || "Carta", conto: exp?.conto || accounts[0]?.id || "", note: exp?.note || "", ricevuta: exp?.ricevuta || "" }); }, [open, exp, trip, accounts]);
  if (!open || !f) return null;
  const set = (k, v) => setF((x) => ({ ...x, [k]: v }));
  return (
    <Modal open={open} onClose={onClose} title={exp?.id ? "Modifica spesa" : "Nuova spesa di viaggio"}>
      <div className="space-y-3">
        <div><Label>Importo</Label><Input type="number" inputMode="decimal" step="0.01" placeholder="0,00" value={f.importo} onChange={(e) => set("importo", e.target.value)} autoFocus /></div>
        <div><Label>Categoria</Label>
          <div className="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto p-0.5">
            {TRIP_CATS.map((c) => (
              <button key={c.id} onClick={() => set("categoria", c.id)} className={`px-2.5 py-1 rounded-full text-xs border transition-all ${f.categoria === c.id ? "text-white bg-indigo-400/15 border-indigo-400/70" : "text-slate-400 bg-white/5 border-white/10 hover:border-white/25"}`}>{c.icona} {c.nome}</button>
            ))}
          </div>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div><Label>Data</Label><Input type="date" value={f.data} min={trip.partenza} max={trip.ritorno} onChange={(e) => set("data", e.target.value)} /></div>
          <div><Label>Metodo</Label><Select value={f.metodo} onChange={(e) => set("metodo", e.target.value)}>{["Carta", "Contanti", "Bonifico", "Altro"].map((m) => <option key={m}>{m}</option>)}</Select></div>
        </div>
        <div><Label>Descrizione</Label><Input placeholder="es. Cena al ristorante sul porto" value={f.descrizione} onChange={(e) => set("descrizione", e.target.value)} /></div>
        <div className="grid grid-cols-2 gap-3">
          <div><Label>Conto</Label><Select value={f.conto} onChange={(e) => set("conto", e.target.value)}>{accounts.map((a) => <option key={a.id} value={a.id}>{a.icona} {a.nome}</option>)}</Select></div>
          <div><Label>Link ricevuta</Label><Input placeholder="https://… (facoltativo)" value={f.ricevuta} onChange={(e) => set("ricevuta", e.target.value)} /></div>
        </div>
        {trip.syncFinanza && <p className="text-[11px] text-indigo-300/80">Questa spesa verrà registrata anche nel bilancio principale.</p>}
      </div>
      <div className="modal-actions flex justify-end gap-3 mt-5">
        <BtnGhost onClick={onClose}>Annulla</BtnGhost>
        <BtnPrimary onClick={() => { const v = Number(f.importo); if (v > 0) onSave({ ...f, importo: v }); }}>{exp?.id ? "Salva" : "Aggiungi"}</BtnPrimary>
      </div>
    </Modal>
  );
}

/* ---- Editor viaggio con ricerca città (coordinate automatiche) ---- */
function TripModal({ open, trip, onClose, onSave }) {
  const [f, setF] = useState(null);
  const [cityQ, setCityQ] = useState("");
  const [cityOpen, setCityOpen] = useState(false);
  const [fotoInput, setFotoInput] = useState("");
  const boxRef = useRef(null);
  useEffect(() => {
    if (open) {
      const t = trip || {};
      setAlt([]);
      setF({ id: t.id, nome: t.nome || "", paese: t.paese || "", citta: t.citta || "", lat: t.lat ?? null, lon: t.lon ?? null,
        partenza: t.partenza || todayISO(), ritorno: t.ritorno || todayISO(), persone: t.persone || 1, descrizione: t.descrizione || "",
        colore: t.colore || "#8B9DF9", icona: t.icona || "✈️", cover: t.cover || "", foto: [...(t.foto || [])],
        budget: t.budget ?? "", valuta: t.valuta || "EUR", syncFinanza: t.syncFinanza ?? false, note: t.note || "" });
      setCityQ(t.citta || ""); setFotoInput("");
    }
  }, [open, trip]);
  useEffect(() => {
    const h = (e) => { if (boxRef.current && !boxRef.current.contains(e.target)) setCityOpen(false); };
    document.addEventListener("mousedown", h); return () => document.removeEventListener("mousedown", h);
  }, []);
  /* gli hook devono stare PRIMA di qualsiasi return condizionale */
  const { res: matches, loading: searching, offline: geoOffline } = usePlaceSearch(open && cityOpen ? cityQ : "");
  const [autoCover, setAutoCover] = useState(true);
  const [alt, setAlt] = useState([]);
  const { state: coverState, soggetto: coverSoggetto } = useAutoCover(open ? f?.citta : "", f?.paese, f?.lat, f?.lon, open && autoCover, (url) => setF((x) => (x && (!x.cover || x.coverAuto) ? { ...x, cover: url, coverAuto: true } : x)));
  if (!open || !f) return null;
  const set = (k, v) => setF((x) => ({ ...x, [k]: v }));

  const pickCity = (p) => { setF((x) => ({ ...x, citta: p.nome, paese: p.paese, lat: p.lat, lon: p.lon })); setCityQ(p.nome); setCityOpen(false); };
  const gg = dayCount(f.partenza, f.ritorno);

  return (
    <Modal open={open} onClose={onClose} title={f.id ? "Modifica viaggio" : "Nuovo viaggio"} wide>
      <div className="space-y-3">
        <div><Label>Nome del viaggio</Label><Input value={f.nome} onChange={(e) => set("nome", e.target.value)} placeholder="es. Estate in Grecia" autoFocus /></div>

        <div ref={boxRef} className="relative">
          <Label>Destinazione (le coordinate sono automatiche)</Label>
          <div className="relative">
            <Input value={cityQ} onChange={(e) => { setCityQ(e.target.value); setCityOpen(true); }}
              onFocus={(e) => { setCityOpen(true); setTimeout(() => e.target.scrollIntoView({ block: "center", behavior: "smooth" }), 320); }}
              placeholder="Cerca un luogo… es. Positano, Monte Bianco" />
            {searching && <span className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400"><Spinner /></span>}
          </div>
          {cityOpen && matches.length > 0 && (
            <div className="absolute z-30 mt-1 w-full rounded-xl overflow-hidden border border-white/15 shadow-2xl max-h-64 overflow-y-auto" style={{ background: "rgba(14,17,26,.97)", backdropFilter: "blur(20px)", animation: "popIn .18s both" }}>
              {matches.map((p, i) => (
                <button key={p.nome + p.lat + i} onClick={() => pickCity(p)} className="w-full flex items-start gap-2 px-3 py-2 text-sm text-left hover:bg-white/10 transition-colors border-b border-white/[0.04] last:border-0">
                  <span className="mt-0.5">{countryFlag(p.paese)}</span>
                  <span className="min-w-0 flex-1">
                    <span className="text-white block truncate">{p.nome}</span>
                    <span className="text-[11px] text-slate-500 block truncate">{p.etichetta || countryLabel(p.paese)}</span>
                  </span>
                  <span className="text-[10px] text-slate-600 shrink-0 mt-0.5">{p.tipo}</span>
                </button>
              ))}
            </div>
          )}
          {cityOpen && geoOffline && cityQ.trim().length > 1 && <p className="text-[11px] text-amber-300/70 mt-1">Ricerca online non raggiungibile: mostro solo le località in archivio.</p>}
          {f.paese && <p className="text-[11px] text-slate-500 mt-1">{countryFlag(f.paese)} {countryLabel(f.paese)}{f.lat != null ? ` · ${f.lat.toFixed(2)}, ${f.lon.toFixed(2)} · ${(haversine(HOME_BASE, [f.lat, f.lon])).toLocaleString("it-IT")} km da casa` : ""}</p>}
        </div>

        <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
          <div className="col-span-2 sm:col-span-1"><Label>Partenza</Label><Input type="date" value={f.partenza} onChange={(e) => { set("partenza", e.target.value); if (e.target.value > f.ritorno) set("ritorno", e.target.value); }} /></div>
          <div className="col-span-2 sm:col-span-1"><Label>Ritorno</Label><Input type="date" value={f.ritorno} min={f.partenza} onChange={(e) => set("ritorno", e.target.value)} /></div>
          <div className="col-span-2 sm:col-span-1"><Label>Persone</Label><Input type="number" inputMode="numeric" min="1" value={f.persone} onChange={(e) => set("persone", Number(e.target.value) || 1)} /></div>
        </div>
        {gg > 0 && <p className="text-[11px] text-slate-500 -mt-1">{gg} {gg === 1 ? "giorno" : "giorni"} di viaggio</p>}

        <div className="grid grid-cols-2 gap-3">
          <div><Label>Budget previsto</Label><Input type="number" inputMode="decimal" placeholder="es. 1200" value={f.budget} onChange={(e) => set("budget", e.target.value)} /></div>
          <div><Label>Valuta</Label><Select value={f.valuta} onChange={(e) => set("valuta", e.target.value)}>{["EUR", "USD", "GBP", "CHF", "JPY", "THB", "Altro"].map((v) => <option key={v}>{v}</option>)}</Select></div>

/* ---- Statistiche viaggi ---- */
function TripStats({ st, trips, expenses }) {
  const perAnno = useMemo(() => {
    const m = {};
    trips.forEach((t) => { if (!t.partenza) return; const y = t.partenza.slice(0, 4); m[y] = m[y] || { anno: y, Viaggi: 0, Spesa: 0 }; m[y].Viaggi++; });
    expenses.forEach((e) => { const y = e.data.slice(0, 4); if (m[y]) m[y].Spesa += e.importo; });
    return Object.values(m).sort((a, b) => a.anno.localeCompare(b.anno)).map((x) => ({ ...x, Spesa: Math.round(x.Spesa) }));
  }, [trips, expenses]);
  const perCat = useMemo(() => {
    const m = {};
    expenses.forEach((e) => (m[e.categoria] = (m[e.categoria] || 0) + e.importo));
    const arr = Object.entries(m).map(([k, v]) => ({ ...tripCat(k), value: Math.round(v) })).sort((a, b) => b.value - a.value);
    const max = Math.max(1, ...arr.map((a) => a.value));
    return { arr, max };
  }, [expenses]);
  const perContinente = useMemo(() => {
    const m = {};
    trips.forEach((t) => { const r = countryRegion(t.paese) || "Altro"; m[r] = (m[r] || 0) + 1; });
    return Object.entries(m).map(([k, v]) => ({ name: k, value: v, fill: { Europa: "#8B9DF9", Asia: "#5EEAD4", America: "#FCA5A5", Africa: "#FDBA74", Oceania: "#86EFAC" }[k] || "#94A3B8" }));
  }, [trips]);

  const cards = [
    { l: "Paese più visitato", v: st.topPaese ? `${countryFlag(st.topPaese[0])} ${countryLabel(st.topPaese[0])} · ${st.topPaese[1].n}` : "—" },
    { l: "Città più visitata", v: st.topCitta ? `${st.topCitta[0]} · ${st.topCitta[1]}` : "—" },
    { l: "Spesa media a viaggio", v: eur(st.mediaViaggio) },
    { l: "Spesa media giornaliera", v: eur(st.mediaGiorno) },
    { l: "Mese preferito", v: st.topMese ? `${MESI[+st.topMese[0]]} · ${st.topMese[1]} viaggi` : "—" },
    { l: "Anno con più viaggi", v: st.topAnno ? `${st.topAnno[0]} · ${st.topAnno[1]}` : "—" },
    { l: "Voli registrati", v: st.nVoli },
    { l: "Notti / hotel", v: st.nHotel },
  ];

  return (
    <div style={{ animation: "fadeUp .4s both" }}>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-5">
        {cards.map((c, i) => (
          <Card key={c.l} className="p-4" delay={i * 45}><p className="text-xs text-slate-400">{c.l}</p><p className="font-display text-base text-white mt-1 truncate">{c.v}</p></Card>
        ))}
      </div>
      <div className="grid lg:grid-cols-2 gap-5">
        <Card className="p-5" hover={false} delay={200}>
          <h2 className="font-display text-white mb-3">Viaggi e spesa per anno</h2>
          <div className="h-56">
            <ResponsiveContainer width="100%" height="100%">
              <ComposedChart data={perAnno}>
                <CartesianGrid vertical={false} stroke="rgba(255,255,255,.05)" />
                <XAxis dataKey="anno" tick={{ fill: "#64748B", fontSize: 11 }} axisLine={false} tickLine={false} />
                <YAxis tick={{ fill: "#64748B", fontSize: 11 }} axisLine={false} tickLine={false} width={44} />
                <Tooltip content={<ChartTip />} cursor={{ fill: "rgba(255,255,255,.04)" }} />
                <Bar dataKey="Spesa" fill="#8B9DF9" fillOpacity={0.85} radius={[6, 6, 0, 0]} maxBarSize={46} animationDuration={900} />
              </ComposedChart>
            </ResponsiveContainer>

        <Card className="p-5" hover={false} delay={250}>
          <h2 className="font-display text-white mb-3">Continenti esplorati</h2>

/* ============================================================
   CARRIERA — Stipendio & TFR
   Sezione puramente informativa: non tocca conti, patrimonio né budget.
   Il TFR segue le regole italiane: quota annua = RAL / 13,5, meno lo 0,50%
   di contributo al Fondo di garanzia; il montante si rivaluta ogni anno
   dell'1,5% fisso più il 75% dell'inflazione.
   ============================================================ */
const EVENT_TYPES = [
  { id: "aumento", l: "Aumento RAL", icona: "📈", colore: "#5EEAD4" },
  { id: "bonus", l: "Bonus", icona: "🎁", colore: "#FBBF24" },
  { id: "premio", l: "Premio di risultato", icona: "🏆", colore: "#A78BFA" },
  { id: "tredicesima", l: "Tredicesima", icona: "🎄", colore: "#86EFAC" },
  { id: "quattordicesima", l: "Quattordicesima", icona: "☀️", colore: "#FDBA74" },
  { id: "unatantum", l: "Una tantum", icona: "✨", colore: "#93C5FD" },
];
const evType = (id) => EVENT_TYPES.find((e) => e.id === id) || EVENT_TYPES[1];
const INFLAZIONE_DEFAULT = 2.0;

/** quota TFR annua netta dal contributo dello 0,50% */
const quotaTfrAnnua = (ral) => (ral / 13.5) - ral * 0.005;

/** simula il montante TFR anno per anno, con rivalutazione di legge */
function simulaTfr(jobs, inflazione = INFLAZIONE_DEFAULT, finoAnno = new Date().getFullYear()) {
  const attivi = (jobs || []).filter((j) => j.assunzione && j.tfrInAzienda !== false);
  if (!attivi.length) return [];
  const primoAnno = attivi.length ? Math.min(...attivi.map((j) => +String(j.assunzione || annoCorr).slice(0, 4))) : annoCorr;
  const righe = [];
  let montante = 0;
  for (let y = primoAnno; y <= finoAnno; y++) {
    /* rivalutazione sul montante di fine anno precedente */
    const tassoRival = 1.5 + 0.75 * inflazione;
    const rivalutazione = montante * (tassoRival / 100);
    let quota = 0;
    attivi.forEach((j) => {
      const inizio = new Date(j.assunzione + "T12:00");
      const fine = j.fine ? new Date(j.fine + "T12:00") : null;
      const gen = new Date(y, 0, 1), dic = new Date(y, 11, 31);
      const da = inizio > gen ? inizio : gen;
      const a = fine && fine < dic ? fine : dic;
      if (a < da) return;
      const mesi = Math.max(0, Math.round((a - da) / 86400000) / 30.44);
      quota += quotaTfrAnnua(j.ral) * Math.min(12, mesi) / 12;
    });
    montante += quota + rivalutazione;
    righe.push({ anno: String(y), Quota: Math.round(quota), Rivalutazione: Math.round(rivalutazione), Montante: Math.round(montante) });
  }
  return righe;
}

/** tutte le statistiche della carriera derivate dai dati */
function useCareerStats(jobs, events, inflazione) {
  return useMemo(() => {
    const ordinati = [...(jobs || [])].sort((a, b) => (a.assunzione || "").localeCompare(b.assunzione || ""));
    const attuale = ordinati.filter((j) => !j.fine).pop() || ordinati[ordinati.length - 1] || null;
    const annoCorr = new Date().getFullYear();

    /* RAL per anno: parte dai contratti e applica gli aumenti registrati */
    const perAnno = {};
    ordinati.forEach((j) => {
      const y0 = +(j.assunzione || `${annoCorr}`).slice(0, 4);
      const y1 = j.fine ? +String(j.fine).slice(0, 4) : annoCorr;
      for (let y = y0; y <= y1; y++) perAnno[y] = { anno: String(y), RAL: j.ral, azienda: j.azienda, Netto: j.netto * (j.mensilita || 13), Bonus: 0 };
    });
    (events || []).forEach((e) => {
      const y = +String(e.data || "").slice(0, 4);
      if (!y) return;
      if (!perAnno[y]) return;
      if (e.tipo === "aumento" && e.ralDopo) {
        for (let k = y; k <= annoCorr; k++) if (perAnno[k]) perAnno[k].RAL = e.ralDopo;
      } else perAnno[y].Bonus += e.importo;
    });
    const serie = Object.values(perAnno).sort((a, b) => a.anno.localeCompare(b.anno))
      .map((r) => ({ ...r, RAL: Math.round(r.RAL), Netto: Math.round(r.Netto), Bonus: Math.round(r.Bonus), Totale: Math.round(r.RAL + r.Bonus) }));

    const primo = serie[0], ultimo = serie[serie.length - 1];
    const crescitaTot = primo && ultimo && primo.RAL ? ((ultimo.RAL - primo.RAL) / primo.RAL) * 100 : 0;
    const anni = serie.length > 1 ? serie.length - 1 : 0;
    const cagr = primo?.RAL && ultimo?.RAL && anni ? (Math.pow(ultimo.RAL / primo.RAL, 1 / anni) - 1) * 100 : 0;
    const precedente = serie[serie.length - 2];
    const varAnno = precedente?.RAL ? ((ultimo.RAL - precedente.RAL) / precedente.RAL) * 100 : 0;
    const bonusAnno = ultimo?.Bonus || 0;
    const aumenti = (events || []).filter((e) => e.tipo === "aumento").sort((a, b) => b.data.localeCompare(a.data));
    /* la RAL da usare è quella aggiornata dagli aumenti, non quella del contratto originale */
    const ralCorrente = ultimo?.RAL || attuale?.ral || 0;
    const jobsAggiornati = (jobs || []).map((j) => (attuale && j.id === attuale.id ? { ...j, ral: ralCorrente } : j));
    const tfr = simulaTfr(jobsAggiornati, inflazione);
    const tfrOggi = tfr.length ? tfr[tfr.length - 1].Montante : 0;
    /* proiezione a 5 anni con la RAL attuale */
    const proiezione = [...tfr];
    if (attuale) {
      let m = tfrOggi;
      for (let i = 1; i <= 5; i++) {
        const q = quotaTfrAnnua(ralCorrente);
        m = m * (1 + (1.5 + 0.75 * inflazione) / 100) + q;
        proiezione.push({ anno: String(annoCorr + i), Quota: Math.round(q), Montante: Math.round(m), stima: true });
      }
    }
    const mesiTotali = ordinati.reduce((s, j) => {
      const a = new Date(j.assunzione + "T12:00"), b = j.fine ? new Date(j.fine + "T12:00") : new Date();
      return s + Math.max(0, (b - a) / 86400000 / 30.44);
    }, 0);
    return { ordinati, attuale, ralCorrente, serie, crescitaTot, cagr, varAnno, bonusAnno, aumenti, tfr, tfrOggi, proiezione, anniCarriera: mesiTotali / 12 };
  }, [jobs, events, inflazione]);
}

/* ============================================================
   CARRIERA — stipendio mese per mese e TFR
   I dati di questa sezione non entrano mai nel patrimonio:
   servono solo ad analizzare l'andamento della retribuzione.
   ============================================================ */
const VOCI_BUSTA = [
  { k: "lordo", l: "Lordo", tone: "#93C5FD" },
  { k: "netto", l: "Netto", tone: "#5EEAD4" },
  { k: "bonus", l: "Bonus", tone: "#FBBF24" },
  { k: "straordinari", l: "Straordinari", tone: "#A78BFA" },
  { k: "rimborsi", l: "Rimborsi spese", tone: "#38BDF8" },
  { k: "premio", l: "Premio", tone: "#F472B6" },
  { k: "tredicesima", l: "Tredicesima", tone: "#86EFAC" },
  { k: "quattordicesima", l: "Quattordicesima", tone: "#FDBA74" },
  { k: "altre", l: "Altre competenze", tone: "#C4B5FD" },
  { k: "trattenute", l: "Trattenute", tone: "#FB7185" },
];
/* quanto entra davvero in tasca in quel mese */
const nettoTotale = (p) => (p.lordo || 0) + (p.bonus || 0) + (p.straordinari || 0) + (p.rimborsi || 0) + (p.premio || 0) + (p.tredicesima || 0) + (p.quattordicesima || 0) + (p.altre || 0) - (p.trattenute || 0);
const TFR_DIVISORE = 13.5;      // quota annua di TFR = retribuzione / 13,5
const TFR_CONTRIBUTO = 0.005;   // 0,5% trattenuto per il fondo di garanzia INPS
const TFR_RIVAL_BASE = 0.015;   // rivalutazione annua: 1,5% fisso + 75% dell'inflazione

/** quota di TFR maturata in un mese su una certa retribuzione lorda */
const tfrMensile = (lordoAnnuo) => (lordoAnnuo / TFR_DIVISORE - lordoAnnuo * TFR_CONTRIBUTO) / 12;

function useCarrieraStats(data, anno) {
  return useMemo(() => {
    const jobs = data.jobs || [];
    const payslips = [...(data.payslips || [])].sort((a, b) => a.mese.localeCompare(b.mese));
    const tfrManuali = data.tfrEntries || [];
    const jobById = Object.fromEntries(jobs.map((j) => [j.id, j]));
    const annoStr = String(anno);

    /* --- serie mensile dell'anno scelto --- */
    const mesiAnno = MESI.map((label, m) => {
      const mk = mkOf(anno, m);
      const p = payslips.find((x) => x.mese === mk);
      return {
        mk, mese: label,
        Lordo: p ? Math.round((p.lordo || 0) * 100) / 100 : 0,
        Netto: p ? Math.round(nettoTotale(p) * 100) / 100 : 0,
        Base: p ? Math.round((p.netto || 0) * 100) / 100 : 0,
        Extra: p ? Math.round((nettoTotale(p) - (p.netto || 0)) * 100) / 100 : 0,
        busta: p || null,
        futuro: anno === new Date().getFullYear() && m > new Date().getMonth(),
      };
    });
    const conDati = mesiAnno.filter((x) => x.busta);
    const totLordo = conDati.reduce((s, x) => s + x.Lordo, 0);
    const totNetto = conDati.reduce((s, x) => s + x.Netto, 0);
    const mediaNetto = conDati.length ? totNetto / conDati.length : 0;
    const mediaLordo = conDati.length ? totLordo / conDati.length : 0;
    /* extra e prelievo fiscale stimato (lordo meno netto base) */
    const bustePeriodo = conDati.map((x) => x.busta);
    const totBonus = bustePeriodo.reduce((s, b) => s + (b.bonus || 0) + (b.premio || 0), 0);
    const mesiConBonus = bustePeriodo.filter((b) => (b.bonus || 0) + (b.premio || 0) > 0).length;
    const mediaBonus = mesiConBonus ? totBonus / mesiConBonus : 0;
    const totStraordinari = bustePeriodo.reduce((s, b) => s + (b.straordinari || 0), 0);
    const totRimborsi = bustePeriodo.reduce((s, b) => s + (b.rimborsi || 0), 0);
    const totTrattenute = bustePeriodo.reduce((s, b) => s + (b.trattenute || 0), 0);
    const nettoBase = bustePeriodo.reduce((s, b) => s + (b.netto || 0), 0);
    const tasseStimate = Math.max(0, totLordo - nettoBase);
    const aliquota = totLordo > 0 ? (tasseStimate / totLordo) * 100 : 0;

    /* --- confronto anno per anno --- */
    const perAnno = {};
    payslips.forEach((p) => {
      const y = p.mese.slice(0, 4);
      const a = (perAnno[y] = perAnno[y] || { anno: y, Lordo: 0, Netto: 0, mesi: 0 });
      a.Lordo += p.lordo || 0; a.Netto += nettoTotale(p); a.mesi++;
    });
    const anni = Object.values(perAnno)
      .map((a) => ({ ...a, Lordo: Math.round(a.Lordo * 100) / 100, Netto: Math.round(a.Netto * 100) / 100, mediaNetto: a.Netto / a.mesi }))
      .sort((a, b) => a.anno.localeCompare(b.anno));
    const idx = anni.findIndex((a) => a.anno === annoStr);
    const prec = idx > 0 ? anni[idx - 1] : null;
    const cur = anni[idx] || null;
    const crescita = cur && prec && prec.Netto ? ((cur.Netto - prec.Netto) / prec.Netto) * 100 : null;

    /* --- TFR: calcolato dalle buste paga, con override manuali --- */
    const tuttiMesi = [...new Set([...payslips.map((p) => p.mese), ...tfrManuali.map((t) => t.mese)])].sort();
    const tfrSerie = [];
    let cumulato = 0;
    tuttiMesi.forEach((mk) => {
      const manuale = tfrManuali.find((t) => t.mese === mk);
      const p = payslips.find((x) => x.mese === mk);
      const job = p ? jobById[p.jobId] : jobs[0];
      const baseAnnua = p?.ral > 0 ? p.ral : p ? (p.lordo || 0) * 12 : job?.ral || 0;
      const maturato = manuale?.manuale ? manuale.maturato
        : p?.tfr > 0 ? p.tfr                                   // valore scritto nella busta paga
        : Math.round(tfrMensile(baseAnnua) * 100) / 100;
      const riv = manuale?.rivalutazione ?? Math.round((cumulato * (TFR_RIVAL_BASE / 12)) * 100) / 100;
      const anticipo = manuale?.anticipo || 0;
      const liquidazione = manuale?.liquidazione || 0;
      cumulato = cumulato + maturato + riv - anticipo - liquidazione;
      tfrSerie.push({ mk, mese: labelMkShort(mk), maturato, rivalutazione: riv, anticipo, liquidazione, totale: Math.round(cumulato * 100) / 100, manuale: !!manuale?.manuale });
    });
    const tfrTotale = cumulato;
    const tfrAnno = tfrSerie.filter((t) => t.mk.startsWith(annoStr));
    const tfrMaturatoAnno = Math.round(tfrAnno.reduce((s, t) => s + t.maturato, 0) * 100) / 100;
    const tfrAnticipi = tfrSerie.reduce((s, t) => s + t.anticipo + t.liquidazione, 0);

    /* stima a fine anno in corso, sulla base della media mensile */
    const mediaTfrMese = tfrSerie.length ? tfrSerie.slice(-12).reduce((s, t) => s + t.maturato, 0) / Math.min(12, tfrSerie.length) : 0;
    const proiezione = Array.from({ length: 5 }, (_, i) => {
      const y = new Date().getFullYear() + i;
      return { anno: String(y), Stimato: Math.round(tfrTotale + mediaTfrMese * 12 * i * (1 + TFR_RIVAL_BASE) ) };
    });

    const anniDisponibili = [...new Set([...payslips.map((p) => +p.mese.slice(0, 4)), new Date().getFullYear()])].sort((a, b) => b - a);
    return { jobs, jobById, payslips, mesiAnno, conDati, totLordo, totNetto, mediaNetto, mediaLordo, totBonus, mediaBonus, totStraordinari, totRimborsi, totTrattenute, tasseStimate, aliquota, anni, cur, prec, crescita, tfrSerie, tfrTotale, tfrMaturatoAnno, tfrAnticipi, mediaTfrMese, proiezione, anniDisponibili, tfrAnno };
  }, [data, anno]);
}

function CarrieraPage({ data, update, notify, setConfirmDlg }) {
  const [tab, setTab] = useState("stipendio");
  const [anno, setAnno] = useState(new Date().getFullYear());
  const [bustaEdit, setBustaEdit] = useState(null);
  const [jobEdit, setJobEdit] = useState(null);
  const [tfrEdit, setTfrEdit] = useState(null);
  const [genOpen, setGenOpen] = useState(false);
  const st = useCarrieraStats(data, anno);
  const jobAttivo = st.jobs.find((j) => !j.fine) || st.jobs[0];

  const salvaBusta = (b) => {
    update((d) => {
      if (!d.payslips) d.payslips = [];
      const i = d.payslips.findIndex((x) => x.id === b.id);
      if (i >= 0) d.payslips[i] = b; else d.payslips.push({ ...b, id: b.id || uid() });
      d.payslips.sort((a, x) => a.mese.localeCompare(x.mese));
      return d;
    });
    setBustaEdit(null);
    notify(`Busta paga di ${labelMk(b.mese).toLowerCase()} salvata`);
  };
  const eliminaBusta = (b) => setConfirmDlg({
    msg: `Eliminare la busta paga di ${labelMk(b.mese).toLowerCase()}?`,
    onOk: () => { cedoliniStore.elimina(b.id); update((d) => { d.payslips = d.payslips.filter((x) => x.id !== b.id); return d; }); notify("Busta paga eliminata"); },
  });

  /* generazione automatica: crea i mesi mancanti dell'anno partendo da RAL e netto medio */
  const generaAnno = ({ jobId, ral, mensilita, netto, sovrascrivi }) => {
    update((d) => {
      if (!d.payslips) d.payslips = [];
      const lordoMese = ral / mensilita;
      const oggi = new Date();
      for (let m = 0; m < 12; m++) {
        const mk = mkOf(anno, m);
        if (anno === oggi.getFullYear() && m > oggi.getMonth()) continue;   // niente mesi futuri
        const esistente = d.payslips.find((p) => p.mese === mk);
        if (esistente && !sovrascrivi) continue;
        if (esistente && !esistente.auto && !sovrascrivi) continue;          // mai sovrascrivere il lavoro manuale
        const rec = {
          id: esistente?.id || uid(), jobId, mese: mk, auto: true,
          ral, lordo: Math.round(lordoMese * 100) / 100, netto: Math.round(netto * 100) / 100, tfr: 0,
          cedolino: esistente?.cedolino || null,
          bonus: 0, straordinari: 0, rimborsi: 0, premio: 0,
          tredicesima: mensilita >= 13 && m === 11 ? Math.round(netto * 100) / 100 : 0,
          quattordicesima: mensilita >= 14 && m === 5 ? Math.round(netto * 100) / 100 : 0,
          altre: 0, trattenute: 0, note: "Generata automaticamente",
        };
        if (esistente) Object.assign(esistente, rec); else d.payslips.push(rec);
      }
      d.payslips.sort((a, x) => a.mese.localeCompare(x.mese));
      return d;
    });
    setGenOpen(false);
    notify(`Mesi del ${anno} generati · puoi modificarli uno per uno`);
  };

  /* collega i PDF trovati su Drive ai mesi corrispondenti, creando le buste mancanti */
  const onImporta = (abbinamenti) => {
    update((d) => {
      if (!d.payslips) d.payslips = [];
      abbinamenti.forEach(({ mese, file }) => {
        let p = d.payslips.find((x) => x.mese === mese);
        if (!p) {
          p = { id: uid(), jobId: d.jobs?.[0]?.id || "", mese, ral: 0, lordo: 0, netto: 0, bonus: 0, straordinari: 0, rimborsi: 0, premio: 0, tredicesima: 0, quattordicesima: 0, altre: 0, trattenute: 0, tfr: 0, auto: false, note: "Creata dall'importazione" };
          d.payslips.push(p);
        }
        p.cedolino = { tipo: "drive", driveFileId: file.id, nome: file.name, mime: file.mimeType, dimensione: Number(file.size) || 0, dataCaricamento: (file.createdTime || "").slice(0, 10) };
      });
      d.payslips.sort((a, x) => a.mese.localeCompare(x.mese));
      return d;
    });
    notify(`${abbinamenti.length} cedolini collegati`);
  };

  const salvaTfr = (t) => {
    update((d) => {
      if (!d.tfrEntries) d.tfrEntries = [];
      const i = d.tfrEntries.findIndex((x) => x.mese === t.mese);
      const rec = { ...t, id: t.id || uid(), manuale: true };
      if (i >= 0) d.tfrEntries[i] = rec; else d.tfrEntries.push(rec);
      d.tfrEntries.sort((a, x) => a.mese.localeCompare(x.mese));
      return d;
    });
    setTfrEdit(null);
    notify("Dato TFR aggiornato");
  };
  const salvaJob = (j) => {
    update((d) => {
      if (!d.jobs) d.jobs = [];
      const i = d.jobs.findIndex((x) => x.id === j.id);
      if (i >= 0) d.jobs[i] = j; else d.jobs.push({ ...j, id: j.id || uid() });
      return d;
    });
    setJobEdit(null);
    notify("Contratto salvato");
  };

  return (
    <div className="max-w-5xl mx-auto">
      <header className="mb-5 flex items-end justify-between gap-3 flex-wrap" style={{ animation: "fadeUp .5s both" }}>
        <div>
          <p className="text-xs uppercase tracking-[0.2em] text-slate-500">Carriera</p>
          <h1 className="font-display text-xl sm:text-2xl text-white mt-1">Stipendio e TFR</h1>
          <p className="text-xs text-slate-500 mt-1">Sezione informativa: non modifica in alcun modo conti e patrimonio.</p>
        </div>
        <div className="flex gap-2 items-center flex-wrap">
          <div className="flex gap-1 bg-white/5 rounded-xl p-1">
            {[{ v: "stipendio", l: "Stipendio" }, { v: "tfr", l: "TFR" }, { v: "contratti", l: "Contratti" }].map((t) => (
              <button key={t.v} onClick={() => setTab(t.v)} className={`px-3 py-1.5 rounded-lg text-xs transition-all ${tab === t.v ? "bg-white/15 text-white" : "text-slate-400 hover:text-white"}`}>{t.l}</button>
            ))}
          </div>
        </div>
      </header>

      {/* selettore anno comune a tutti i grafici */}
      <div className="flex items-center gap-1 bg-white/5 border border-white/10 rounded-xl p-1 mb-4 w-fit flex-wrap" style={{ animation: "fadeUp .5s both", animationDelay: "40ms" }}>
        <button onClick={() => setAnno((y) => y - 1)} className="w-8 h-8 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition-all">◀</button>
        {st.anniDisponibili.slice(0, 5).sort((a, b) => a - b).map((y) => (
          <button key={y} onClick={() => setAnno(y)} className={`px-2.5 py-1.5 rounded-lg text-xs transition-all ${anno === y ? "bg-white/15 text-white" : "text-slate-500 hover:text-white"}`}>{y}</button>
        ))}
        <button onClick={() => setAnno((y) => y + 1)} className="w-8 h-8 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition-all">▶</button>
      </div>

      {tab === "stipendio" && <SezioneStipendio {...{ st, anno, setBustaEdit, eliminaBusta, setGenOpen, jobAttivo, onImporta }} />}
      {tab === "tfr" && <SezioneTfr {...{ st, anno, setTfrEdit }} />}
      {tab === "contratti" && <SezioneContratti {...{ st, setJobEdit, setConfirmDlg, update, notify }} />}

      <BustaModal open={!!bustaEdit} busta={bustaEdit} jobs={st.jobs} anno={anno} onClose={() => setBustaEdit(null)} onSave={salvaBusta} notify={notify} />
      <GeneraAnnoModal open={genOpen} anno={anno} jobs={st.jobs} jobAttivo={jobAttivo} onClose={() => setGenOpen(false)} onGenera={generaAnno} />
      <TfrModal open={!!tfrEdit} voce={tfrEdit} onClose={() => setTfrEdit(null)} onSave={salvaTfr} />
      <JobModal open={!!jobEdit} job={jobEdit} onClose={() => setJobEdit(null)} onSave={salvaJob} />
    </div>
  );
}

function SezioneStipendio({ st, anno, setBustaEdit, eliminaBusta, setGenOpen, jobAttivo, onImporta }) {
  const [importOpen, setImportOpen] = useState(false);
  const [vista, setVista] = useState("mensile");   // mensile | anni
  const [cedolinoAperto, setCedolinoAperto] = useState(null);   // { valore, dati }
  const apriCedolino = async (b) => {
    const dati = b.cedolino?.tipo === "file" ? await cedoliniStore.leggi(b.id) : null;
    setCedolinoAperto({ valore: { ...b.cedolino, nome: b.cedolino?.nome || `Cedolino ${labelMk(b.mese)}` }, dati });
  };
  // Calcolo proporzionale per dividere il netto e le trattenute (MESE)
  const chartDataMesi = useMemo(() => {
    return st.mesiAnno.map((m) => {
      const b = m.busta;
      if (!b) return { ...m, nettoBase: 0, nettoExtra: 0, trattBase: 0, trattExtra: 0 };
      
      const lordoBase = b.lordo || 0;
      const lordoExtraTassabile = (b.bonus || 0) + (b.straordinari || 0) + (b.premio || 0) + (b.tredicesima || 0) + (b.quattordicesima || 0) + (b.altre || 0);
      const rimborsi = b.rimborsi || 0; 
      
      const lordoTotaleTassabile = lordoBase + lordoExtraTassabile;
      const trattenute = b.trattenute || 0;
      
      let trattBase = 0, trattExtra = 0;
      if (lordoTotaleTassabile > 0) {
        trattBase = (lordoBase / lordoTotaleTassabile) * trattenute;
        trattExtra = (lordoExtraTassabile / lordoTotaleTassabile) * trattenute;
      }
      
      return {
        ...m,
        nettoBase: Math.round((lordoBase - trattBase) * 100) / 100,
        nettoExtra: Math.round((lordoExtraTassabile - trattExtra + rimborsi) * 100) / 100,
        trattBase: Math.round(trattBase * 100) / 100,
        trattExtra: Math.round(trattExtra * 100) / 100,
      };
    });
  }, [st.mesiAnno]);

  // Calcolo proporzionale per dividere il netto e le trattenute (ANNO)
  const chartDataAnni = useMemo(() => {
    const map = {};
    (st.payslips || []).forEach((b) => {
      const y = b.mese.slice(0, 4);
      if (!map[y]) map[y] = { anno: y, lordoBase: 0, lordoExtra: 0, rimborsi: 0, trattenute: 0 };
      
      map[y].lordoBase += b.lordo || 0;
      map[y].lordoExtra += (b.bonus || 0) + (b.straordinari || 0) + (b.premio || 0) + (b.tredicesima || 0) + (b.quattordicesima || 0) + (b.altre || 0);
      map[y].rimborsi += b.rimborsi || 0;
      map[y].trattenute += b.trattenute || 0;
    });

    return Object.values(map).sort((a, b) => a.anno.localeCompare(b.anno)).map((y) => {
      const lordoTotaleTassabile = y.lordoBase + y.lordoExtra;
      let trattBase = 0, trattExtra = 0;
      if (lordoTotaleTassabile > 0) {
        trattBase = (y.lordoBase / lordoTotaleTassabile) * y.trattenute;
        trattExtra = (y.lordoExtra / lordoTotaleTassabile) * y.trattenute;
      }
      
      return {
        anno: y.anno,
        nettoBase: Math.round((y.lordoBase - trattBase) * 100) / 100,
        nettoExtra: Math.round((y.lordoExtra - trattExtra + y.rimborsi) * 100) / 100,
        trattExtra: Math.round(trattExtra * 100) / 100,
        trattBase: Math.round(trattBase * 100) / 100,
      };
    });
  }, [st.payslips]);
  return (
    <div style={{ animation: "fadeUp .4s both" }}>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-5">
        {[
          { l: `Totale percepito ${anno}`, v: eur(st.totNetto), sub: `${st.conDati.length} mesi registrati`, tone: "text-teal-300" },
          { l: `Lordo ${anno}`, v: eur(st.totLordo), sub: st.cur ? `media ${eur(st.mediaLordo)}/mese` : "—", tone: "text-sky-300" },
          { l: "Netto medio", v: eur(st.mediaNetto), sub: "per mese registrato", tone: "text-white" },
          { l: "Rispetto all'anno prima", v: st.crescita != null ? `${st.crescita >= 0 ? "+" : ""}${st.crescita.toFixed(1)}%` : "—", sub: st.prec ? `${anno - 1}: ${eur(st.prec.Netto)}` : "nessun confronto", tone: st.crescita >= 0 ? "text-emerald-300" : "text-rose-300" },
          { l: "Bonus e premi", v: eur(st.totBonus), sub: st.mediaBonus > 0 ? `media ${eur(st.mediaBonus)} quando c'è` : "nessuno quest'anno", tone: "text-amber-300" },
          { l: "Straordinari", v: eur(st.totStraordinari), sub: st.totRimborsi > 0 ? `+ ${eur(st.totRimborsi)} di rimborsi` : "nessun rimborso", tone: "text-violet-300" },
          { l: "Tasse e contributi stimati", v: eur(st.tasseStimate), sub: `circa il ${st.aliquota.toFixed(0)}% del lordo`, tone: "text-rose-300" },
          { l: "TFR maturato nell'anno", v: eur(st.tfrMaturatoAnno), sub: `totale ${eur(st.tfrTotale)}`, tone: "text-emerald-300" },
        ].map((s, i) => (
          <Card key={s.l} className="p-4" delay={i * 45}>

                style={{ animation: "fadeUp .35s both", animationDelay: `${Math.min(i, 12) * 25}ms` }}>
                <span className="w-16 sm:w-24 text-sm text-slate-300 shrink-0">{labelMk(m.mk).split(" ")[0]}</span>
                {b ? (
                  <>

                      <p className="text-sm text-white">
                        <span className="text-slate-500 text-[11px] mr-1.5">Netto:</span>
                        <b className="tabular-nums font-display text-base">{eur(nettoTotale(b))}</b>
                        {b.lordo > 0 && <span className="text-[11px] text-slate-500 ml-2">lordo {eur(b.lordo)}</span>}
                      </p>
                      <p className="text-[11px] mt-0.5 flex items-center gap-1.5 flex-wrap">
                        {b.cedolino ? (
                          <button onClick={(e) => { e.stopPropagation(); apriCedolino(b); }} className="text-emerald-300/90 hover:text-emerald-200 transition-colors">Cedolino disponibile ✅</button>
                        ) : (
                          <span className="text-slate-600">Nessun cedolino</span>
                        )}
                        {(b.bonus > 0 || b.premio > 0) && <span className="text-amber-300/80">· bonus {eur(b.bonus + b.premio)}</span>}
                        {b.tredicesima > 0 && <span className="text-emerald-300/70">· 13ª</span>}
                        {b.quattordicesima > 0 && <span className="text-emerald-300/70">· 14ª</span>}
                        {b.straordinari > 0 && <span className="text-violet-300/70">· straord. {eur(b.straordinari)}</span>}
                        {b.auto && <span className="text-slate-600">· generata</span>}
                      </p>
                    </div>
                    <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity shrink-0">
                      <button onClick={(e) => { e.stopPropagation(); setBustaEdit(b); }} title="Modifica" className="w-7 h-7 rounded-lg bg-white/5 hover:bg-white/10 text-xs transition-all">✎</button>
                      <button onClick={(e) => { e.stopPropagation(); eliminaBusta(b); }} title="Elimina" className="w-7 h-7 rounded-lg bg-white/5 hover:bg-rose-500/20 text-xs hover:text-rose-300 transition-all">🗑</button>
                    </div>
                  </>
                ) : (
                  <span className="text-xs text-slate-600">{m.futuro ? "—" : "tocca per inserire"}</span>
                )}
              </div>
            );
          })}
        </div>
      </Card>
    </div>
  );
}
