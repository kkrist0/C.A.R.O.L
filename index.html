const MESI = ["Gen", "Feb", "Mar", "Apr", "Mag", "Giu", "Lug", "Ago", "Set", "Ott", "Nov", "Dic"];

function Report({ txs, catById, monthStats, patrimonio, data, update }) {
  const [showTr, setShowTr] = useState(false);
  const nowMk = monthKey(new Date());
  const curYear = new Date().getFullYear();

  /* ---- filtro periodo: mese / anno / intervallo ---- */
  const saved = data.settings?.lastReportPeriod || {};
  const [mode, setMode] = useState(saved.mode || "mese");
  const [pMk, setPMk] = useState(saved.pMk || nowMk);
  const [pYear, setPYear] = useState(saved.pYear || curYear);
  const [pFrom, setPFrom] = useState(saved.pFrom || mkOf(curYear, 0));
  const [pTo, setPTo] = useState(saved.pTo || nowMk);
  const [year, setYear] = useState(saved.pYear || curYear); // sezione annuale
  const [compare, setCompare] = useState(false);

  /* memorizza l'ultimo periodo del report */
  useEffect(() => {
    const p = { mode, pMk, pYear, pFrom, pTo };
    const old = data.settings?.lastReportPeriod;
    if (JSON.stringify(old) !== JSON.stringify(p)) update((d) => { d.settings.lastReportPeriod = p; return d; });
  }, [mode, pMk, pYear, pFrom, pTo]); // eslint-disable-line
  useEffect(() => { if (mode === "anno") setYear(pYear); }, [mode, pYear]);

  /* mesi del periodo selezionato */
  const periodMonths = useMemo(() => {
    if (mode === "mese") return [pMk];
    if (mode === "anno") return MESI.map((_, m) => mkOf(pYear, m));
    let a = pFrom, b = pTo;
    if (a > b) [a, b] = [b, a];
    const out = [];
    let mk = a;
    while (mk <= b && out.length < 72) { out.push(mk); mk = addMonthsMk(mk, 1); }
    return out;
  }, [mode, pMk, pYear, pFrom, pTo]);
  const periodSet = useMemo(() => new Set(periodMonths), [periodMonths]);
  const periodEndIso = endOfMonthIso(periodMonths[periodMonths.length - 1]);
  const periodLabel = mode === "mese" ? labelMk(pMk) : mode === "anno" ? `Anno ${pYear}` : `${labelMk(periodMonths[0])} → ${labelMk(periodMonths[periodMonths.length - 1])}`;

  /* patrimonio a una certa data */
  const base0 = useMemo(() => (data?.accounts || []).reduce((s, a) => s + a.saldoIniziale, 0), [data]);
  const patAt = useCallback((iso) => base0 + txs.filter((t) => t.data <= iso).reduce((s, t) => s + (t.tipo === "entrata" ? t.importo : t.tipo === "spesa" ? -t.importo : 0), 0), [base0, txs]);

  /* statistiche aggregate del periodo */
  const pStats = useMemo(() => {
    const per = periodMonths.map((mk) => ({ mk, ...monthStats(mk) }));
    const entrate = per.reduce((s, x) => s + x.entrate, 0);
    const uscite = per.reduce((s, x) => s + x.uscite, 0);
    const inv = per.reduce((s, x) => s + x.inv, 0);
    return { per, entrate, uscite, inv, risparmio: entrate - uscite - inv };
  }, [periodMonths, monthStats]);

  /* barre mensili del periodo */
  const barsData = useMemo(() => pStats.per.map((x) => {
    const trasf = txs.filter((t) => t.tipo === "trasferimento" && monthKey(t.data) === x.mk).reduce((s, t) => s + t.importo, 0);
    return { mese: periodMonths.length > 12 ? labelMkShort(x.mk) : MESI[parseMk(x.mk).m] + (mode === "intervallo" ? " " + String(parseMk(x.mk).y).slice(2) : ""), Entrate: x.entrate, Uscite: x.uscite, Trasferiti: trasf };
  }), [pStats, txs, periodMonths, mode]);

  /* donut categorie del periodo */
  const donut = useMemo(() => {
    const m = {};
    txs.filter((t) => t.tipo === "spesa" && periodSet.has(monthKey(t.data))).forEach((t) => (m[t.categoria] = (m[t.categoria] || 0) + t.importo));
    return Object.entries(m).map(([k, v]) => ({ name: catById[k]?.nome || "Senza categoria", value: Math.round(v), fill: catById[k]?.colore || "#8B9DF9" })).sort((a, b) => b.value - a.value).slice(0, 8);
  }, [txs, catById, periodSet]);

  /* heatmap giorno per giorno (solo modalità mese) */
  const heat = useMemo(() => {
    if (mode !== "mese") return null;
    const { y, m } = parseMk(pMk);
    const daysIn = new Date(y, m + 1, 0).getDate();
    const arr = Array.from({ length: daysIn }, (_, i) => ({ d: i + 1, v: 0 }));
    txs.filter((t) => t.tipo === "spesa" && monthKey(t.data) === pMk).forEach((t) => { arr[new Date(t.data + "T12:00:00").getDate() - 1].v += t.importo; });
    const max = Math.max(1, ...arr.map((x) => x.v));
    return { arr, max };
  }, [txs, mode, pMk]);

  /* confronto stesso mese anno precedente (modalità mese) */
  const yoy = useMemo(() => {
    if (mode !== "mese") return null;
    const { y, m } = parseMk(pMk);
    const prevMk = mkOf(y - 1, m);
    const a = monthStats(pMk), b = monthStats(prevMk);
    if (b.entrate === 0 && b.uscite === 0) return null;
    return { prevMk, dSpese: a.uscite - b.uscite, pctSpese: b.uscite > 0 ? ((a.uscite - b.uscite) / b.uscite) * 100 : null, dEntrate: a.entrate - b.entrate };
  }, [mode, pMk, monthStats]);

  const mediaGiorn = useMemo(() => {
    if (mode !== "mese") return null;
    const { y, m } = parseMk(pMk);
    const days = pMk === nowMk ? new Date().getDate() : new Date(y, m + 1, 0).getDate();
    return pStats.uscite / Math.max(1, days);
  }, [mode, pMk, pStats, nowMk]);

  /* ---- sezione annuale (come prima, con anni 2024-2028) ---- */
  const years = useMemo(() => {
    const ys = new Set(txs.map((t) => Number(t.data.slice(0, 4))));
    for (let y = YEAR_MIN; y <= YEAR_MAX; y++) ys.add(y);
    return [...ys].sort((a, b) => b - a);
  }, [txs]);

  const annual = useMemo(() => {
    const now = new Date();
    const upTo = year === now.getFullYear() ? now.getMonth() : 11;
    const rows = MESI.map((label, m) => {
      const s = monthStats(mkOf(year, m));
      return { m, mese: label, Entrate: s.entrate, Spese: s.uscite, Investimenti: s.inv, Risparmio: s.risparmio, futuro: year === now.getFullYear() && m > upTo };
    });
    const attivi = rows.filter((r) => !r.futuro);
    const totSpese = attivi.reduce((s, r) => s + r.Spese, 0);
    const totEntrate = attivi.reduce((s, r) => s + r.Entrate, 0);
    const totInv = attivi.reduce((s, r) => s + r.Investimenti, 0);
    const conDati = attivi.filter((r) => r.Spese > 0 || r.Entrate > 0);
    const maxSpesa = conDati.length ? conDati.reduce((a, b) => (b.Spese > a.Spese ? b : a)) : null;
    const maxRisp = conDati.length ? conDati.reduce((a, b) => (b.Risparmio > a.Risparmio ? b : a)) : null;
    const media = conDati.length ? totSpese / (upTo + 1) : 0;
    const spese = txs.filter((t) => t.tipo === "spesa" && t.data.startsWith(String(year)));
    const byCatSum = {}, byCatCount = {};
    spese.forEach((t) => { byCatSum[t.categoria] = (byCatSum[t.categoria] || 0) + t.importo; byCatCount[t.categoria] = (byCatCount[t.categoria] || 0) + 1; });
    const topSum = Object.entries(byCatSum).sort((a, b) => b[1] - a[1])[0];
    const topCount = Object.entries(byCatCount).sort((a, b) => b[1] - a[1])[0];
    const patEnd = patAt(year === now.getFullYear() ? todayISO() : endOfMonthIso(mkOf(year, 11)));
    const patEndPrev = patAt(endOfMonthIso(mkOf(year - 1, 11)));
    return { rows, totSpese, totEntrate, totInv, risparmioTot: totEntrate - totSpese - totInv, media, maxSpesa, maxRisp, topSum, topCount, patEnd, patEndPrev };
  }, [year, monthStats, txs, patAt]);

  const patSeries = useMemo(() => {
    const now = new Date();
    const patStart = patAt(endOfMonthIso(mkOf(year - 1, 11)));
    return MESI.map((label, m) => {
      const isFuture = year === now.getFullYear() && m > now.getMonth();
      const p = isFuture ? null : patAt(endOfMonthIso(mkOf(year, m)));
      const row = { mese: label, [String(year)]: p, "Risparmio accumulato": p == null ? null : Math.round(p - patStart) };
      if (compare) {
        const prevFuture = year - 1 === now.getFullYear() && m > now.getMonth();
        row[String(year - 1)] = prevFuture ? null : patAt(endOfMonthIso(mkOf(year - 1, m)));
      }
      return row;
    });
  }, [year, compare, patAt]);

  const crescita = annual.patEnd - annual.patEndPrev;
  const crescitaPct = annual.patEndPrev !== 0 ? (crescita / Math.abs(annual.patEndPrev)) * 100 : null;

  return (
    <div className="max-w-5xl mx-auto">
      <header className="mb-5" style={{ animation: "fadeUp .5s both" }}>
        <p className="text-xs uppercase tracking-[0.2em] text-slate-500">Report</p>
        <h1 className="font-display text-xl sm:text-2xl text-white mt-1">Analisi e tendenze</h1>
      </header>

      {/* filtro periodo */}
      <Card className="p-4 mb-5" hover={false} delay={40}>
        <div className="flex flex-wrap items-center gap-3">
          <div className="flex gap-1 bg-white/5 rounded-xl p-1">
            {[{ v: "mese", l: "Mese" }, { v: "anno", l: "Anno" }, { v: "intervallo", l: "Intervallo" }].map((t) => (
              <button key={t.v} onClick={() => setMode(t.v)} className={`px-3 py-1.5 rounded-lg text-xs transition-all ${mode === t.v ? "bg-white/15 text-white" : "text-slate-400 hover:text-white"}`}>{t.l}</button>
            ))}
          </div>
          {mode === "mese" && <MonthNavigator value={pMk} onChange={setPMk} />}
          {mode === "anno" && (
            <div className="flex items-center gap-1 bg-white/5 border border-white/10 rounded-xl p-1">
              <button onClick={() => setPYear((y) => Math.max(YEAR_MIN, y - 1))} disabled={pYear <= YEAR_MIN} className="w-8 h-8 rounded-lg grid place-items-center text-slate-400 hover:text-white hover:bg-white/10 disabled:opacity-30 transition-all">◀</button>
              {Array.from({ length: YEAR_MAX - YEAR_MIN + 1 }, (_, i) => YEAR_MIN + i).map((y) => (
                <button key={y} onClick={() => setPYear(y)} className={`px-2.5 py-1.5 rounded-lg text-xs transition-all ${pYear === y ? "bg-white/15 text-white" : "text-slate-500 hover:text-white"}`}>{y}</button>
              ))}
              <button onClick={() => setPYear((y) => Math.min(YEAR_MAX, y + 1))} disabled={pYear >= YEAR_MAX} className="w-8 h-8 rounded-lg grid place-items-center text-slate-400 hover:text-white hover:bg-white/10 disabled:opacity-30 transition-all">▶</button>
            </div>
          )}
          {mode === "intervallo" && (
            <div className="flex flex-wrap items-center gap-2">
              <MonthYearSelect value={pFrom} onChange={setPFrom} />
              <span className="text-slate-500 text-sm">→</span>
              <MonthYearSelect value={pTo} onChange={setPTo} />
            </div>
          )}
        </div>
      </Card>

      {/* stats del periodo */}
      <div key={"ps-" + periodLabel} className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-5">
        {[
          { l: `Entrate · ${mode === "mese" ? "mese" : "periodo"}`, v: eur(pStats.entrate), tone: "text-emerald-300" },
          { l: `Spese · ${mode === "mese" ? "mese" : "periodo"}`, v: eur(pStats.uscite), tone: "text-rose-300" },
          { l: "Risparmio", v: eur(pStats.risparmio), tone: pStats.risparmio >= 0 ? "text-teal-300" : "text-rose-300" },
          mode === "mese"
            ? { l: "Media giornaliera", v: eur(mediaGiorn || 0), tone: "text-indigo-300" }
            : { l: "Patrimonio a fine periodo", v: eur(patAt(periodEndIso)), tone: "text-indigo-300" },
        ].map((s, i) => (
          <Card key={s.l} className="p-4" delay={i * 50}><p className="text-xs text-slate-400">{s.l}</p><p className={`font-display text-xl mt-1 tabular-nums ${s.tone}`}>{s.v}</p></Card>
        ))}
      </div>

      {yoy && (
        <Card className="p-4 mb-5" hover={false} delay={150}>
          <p className="text-sm text-slate-300">
            <span className="text-indigo-300">↔</span> Rispetto a <b className="text-white">{labelMk(yoy.prevMk).toLowerCase()}</b>: spese {yoy.dSpese >= 0 ? "aumentate" : "diminuite"} di <b className={yoy.dSpese >= 0 ? "text-rose-300" : "text-emerald-300"}>{eur(Math.abs(yoy.dSpese))}</b>
            {yoy.pctSpese != null && <span className="text-slate-500"> ({yoy.dSpese >= 0 ? "+" : "−"}{Math.abs(yoy.pctSpese).toFixed(0)}%)</span>}, entrate {yoy.dEntrate >= 0 ? "in crescita" : "in calo"} di <b className={yoy.dEntrate >= 0 ? "text-emerald-300" : "text-rose-300"}>{eur(Math.abs(yoy.dEntrate))}</b>.
          </p>
        </Card>
      )}

      <div className="grid lg:grid-cols-2 gap-5 mb-5">
        <Card className="p-5" hover={false} delay={200}>
          <div className="flex items-center justify-between mb-3 gap-2 flex-wrap">
            <h2 className="font-display text-white">Entrate vs uscite · {periodLabel}</h2>
            <button onClick={() => setShowTr((v) => !v)} className={`text-[11px] px-2.5 py-1 rounded-full border transition-all ${showTr ? "text-slate-200 border-slate-400/40 bg-slate-400/10" : "text-slate-500 border-white/10 hover:text-slate-300"}`}>⇄ Trasferimenti: {showTr ? "visibili" : "esclusi"}</button>
          </div>
          <div className="h-56">
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={barsData} barGap={4}>
                <CartesianGrid vertical={false} stroke="rgba(255,255,255,.05)" />
                <XAxis dataKey="mese" tick={{ fill: "#64748B", fontSize: 11 }} axisLine={false} tickLine={false} minTickGap={12} />
                <YAxis tick={{ fill: "#64748B", fontSize: 11 }} axisLine={false} tickLine={false} width={44} />
                <Tooltip content={<ChartTip />} cursor={{ fill: "rgba(255,255,255,.04)" }} />
                <Bar dataKey="Entrate" fill="#4ADE80" radius={[6, 6, 0, 0]} maxBarSize={46} animationDuration={900} />
                <Bar dataKey="Uscite" fill="#FB7185" radius={[6, 6, 0, 0]} maxBarSize={46} animationDuration={900} />
                {showTr && <Bar dataKey="Trasferiti" fill="#94A3B8" radius={[6, 6, 0, 0]} maxBarSize={46} animationDuration={700} />}
              </BarChart>
            </ResponsiveContainer>
          </div>
          <p className="text-[11px] text-slate-600 mt-2">I trasferimenti tra conti sono spostamenti interni: non contano mai come entrate, uscite, budget o risparmio.</p>
        </Card>
        <Card className="p-5" hover={false} delay={260}>
          <h2 className="font-display text-white mb-3">Spese per categoria · {periodLabel}</h2>
          <div className="flex flex-col sm:flex-row sm:items-center gap-3">
            <div className="h-40 sm:h-56 w-full sm:w-1/2 shrink-0">
              <ResponsiveContainer width="100%" height="100%">
                <PieChart>
                  <Pie data={donut} dataKey="value" innerRadius="52%" outerRadius="82%" paddingAngle={3} animationDuration={1000}>
                    {donut.map((e, i) => <Cell key={i} fill={e.fill} stroke="transparent" />)}
                  </Pie>
                  <Tooltip content={<ChartTip />} />
                </PieChart>
              </ResponsiveContainer>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-1 gap-x-4 gap-y-1.5 text-xs flex-1 sm:max-h-52 sm:overflow-y-auto sm:pr-1">
              {donut.map((d) => (
                <div key={d.name} className="flex items-center justify-between gap-2 min-w-0">
                  <span className="flex items-center gap-1.5 text-slate-300 truncate"><span className="w-2 h-2 rounded-full shrink-0" style={{ background: d.fill }} />{d.name}</span>
                  <span className="text-slate-400 tabular-nums shrink-0">{eur(d.value)}</span>
                </div>
              ))}
              {donut.length === 0 && <p className="text-slate-500 col-span-2">Nessuna spesa nel periodo.</p>}
            </div>
          </div>
        </Card>
      </div>
      {heat && (
        <Card className="p-5 mb-8" hover={false} delay={320}>
          <h2 className="font-display text-white mb-3">Intensità di spesa · {labelMk(pMk).toLowerCase()}</h2>
          <div className="grid gap-1.5" style={{ gridTemplateColumns: "repeat(auto-fill, minmax(24px, 1fr))" }}>
            {heat.arr.map((x) => (
              <div key={x.d} title={`Giorno ${x.d}: ${eur(x.v)}`} className="aspect-square rounded-md transition-transform hover:scale-110 grid place-items-center text-[9px] text-slate-500" style={{ background: x.v === 0 ? "rgba(255,255,255,.04)" : `rgba(139,157,249,${0.15 + 0.75 * (x.v / heat.max)})` }}>{x.d}</div>
            ))}
          </div>
        </Card>
      )}

      {/* ==================== VISTA ANNUALE ==================== */}
      <header className="mb-4 flex items-end justify-between gap-3 flex-wrap" style={{ animation: "fadeUp .5s both" }}>
        <div>
          <p className="text-xs uppercase tracking-[0.2em] text-slate-500">Vista annuale</p>
          <h1 className="font-display text-xl sm:text-2xl text-white mt-1">L'anno in prospettiva</h1>
        </div>
        <div className="flex gap-1 bg-white/5 rounded-xl p-1 flex-wrap">
          {years.filter((y) => y >= YEAR_MIN && y <= YEAR_MAX).sort((a, b) => a - b).map((y) => (
            <button key={y} onClick={() => setYear(y)} className={`px-3 py-1 rounded-lg text-xs transition-all ${year === y ? "bg-white/15 text-white" : "text-slate-400 hover:text-white"}`}>{y}</button>
          ))}
        </div>
      </header>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-5">
        {[
          { l: `Entrate ${year}`, v: eur(annual.totEntrate), tone: "text-emerald-300" },
          { l: `Spese ${year}`, v: eur(annual.totSpese), tone: "text-rose-300" },
          { l: "Risparmio totale", v: eur(annual.risparmioTot), tone: annual.risparmioTot >= 0 ? "text-teal-300" : "text-rose-300" },
          { l: "Media spese / mese", v: eur(annual.media), tone: "text-indigo-300" },
        ].map((s, i) => (
          <Card key={s.l} className="p-4" delay={i * 50}><p className="text-xs text-slate-400">{s.l}</p><p className={`font-display text-xl mt-1 tabular-nums ${s.tone}`}>{s.v}</p></Card>
        ))}
      </div>
      <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-5">
        <Card className="p-4" delay={80}><p className="text-xs text-slate-400">Mese più costoso</p><p className="text-white mt-1">{annual.maxSpesa ? `${annual.maxSpesa.mese} · ${eur(annual.maxSpesa.Spese)}` : "—"}</p></Card>
        <Card className="p-4" delay={130}><p className="text-xs text-slate-400">Miglior risparmio</p><p className="text-white mt-1">{annual.maxRisp ? `${annual.maxRisp.mese} · ${eur(annual.maxRisp.Risparmio)}` : "—"}</p></Card>
        <Card className="p-4" delay={180}><p className="text-xs text-slate-400">Categoria più costosa</p><p className="text-white mt-1 truncate">{annual.topSum ? `${catById[annual.topSum[0]]?.icona || ""} ${catById[annual.topSum[0]]?.nome || "?"} · ${eur(annual.topSum[1])}` : "—"}</p></Card>
        <Card className="p-4" delay={230}><p className="text-xs text-slate-400">Categoria più usata</p><p className="text-white mt-1 truncate">{annual.topCount ? `${catById[annual.topCount[0]]?.icona || ""} ${catById[annual.topCount[0]]?.nome || "?"} · ${annual.topCount[1]} volte` : "—"}</p></Card>
      </div>
      <Card className="p-4 mb-5" hover={false} delay={260}>
        <div className="flex items-center gap-3">
          <span className="text-lg">{crescita >= 0 ? "📈" : "📉"}</span>
          <p className="text-sm text-slate-300">
            Patrimonio {crescita >= 0 ? "cresciuto" : "diminuito"} di <b className={crescita >= 0 ? "text-emerald-300" : "text-rose-300"}>{eur(Math.abs(crescita))}</b>
            {crescitaPct != null && <span className="text-slate-500"> ({crescita >= 0 ? "+" : "−"}{Math.abs(crescitaPct).toFixed(1)}%)</span>} rispetto a fine {year - 1}.
          </p>
        </div>
      </Card>

      <Card className="p-5 mb-5" hover={false} delay={300}>
        <h2 className="font-display text-white mb-3">Spese mensili · {year}</h2>
        <div className="h-60">
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={annual.rows} barGap={3}>
              <CartesianGrid vertical={false} stroke="rgba(255,255,255,.05)" />
              <XAxis dataKey="mese" tick={{ fill: "#64748B", fontSize: 11 }} axisLine={false} tickLine={false} />
              <YAxis tick={{ fill: "#64748B", fontSize: 11 }} axisLine={false} tickLine={false} width={44} />
              <Tooltip content={<ChartTip />} cursor={{ fill: "rgba(255,255,255,.04)" }} />
              <Bar dataKey="Spese" radius={[6, 6, 0, 0]} maxBarSize={46} animationDuration={900}>
                {annual.rows.map((r, i) => <Cell key={i} fill={annual.maxSpesa && r.m === annual.maxSpesa.m && r.Spese > 0 ? "#FB7185" : "#8B9DF9"} fillOpacity={r.futuro ? 0.15 : 0.9} />)}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </Card>

      <Card className="p-5 mb-5" hover={false} delay={340}>
        <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
          <h2 className="font-display text-white">Evoluzione patrimonio · {year}</h2>
          <button onClick={() => setCompare((v) => !v)} className={`text-[11px] px-2.5 py-1 rounded-full border transition-all ${compare ? "text-indigo-200 border-indigo-400/40 bg-indigo-400/10" : "text-slate-500 border-white/10 hover:text-slate-300"}`}>Confronta con {year - 1}</button>
        </div>
        <div className="h-64">
          <ResponsiveContainer width="100%" height="100%">
            <ComposedChart data={patSeries}>
              <defs>
                <linearGradient id="gy" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#8B9DF9" stopOpacity={0.4} />
                  <stop offset="100%" stopColor="#8B9DF9" stopOpacity={0} />
                </linearGradient>
              </defs>
              <CartesianGrid vertical={false} stroke="rgba(255,255,255,.05)" />
              <XAxis dataKey="mese" tick={{ fill: "#64748B", fontSize: 11 }} axisLine={false} tickLine={false} />
              <YAxis tick={{ fill: "#64748B", fontSize: 11 }} axisLine={false} tickLine={false} width={52} />
              <Tooltip content={<ChartTip />} />
              <Area type="monotone" dataKey={String(year)} name={`Patrimonio ${year}`} stroke="#A5B4FC" strokeWidth={2.5} fill="url(#gy)" animationDuration={1000} connectNulls={false} />
              <Line type="monotone" dataKey="Risparmio accumulato" stroke="#5EEAD4" strokeWidth={2} dot={false} animationDuration={1100} connectNulls={false} />
              {compare && <Line type="monotone" dataKey={String(year - 1)} name={`Patrimonio ${year - 1}`} stroke="#94A3B8" strokeWidth={1.5} strokeDasharray="5 4" dot={false} animationDuration={800} connectNulls={false} />}
            </ComposedChart>
          </ResponsiveContainer>
        </div>
        <div className="flex gap-4 mt-2 text-[11px] text-slate-500 flex-wrap">
          <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-indigo-300" />Patrimonio {year}</span>
          <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-teal-300" />Risparmio accumulato da inizio anno</span>
          {compare && <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-slate-400" />Patrimonio {year - 1}</span>}
        </div>
      </Card>

      <Card className="p-5" hover={false} delay={380}>
        <h2 className="font-display text-white mb-3">Mese per mese · {year}</h2>
        <div className="overflow-x-auto -mx-1 px-1">
          <table className="w-full text-[13px] sm:text-sm min-w-[26rem]">
            <thead>
              <tr className="text-left text-[11px] uppercase tracking-wider text-slate-500">
                <th className="py-2 pr-3 font-normal">Mese</th>
                <th className="py-2 pr-3 font-normal text-right">Entrate</th>
                <th className="py-2 pr-3 font-normal text-right">Spese</th>
                <th className="py-2 pr-3 font-normal text-right">Investiti</th>
                <th className="py-2 font-normal text-right">Risparmio</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-white/[0.05]">
              {annual.rows.map((r) => {
                const isMax = annual.maxSpesa && r.m === annual.maxSpesa.m && r.Spese > 0;
                const isBest = annual.maxRisp && r.m === annual.maxRisp.m && r.Risparmio > 0;
                return (
                  <tr key={r.m} className="hover:bg-white/[0.03] transition-colors">
                    <td className={`py-2 pr-3 ${r.futuro ? "text-slate-600" : "text-slate-200"}`}>{r.mese} {isMax && <span title="Mese più costoso">🔥</span>}{isBest && <span title="Miglior risparmio">🏆</span>}</td>
                    <td className="py-2 pr-3 text-right tabular-nums text-emerald-300/90">{r.Entrate ? eur(r.Entrate) : "—"}</td>
                    <td className={`py-2 pr-3 text-right tabular-nums ${isMax ? "text-rose-300 font-medium" : "text-slate-300"}`}>{r.Spese ? eur(r.Spese) : "—"}</td>
                    <td className="py-2 pr-3 text-right tabular-nums text-slate-400">{r.Investimenti ? eur(r.Investimenti) : "—"}</td>
                    <td className={`py-2 text-right tabular-nums ${isBest ? "text-teal-300 font-medium" : r.Risparmio < 0 ? "text-rose-300/90" : "text-slate-300"}`}>{r.Entrate || r.Spese ? eur(r.Risparmio) : "—"}</td>
                  </tr>
                );

              <Select value={syncCfg.provider || "sheets"} onChange={(e) => saveSyncCfg({ ...syncCfg, provider: e.target.value })}>

                <div><Label>Anon Public Key</Label><Input type="password" value={syncCfg.supabaseKey || ""} onChange={(e) => saveSyncCfg({ ...syncCfg, supabaseKey: e.target.value })} placeholder="eyJh..." /></div>

            <div className="flex flex-wrap items-center justify-between gap-3 mt-4 p-3 rounded-xl bg-white/5 border border-white/10">
              <div className="flex items-center gap-2 text-sm text-slate-300">

                {syncState === "pulling" ? "Lettura..." : syncState === "pushing" ? "Scrittura..." : syncState === "error" ? "Errore di sync" : pendingPush ? "In attesa..." : syncCfg.lastSync ? `Sincronizzato (${new Date(syncCfg.lastSync).toLocaleDateString("it-IT")} ${new Date(syncCfg.lastSync).toLocaleTimeString("it-IT", {hour: '2-digit', minute:'2-digit'})})` : "Mai sincronizzato"}
              </div>
              <div className="flex gap-2">
                <BtnGhost onClick={pullNow} disabled={syncState === "pulling" || syncState === "pushing"} className="!py-1.5 !text-xs">⬇ Ricevi</BtnGhost>
                <BtnPrimary onClick={() => pushNow(data, false)} disabled={syncState === "pulling" || syncState === "pushing"} className="!py-1.5 !text-xs">⬆ Invia</BtnPrimary>
              </div>
            </div>
            
            <label className="flex items-center gap-2 cursor-pointer mt-2 w-max">
              <input type="checkbox" className="rounded border-white/10 bg-white/5 text-indigo-400 focus:ring-indigo-400/30" checked={syncCfg.autoPush !== false} onChange={(e) => saveSyncCfg({ ...syncCfg, autoPush: e.target.checked })} />
              <span className="text-xs text-slate-400">Invia automaticamente le modifiche al database (Auto-Push)</span>
            </label>
          </div>
        )}
      </Card>
      {/* --- FINE SEZIONE SINCRONIZZAZIONE --- */}

      <DriveSettings data={data} update={update} notify={notify} />
      <QuotesSettings data={data} update={update} notify={notify} />

      <Card className="p-5 mb-4" hover={false} delay={60}>
        <h2 className="font-display text-white mb-1">Esporta e importa</h2>
        <p className="text-xs text-slate-500 mb-4">Tutti i tuoi dati, sempre tuoi. Il salvataggio è comunque automatico e persistente.</p>
        <div className="flex flex-wrap gap-3">
          <BtnPrimary onClick={exportXLSX}>Excel (.xlsx)</BtnPrimary>
          <BtnGhost onClick={exportCSV}>CSV</BtnGhost>
          <BtnGhost onClick={exportJSON}>Backup JSON</BtnGhost>
          <BtnGhost onClick={() => fileRef.current?.click()}>Importa JSON</BtnGhost>
          <input ref={fileRef} type="file" accept=".json" className="hidden" onChange={importJSON} />
        </div>
      </Card>

      <Card className="p-5 mb-4" hover={false} delay={120}>
        <div className="flex items-center justify-between mb-3">
          <div>
            <h2 className="font-display text-white">Backup automatici</h2>
            <p className="text-xs text-slate-500 mt-0.5">Creati periodicamente durante l'uso. Ripristino con un clic.</p>
          </div>
          <BtnGhost onClick={manualBackup}>Crea ora</BtnGhost>
        </div>
        <div className="space-y-2">
          {backups.map((b) => (
            <div key={b.slot} className="flex items-center justify-between p-3 rounded-xl bg-white/[0.04] border border-white/[0.06]">
              <div>
                <p className="text-sm text-white">{new Date(b.ts).toLocaleString("it-IT")}</p>
                <p className="text-xs text-slate-500">{b.n} movimenti</p>
              </div>
              <BtnGhost onClick={() => restoreBackup(b.slot)} className="!py-1.5 !text-xs">Ripristina</BtnGhost>
            </div>
          ))}
          {backups.length === 0 && <p className="text-xs text-slate-500">Nessun backup ancora: verranno creati automaticamente mentre usi l'app.</p>}
        </div>
      </Card>

      <Card className="p-5 mb-4" hover={false} delay={180}>
        <h2 className="font-display text-white mb-1">Cestino</h2>
        <p className="text-xs text-slate-500 mb-3">I movimenti eliminati restano qui finché non decidi tu.</p>
        <div className="space-y-2">
          {trash.map((t) => (
            <div key={t.id} className="flex items-center justify-between p-3 rounded-xl bg-white/[0.04] border border-white/[0.06]">
              <div className="min-w-0">
                <p className="text-sm text-white truncate">{t.note || catById[t.categoria]?.nome} · {eur(t.importo)}</p>
                <p className="text-xs text-slate-500">Eliminato il {new Date(t.deletedAt).toLocaleDateString("it-IT")}</p>
              </div>
              <div className="flex gap-2 shrink-0">
                <BtnGhost onClick={() => restoreTx(t.id)} className="!py-1.5 !text-xs">Ripristina</BtnGhost>
                <button onClick={() => hardDelete(t.id)} className="text-xs text-rose-300/80 hover:text-rose-300 px-2 transition-colors">Elimina</button>
              </div>
            </div>
          ))}
          {trash.length === 0 && <p className="text-xs text-slate-500">Il cestino è vuoto.</p>}
        </div>
      </Card>

      <Card className="p-5" hover={false} delay={240}>
        <h2 className="font-display text-white mb-1">Zona rossa</h2>
        <p className="text-xs text-slate-500 mb-3">Azioni irreversibili, con doppia conferma.</p>
        <BtnGhost onClick={() => setConfirmDlg({ msg: "Azzerare TUTTI i dati e ripartire da zero? Viene creato un backup automatico prima dell'azzeramento.", onOk: async () => { await manualBackup(); setData(freshData(false)); notify("Dati azzerati (backup disponibile)"); } })} className="!text-rose-300 hover:!bg-rose-500/10">Azzera tutti i dati</BtnGhost>
      </Card>
    </div>
  );
}

/* ---- Selettore categorie stile Notion/GitHub labels ---- */
function CategoryPicker({ data, value, tipoEntrata, onSelect, onEditCat, onCreate }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const boxRef = useRef(null);
  const inputRef = useRef(null);
  useEffect(() => {
    const h = (e) => { if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, []);
  useEffect(() => { if (open) setTimeout(() => inputRef.current?.focus(), 40); else setQ(""); }, [open]);

  const sel = data.categories.find((c) => c.id === value);
  const cats = [...data.categories].sort((a, b) => a.ordine - b.ordine).filter((c) => (tipoEntrata ? getCategoryGroups(c).includes("Entrate") : !getCategoryGroups(c).includes("Entrate")));
  const ql = q.trim().toLowerCase();
  const filtered = ql ? cats.filter((c) => c.nome.toLowerCase().includes(ql) || getCategoryGroupLabel(c).toLowerCase().includes(ql)) : cats;
  const exactMatch = cats.some((c) => c.nome.toLowerCase() === ql);
  const canCreate = ql.length > 0 && !exactMatch;

  const pick = (id) => { onSelect(id); setOpen(false); };
  const onKey = (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      if (filtered.length > 0) pick(filtered[0].id);
      else if (canCreate) { onCreate(q.trim()); setOpen(false); }
    }
    if (e.key === "Escape") setOpen(false);
  };

  return (
    <div className="relative" ref={boxRef}>
      <button type="button" onClick={() => setOpen((o) => !o)} className={`w-full flex items-center gap-2 bg-white/5 border rounded-xl px-3 py-2 text-sm text-left transition-all ${open ? "border-indigo-400/60 bg-white/[0.07]" : "border-white/10 hover:border-white/25"}`}>
        {sel ? (
          <>
            <span className="w-6 h-6 rounded-lg grid place-items-center text-sm" style={{ background: sel.colore + "1f", border: `1px solid ${sel.colore}33` }}>{sel.icona}</span>
            <span className="text-white">{sel.nome}</span>
            <span className="text-[10px] text-slate-500 uppercase tracking-wider">{getCategoryGroupLabel(sel)}</span>
          </>
        ) : (
          <span className="text-slate-500">Cerca o crea una categoria…</span>
        )}
        <span className={`ml-auto text-slate-500 text-xs transition-transform ${open ? "rotate-180" : ""}`}>▾</span>
      </button>

      {open && (
        <div className="absolute z-30 mt-1.5 w-full glass-strong rounded-xl overflow-hidden shadow-2xl" style={{ animation: "popIn .18s cubic-bezier(.22,1,.36,1) both" }}>
          <input ref={inputRef} value={q} onChange={(e) => setQ(e.target.value)} onKeyDown={onKey} placeholder="Digita per cercare o creare…" className="w-full bg-transparent px-3 py-2.5 text-sm text-white placeholder-slate-500 outline-none border-b border-white/10" />
          <div className="max-h-52 overflow-y-auto p-1">
            {filtered.map((c) => (
              <div key={c.id} className={`group flex items-center gap-2 px-2 py-1.5 rounded-lg cursor-pointer transition-colors ${value === c.id ? "bg-indigo-400/15" : "hover:bg-white/[0.07]"}`} onClick={() => pick(c.id)}>
                <span className="w-6 h-6 rounded-lg grid place-items-center text-sm shrink-0" style={{ background: c.colore + "1f", border: `1px solid ${c.colore}33` }}>{c.icona}</span>
                <span className="text-sm text-slate-200 truncate">{c.nome}</span>
                <span className="text-[10px] text-slate-600 uppercase tracking-wider">{getCategoryGroupLabel(c)}</span>
                {c.sottocategorie?.length > 0 && <span className="text-[10px] text-slate-600">· {c.sottocategorie.length} sub</span>}
                <button type="button" onClick={(e) => { e.stopPropagation(); onEditCat(c); setOpen(false); }} title="Modifica categoria" className="ml-auto w-6 h-6 rounded-md text-xs text-slate-500 opacity-0 group-hover:opacity-100 hover:bg-white/10 hover:text-white transition-all shrink-0">✎</button>
              </div>
            ))}
            {filtered.length === 0 && !canCreate && <p className="text-xs text-slate-500 px-2 py-3">Nessuna categoria.</p>}
            {canCreate && (
              <button type="button" onClick={() => { onCreate(q.trim()); setOpen(false); }} className="w-full flex items-center gap-2 px-2 py-2 rounded-lg text-sm text-indigo-300 hover:bg-indigo-400/10 transition-colors" style={{ animation: "fadeUp .2s both" }}>
                <span className="w-6 h-6 rounded-lg grid place-items-center bg-indigo-400/15 border border-indigo-400/30">＋</span>
                Crea "{q.trim()}"
              </button>
            )}
            {!ql && (
              <button type="button" onClick={() => { onCreate(""); setOpen(false); }} className="w-full flex items-center gap-2 px-2 py-2 rounded-lg text-xs text-slate-400 hover:bg-white/[0.07] hover:text-white transition-colors">
                <span className="w-6 h-6 rounded-lg grid place-items-center bg-white/5 border border-white/10">＋</span>
                Nuova categoria…
              </button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function TxModal({ open, tx, onClose, onSave, data, setCatEditor, onDelete }) {
  const isEdit = !!tx?.id;
  const [form, setForm] = useState(null);

  // 1. DEFINIAMO LE LISTE IN ALTO: d'ora in poi modifichi solo queste!
  const metodiSpesa = ["Carta di Debito", "Bonifico", "Contanti", "SDD", "Carta di Credito", "Wallet Digitale", "Carta Prepagata", "Altro"];
  const metodiEntrata = ["Bonifico", "Accredito", "Contanti", "Altro"];
  
  // Funzione di supporto per generare la descrizione automatica
  const getTransferNote = (contoId, contoDestId) => {
    const nomeOrigine = data.accounts.find((a) => a.id === contoId)?.nome || "";
    const nomeDestinazione = data.accounts.find((a) => a.id === contoDestId)?.nome || "";
    return `Trasferimento: ${nomeOrigine} ➔ ${nomeDestinazione}`;
  };

  useEffect(() => {
    if (open) {
      const initialTipo = tx?.tipo || "spesa";
      const initialConto = tx?.conto || data.accounts[0]?.id || "";
      const initialContoDest = tx?.contoDest || data.accounts[1]?.id || "";
      
      let initialNote = tx?.note || "";
      if (!tx?.id && initialTipo === "trasferimento") {
        initialNote = getTransferNote(initialConto, initialContoDest);
      }

      // 2. PESCHIAMO SEMPRE IL PRIMO VALORE DINAMICAMENTE!
      let defaultMetodo = initialTipo === "entrata" ? metodiEntrata[0] : metodiSpesa[0];
      if (initialTipo === "trasferimento") defaultMetodo = "Trasferimento";

      setForm({ 
        tipo: initialTipo, 
        importo: tx?.importo || "", 
        data: tx?.data || todayISO(), 
        categoria: tx?.categoria || "", 
        gruppo: tx?.gruppo || "", 
        sottocategoria: tx?.sottocategoria || "", 
        conto: initialConto, 
        contoDest: initialContoDest, 
        metodo: tx?.metodo || defaultMetodo, 
        note: initialNote, 
        tags: (tx?.tags || []).join(", "), 
        id: tx?.id 
      });
    }
  }, [open, tx, data]);
  
  if (!open || !form) return null;
  
  const isTr = form.tipo === "trasferimento";
  const selCat = data.categories.find((c) => c.id === form.categoria);
  const catGroups = getCategoryGroups(selCat);
  const spendGroups = catGroups.filter((g) => g !== "Entrate");
  const showGroupSelect = !isTr && form.tipo !== "entrata" && spendGroups.length > 1;
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  // 3. (Rimosso da qui perché l'abbiamo spostato in alto)
  let metodiAttuali = form.tipo === "entrata" ? [...metodiEntrata] : [...metodiSpesa];
  
  if (form.metodo && form.metodo !== "Trasferimento" && !metodiAttuali.includes(form.metodo)) {
    metodiAttuali.push(form.metodo);
  }

  const submit = () => {
    const importo = Number(form.importo);
    if (!(importo > 0)) return;
    if (isTr) {
      if (!form.conto || !form.contoDest || form.conto === form.contoDest) return;
      onSave({ id: form.id, tipo: "trasferimento", importo, data: form.data, conto: form.conto, contoDest: form.contoDest, categoria: null, sottocategoria: "", metodo: "Trasferimento", note: form.note, tags: [] });
    } else {
      if (!form.categoria) return;
      const gruppo = form.gruppo || (spendGroups[0] || (form.tipo === "entrata" ? "Entrate" : "Wants"));
      onSave({ ...form, contoDest: undefined, importo, gruppo, tags: form.tags.split(",").map((s) => s.trim()).filter(Boolean) });
    }
  };

  return (
    <Modal open={open} onClose={onClose} title={isEdit ? "Modifica movimento" : "Nuovo movimento"}>
      <div className="flex gap-1 bg-white/5 rounded-xl p-1 mb-4">
        {[{ v: "spesa", l: "Spesa" }, { v: "entrata", l: "Entrata" }, { v: "trasferimento", l: "Trasferimento" }].map((t) => (
          <button 
            key={t.v} 
            onClick={() => {
              const newMetodi = t.v === "entrata" ? metodiEntrata : metodiSpesa;
              setForm((f) => {
                let newNote = f.note;
                if (t.v === "trasferimento") {
                  if (!newNote || newNote.startsWith("Trasferimento:")) {
                    newNote = getTransferNote(f.conto, f.contoDest);
                  }
                } else if (f.tipo === "trasferimento" && newNote.startsWith("Trasferimento:")) {
                  newNote = ""; 
                }

                return { 
                  ...f, 
                  tipo: t.v, 
                  categoria: t.v === f.tipo ? f.categoria : "", 
                  sottocategoria: "",
                  metodo: t.v === "trasferimento" ? "Trasferimento" : (newMetodi.includes(f.metodo) ? f.metodo : newMetodi[0]),
                  note: newNote
                };
              });
            }} 
            className={`flex-1 py-1.5 rounded-lg text-sm transition-all ${form.tipo === t.v ? "bg-white/15 text-white" : "text-slate-400"}`}
          >
            {t.l}
          </button>
        ))}
      </div>
      {isTr && <p className="text-[11px] text-slate-500 mb-3 -mt-1">Sposta denaro tra i tuoi conti: non conta come spesa né come entrata, e il patrimonio totale resta invariato.</p>}
      <div className="space-y-3">
        {/* DESCRIZIONE */}
        <div>
          <Label>Descrizione</Label>
          <Input placeholder="Descrizione spesa…" value={form.note} onChange={(e) => set("note", e.target.value)} autoFocus />
        </div>
        
        {/* IMPORTO E DATA AFFIANCATI */}
        <div className="flex w-full gap-3">
          <div className="flex-1 min-w-0">
            <Label>Importo</Label>
            <Input 
              type="number" 
              inputMode="decimal" 
              step="0.01" 
              placeholder="0,00" 
              value={form.importo} 
              onChange={(e) => set("importo", e.target.value)}
              style={{ width: "100%", minWidth: 0 }}
            />
          </div>
          <div className="flex-1 min-w-0">
            <Label>Data</Label>
            <Input 
              type="date" 
              value={form.data} 
              onChange={(e) => set("data", e.target.value)} 
              style={{ width: "100%", minWidth: 0, paddingLeft: "8px", paddingRight: "8px" }} 
            />
          </div>
        </div>

        {isTr ? (
          <>
            {/* TRASFERIMENTI: CONTI AFFIANCATI */}
            <div className="grid grid-cols-2 gap-3">
              <div className="min-w-0">
                <Label>Dal conto</Label>
                <Select 
                  value={form.conto} 
                  onChange={(e) => {
                    const nuovoConto = e.target.value;
                    setForm((f) => {
                      let nuovoContoDest = f.contoDest;
                      
                      // Controllo anti-conflitto
                      if (nuovoConto === f.contoDest) {
                        nuovoContoDest = data.accounts.find((a) => a.id !== nuovoConto)?.id || "";
                      }
                      
                      return { 
                        ...f, 
                        conto: nuovoConto, 
                        contoDest: nuovoContoDest,
                        note: getTransferNote(nuovoConto, nuovoContoDest) 
                      };
                    });
                  }}
                >
                  {data.accounts.map((a) => <option key={a.id} value={a.id}>{a.nome}</option>)}
                </Select>
              </div>
              <div className="min-w-0">
                <Label>Al conto</Label>
                <Select 
                  value={form.contoDest} 
                  onChange={(e) => {
                    const nuovoContoDest = e.target.value;
                    setForm((f) => ({ ...f, contoDest: nuovoContoDest, note: getTransferNote(f.conto, nuovoContoDest) }));
                  }}
                >
                  {data.accounts.filter((a) => a.id !== form.conto).map((a) => <option key={a.id} value={a.id}>{a.nome}</option>)}
                </Select>
              </div>
            </div>
          </>
        ) : (
          <>
            {/* CONTO E METODO AFFIANCATI */}
            <div className="grid grid-cols-2 gap-3">
              <div className="min-w-0"><Label>Conto</Label><Select value={form.conto} onChange={(e) => set("conto", e.target.value)}>{data.accounts.map((a) => <option key={a.id} value={a.id}>{a.nome}</option>)}</Select></div>
              <div className="min-w-0">
                <Label>Metodo</Label>
                <Select value={form.metodo} onChange={(e) => set("metodo", e.target.value)}>
                  {metodiAttuali.map((m) => <option key={m}>{m}</option>)}
                </Select>
              </div>
            </div>
            
            {/* CATEGORIA */}
            <div>
              <Label>Categoria</Label>
              <Select 
                value={form.categoria} 
                onChange={(e) => {
                  const id = e.target.value;
                  const cat = data.categories.find((c) => c.id === id);
                  const groups = cat ? getCategoryGroups(cat) : [];
                  setForm((f) => ({ 
                    ...f, 
                    categoria: id, 
                    sottocategoria: "", 
                    gruppo: groups.includes(f.gruppo) ? f.gruppo : groups[0] || "" 
                  }));
                }}
              >
                <option value="">Seleziona categoria...</option>
                {data.categories
                  .filter((c) => form.tipo === "entrata" ? getCategoryGroups(c).includes("Entrate") : !getCategoryGroups(c).includes("Entrate"))
                  .sort((a, b) => a.ordine - b.ordine)
                  .map((c) => (
                    <option key={c.id} value={c.id}>{c.icona} {c.nome}</option>
                  ))
                }
              </Select>
            </div>

            {showGroupSelect && (
              <div style={{ animation: "fadeUp .3s both" }}>
                <Label>Gruppo di spesa</Label>
                <Select value={form.gruppo || spendGroups[0]} onChange={(e) => set("gruppo", e.target.value)}>
                  {spendGroups.map((g) => <option key={g} value={g}>{g}</option>)}
                </Select>
              </div>
            )}
            
            {selCat?.sottocategorie?.length > 0 && (
              <div style={{ animation: "fadeUp .3s both" }}>
                <Label>Sottocategoria</Label>
                <Select value={form.sottocategoria} onChange={(e) => set("sottocategoria", e.target.value)}>
                  <option value="">Nessuna</option>
                  {selCat.sottocategorie.map((s) => <option key={s} value={s}>{s}</option>)}
                </Select>
              </div>
            )}

            <div className="min-w-0">
              <Label>Tag</Label>
              <Input placeholder="es. vacanza..." value={form.tags} onChange={(e) => set("tags", e.target.value)} />
            </div>
          </>
        )}
      </div>
      {/* SEZIONE PULSANTI */}
      <div className="flex flex-row justify-between items-center mt-6 w-full gap-2">
        <div className="shrink-0">
          {/* Mostra Elimina solo se stiamo modificando un movimento esistente */}
          {isEdit && (
            <button 
              onClick={() => {
                onDelete(tx.id, () => onClose()); 
              }} 
              className="text-sm font-medium text-rose-400 hover:text-rose-300 active:scale-95 transition-all px-1 py-2"
            >
              Elimina
            </button>
          )}
        </div>
        <div className="flex flex-row items-center gap-2 sm:gap-3 shrink-0">
          <BtnGhost onClick={onClose}>Annulla</BtnGhost>
          <BtnPrimary onClick={submit}>{isEdit ? "Salva" : isTr ? "Trasferisci" : "Aggiungi"}</BtnPrimary>
        </div>
      </div>
    </Modal>
  );
}

function CommandPalette({ open, onClose, nav, setPage, txs, catById, onNew }) {
  const [q, setQ] = useState("");
  const ref = useRef(null);
  useEffect(() => { if (open) { setQ(""); setTimeout(() => ref.current?.focus(), 60); } }, [open]);
  if (!open) return null;
  const ql = q.toLowerCase();
  const pages = nav.filter((n) => n.label.toLowerCase().includes(ql));
  const found = q.length > 1 ? txs.filter((t) => `${t.note || ""} ${catById[t.categoria]?.nome || ""}`.toLowerCase().includes(ql)).slice(0, 5) : [];
  return (
    <div className="fixed inset-0 z-[95] flex items-start justify-center pt-20 sm:pt-24 p-4" style={{ animation: "fadeIn .15s both" }}>
      <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={onClose} />
      <div className="relative glass-strong rounded-2xl w-full max-w-lg overflow-hidden" style={{ animation: "popIn .25s cubic-bezier(.22,1,.36,1) both" }}>
        <input ref={ref} value={q} onChange={(e) => setQ(e.target.value)} placeholder="Cerca pagine, movimenti, azioni…" className="w-full bg-transparent px-5 py-4 text-white placeholder-slate-500 outline-none border-b border-white/10" />
        <div className="max-h-72 overflow-y-auto p-2">
          <p className="px-3 py-1 text-[10px] uppercase tracking-wider text-slate-500">Azioni</p>
          <button onClick={() => { onNew(); onClose(); }} className="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-200 hover:bg-white/10 transition-colors">＋ Nuovo movimento</button>
          <p className="px-3 py-1 mt-1 text-[10px] uppercase tracking-wider text-slate-500">Pagine</p>
          {pages.map((n) => (
            <button key={n.id} onClick={() => { setPage(n.id); onClose(); }} className="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-200 hover:bg-white/10 transition-colors flex items-center gap-2"><span className="opacity-70">{n.icon}</span>{n.label}</button>
          ))}
          {found.length > 0 && <p className="px-3 py-1 mt-1 text-[10px] uppercase tracking-wider text-slate-500">Movimenti</p>}
          {found.map((t) => (
            <button key={t.id} onClick={() => { setPage("movimenti"); onClose(); }} className="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-white/10 transition-colors flex justify-between">
              <span className="truncate">{catById[t.categoria]?.icona} {t.note || catById[t.categoria]?.nome}</span>
              <span className="text-slate-500 tabular-nums shrink-0 ml-3">{eur(t.importo)}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

const EmptyState = ({ text }) => <p className="text-sm text-slate-500 py-6 text-center">{text}</p>;

/* ------------------ Stili globali ------------------ */
